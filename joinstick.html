<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>JOINSTICK — App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    width: 402px; height: 874px; overflow: hidden;
    background: #000;
  }
  /* Hide scrollbars (app is embedded in an iframe) — scrolling still works */
  *::-webkit-scrollbar { width: 0 !important; height: 0 !important; display: none !important; }
  * { scrollbar-width: none !important; -ms-overflow-style: none !important; }
  :root { --bp-red: #ED4724; }

  /* flame motion — independent licking tongues for an organic, dancing fire */
  @keyframes bpLick1 {
    0%, 100% { transform: scaleY(1) scaleX(1) skewX(0deg); }
    22% { transform: scaleY(1.07) scaleX(0.965) skewX(-2.4deg); }
    52% { transform: scaleY(0.95) scaleX(1.03) skewX(1.8deg); }
    78% { transform: scaleY(1.035) scaleX(0.985) skewX(-1deg); }
  }
  @keyframes bpLick2 {
    0%, 100% { transform: scaleY(1) skewX(0deg) translateX(0); }
    28% { transform: scaleY(1.14) skewX(4.5deg) translateX(1.2px); }
    58% { transform: scaleY(0.9) skewX(-4deg) translateX(-1.4px); }
    82% { transform: scaleY(1.06) skewX(2deg) translateX(0.6px); }
  }
  @keyframes bpLick3 {
    0%, 100% { transform: scaleY(0.97) skewX(0deg); }
    34% { transform: scaleY(1.2) skewX(-6.5deg); }
    66% { transform: scaleY(0.86) skewX(5.5deg); }
  }
  @keyframes bpCorePulse {
    0%, 100% { transform: scaleY(1) translateY(0); opacity: 1; }
    40% { transform: scaleY(1.12) translateY(-2px); opacity: 0.92; }
    68% { transform: scaleY(0.93) translateY(1px); opacity: 1; }
  }
  @keyframes bpTongue {
    0% { opacity: 0; transform: translateY(8px) scaleY(0.35) scaleX(0.9); }
    24% { opacity: 0.9; }
    100% { opacity: 0; transform: translateY(-34px) scaleY(1.5) scaleX(0.42); }
  }
  @keyframes bpBaseFlicker {
    0%, 100% { opacity: 0.55; transform: translateX(-50%) scaleX(1); }
    50% { opacity: 0.9; transform: translateX(-50%) scaleX(1.14); }
  }
  @keyframes bpGlow {
    0%, 100% { opacity: 0.82; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.05); }
  }
  /* low-poly sprite flicker — exactly one faceted frame visible at a time */
  @keyframes bpFrameCycle {
    0%, 33.32% { opacity: 1; }
    33.33%, 100% { opacity: 0; }
  }
  /* fluid aura — slow drifting gradient fields + pulsing star core */
  @keyframes bpAuraA { 0%,100% { transform: translate(-50%,-50%) scale(1) rotate(0deg); } 50% { transform: translate(-54%,-46%) scale(1.08) rotate(4deg); } }
  @keyframes bpAuraB { 0%,100% { transform: translate(-50%,-50%) scale(1); } 50% { transform: translate(-45%,-55%) scale(1.12); } }
  @keyframes bpAuraC { 0%,100% { transform: translate(-50%,-50%) scale(1.03); } 50% { transform: translate(-53%,-43%) scale(0.92); } }
  @keyframes bpAuraD { 0%,100% { transform: translate(-50%,-50%) scale(0.95); } 50% { transform: translate(-47%,-54%) scale(1.1); } }
  @keyframes bpAuraBreathe { 0%,100% { opacity: 0.82; transform: translate(-50%,-50%) scale(1); } 50% { opacity: 1; transform: translate(-50%,-50%) scale(1.07); } }
  @keyframes bpStarPulse { 0%,100% { transform: translate(-50%,-50%) scale(1); opacity: 0.88; } 50% { transform: translate(-50%,-50%) scale(1.2); opacity: 1; } }
  @keyframes bpStarSpin { from { transform: translate(-50%,-50%) rotate(0deg); } to { transform: translate(-50%,-50%) rotate(360deg); } }
  @keyframes bpWisp { 0% { opacity: 0; transform: translate(-50%,12%) scaleY(0.6); } 28% { opacity: 0.7; } 100% { opacity: 0; transform: translate(-50%,-62%) scaleY(1.35); } }
  @keyframes bpContour { 0%,100% { transform: translate(-50%,-50%) scale(1) rotate(0deg); } 50% { transform: translate(-50%,-50%) scale(1.045) rotate(-3deg); } }
  @keyframes bpSwirl { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes bpEmber {
    0% { opacity: 0; transform: translateY(0) scale(1); }
    14% { opacity: 0.95; }
    100% { opacity: 0; transform: translateY(-48px) scale(0.35); }
  }
  @keyframes bpFloat {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-5px) rotate(0.6deg); }
  }
  @keyframes bpShimmer {
    0%, 100% { opacity: 0.18; }
    45% { opacity: 0.7; }
  }
  @keyframes bpTwinkle {
    0%, 100% { opacity: 0; transform: scale(0.6); }
    50% { opacity: 0.9; transform: scale(1); }
  }
  /* aurora light — soft colored light blooming from below, gentle drift */
  @keyframes bpAurHalo  { 0%,100% { opacity: 0.78; transform: scale(1); } 50% { opacity: 1; transform: scale(1.05); } }
  @keyframes bpAurBloom { 0%,100% { transform: translateX(-50%) scaleY(1) scaleX(1); opacity: 0.9; } 50% { transform: translateX(-50%) scaleY(1.12) scaleX(0.95); opacity: 1; } }
  @keyframes bpAurSwayA { 0%,100% { transform: translateX(-50%) skewX(-7deg) scaleY(1); } 50% { transform: translateX(-44%) skewX(5deg) scaleY(1.12); } }
  @keyframes bpAurSwayB { 0%,100% { transform: translateX(-50%) skewX(6deg) scaleY(1.06); } 50% { transform: translateX(-56%) skewX(-6deg) scaleY(0.92); } }
  @keyframes bpAurCore  { 0%,100% { transform: translateX(-50%) scale(1); opacity: 0.82; } 50% { transform: translateX(-50%) scale(1.09); opacity: 1; } }
  @keyframes bpFlick { 0%,100% { transform: scaleY(1) scaleX(1) skewX(0deg); } 28% { transform: scaleY(1.08) scaleX(0.95) skewX(-3deg); } 62% { transform: scaleY(0.93) scaleX(1.04) skewX(3deg); } }
  @keyframes bpMorph { 0%,100% { border-radius: 42% 58% 55% 45% / 48% 42% 58% 52%; } 33% { border-radius: 60% 40% 46% 54% / 55% 60% 40% 45%; } 66% { border-radius: 48% 52% 62% 38% / 42% 48% 52% 58%; } }
  @media (prefers-reduced-motion: reduce) {
    [style*="animation"] { animation: none !important; }
  }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" data-from="ios-frame.jsx">
// @ds-adherence-ignore -- omelette starter scaffold (raw elements/hex/px by design)

/* BEGIN USAGE */
// iOS.jsx — Simplified iOS 26 (Liquid Glass) device frame
// Based on the iOS 26 UI Kit + Figma status bar spec. No assets, no deps.
// Exports (to window): IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow, IOSKeyboard
//
// Usage — wrap your screen content in <IOSDevice> to get the bezel, status bar
// and home indicator (props: title, dark, keyboard):
//
//   <IOSDevice title="Settings">
//     ...your screen content...
//   </IOSDevice>
//   <IOSDevice dark title="Search" keyboard>…</IOSDevice>
/* END USAGE */

// ─────────────────────────────────────────────────────────────
// Status bar
// ─────────────────────────────────────────────────────────────
function IOSStatusBar({ dark = false, time = '9:41' }) {
  const c = dark ? '#fff' : '#000';
  return (
    <div style={{
      display: 'flex', gap: 154, alignItems: 'center', justifyContent: 'center',
      padding: '21px 24px 19px', boxSizing: 'border-box',
      position: 'relative', zIndex: 20, width: '100%',
    }}>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', paddingTop: 1.5 }}>
        <span style={{
          fontFamily: '-apple-system, "SF Pro", system-ui', fontWeight: 590,
          fontSize: 17, lineHeight: '22px', color: c,
        }}>{time}</span>
      </div>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 7, paddingTop: 1, paddingRight: 1 }}>
        <svg width="19" height="12" viewBox="0 0 19 12">
          <rect x="0" y="7.5" width="3.2" height="4.5" rx="0.7" fill={c}/>
          <rect x="4.8" y="5" width="3.2" height="7" rx="0.7" fill={c}/>
          <rect x="9.6" y="2.5" width="3.2" height="9.5" rx="0.7" fill={c}/>
          <rect x="14.4" y="0" width="3.2" height="12" rx="0.7" fill={c}/>
        </svg>
        <svg width="17" height="12" viewBox="0 0 17 12">
          <path d="M8.5 3.2C10.8 3.2 12.9 4.1 14.4 5.6L15.5 4.5C13.7 2.7 11.2 1.5 8.5 1.5C5.8 1.5 3.3 2.7 1.5 4.5L2.6 5.6C4.1 4.1 6.2 3.2 8.5 3.2Z" fill={c}/>
          <path d="M8.5 6.8C9.9 6.8 11.1 7.3 12 8.2L13.1 7.1C11.8 5.9 10.2 5.1 8.5 5.1C6.8 5.1 5.2 5.9 3.9 7.1L5 8.2C5.9 7.3 7.1 6.8 8.5 6.8Z" fill={c}/>
          <circle cx="8.5" cy="10.5" r="1.5" fill={c}/>
        </svg>
        <svg width="27" height="13" viewBox="0 0 27 13">
          <rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke={c} strokeOpacity="0.35" fill="none"/>
          <rect x="2" y="2" width="20" height="9" rx="2" fill={c}/>
          <path d="M25 4.5V8.5C25.8 8.2 26.5 7.2 26.5 6.5C26.5 5.8 25.8 4.8 25 4.5Z" fill={c} fillOpacity="0.4"/>
        </svg>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Liquid glass pill — blur + tint + shine
// ─────────────────────────────────────────────────────────────
function IOSGlassPill({ children, dark = false, style = {} }) {
  return (
    <div style={{
      height: 44, minWidth: 44, borderRadius: 9999,
      position: 'relative', overflow: 'hidden',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      boxShadow: dark
        ? '0 2px 6px rgba(0,0,0,0.35), 0 6px 16px rgba(0,0,0,0.2)'
        : '0 1px 3px rgba(0,0,0,0.07), 0 3px 10px rgba(0,0,0,0.06)',
      ...style,
    }}>
      {/* blur + tint */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.28)' : 'rgba(255,255,255,0.5)',
      }} />
      {/* shine */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15), inset -1px -1px 1px rgba(255,255,255,0.08)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
      }} />
      <div style={{ position: 'relative', zIndex: 1, display: 'flex', alignItems: 'center', padding: '0 4px' }}>
        {children}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Navigation bar — glass pills + large title
// ─────────────────────────────────────────────────────────────
function IOSNavBar({ title = 'Title', dark = false, trailingIcon = true }) {
  const muted = dark ? 'rgba(255,255,255,0.6)' : '#404040';
  const text = dark ? '#fff' : '#000';
  const pillIcon = (content) => (
    <IOSGlassPill dark={dark}>
      <div style={{ width: 36, height: 36, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        {content}
      </div>
    </IOSGlassPill>
  );
  return (
    <div style={{
      display: 'flex', flexDirection: 'column', gap: 10,
      paddingTop: 62, paddingBottom: 10, position: 'relative', zIndex: 5,
    }}>
      <div style={{
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        padding: '0 16px',
      }}>
        {/* back chevron */}
        {pillIcon(
          <svg width="12" height="20" viewBox="0 0 12 20" fill="none" style={{ marginLeft: -1 }}>
            <path d="M10 2L2 10l8 8" stroke={muted} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        )}
        {/* trailing ellipsis */}
        {trailingIcon && pillIcon(
          <svg width="22" height="6" viewBox="0 0 22 6">
            <circle cx="3" cy="3" r="2.5" fill={muted}/>
            <circle cx="11" cy="3" r="2.5" fill={muted}/>
            <circle cx="19" cy="3" r="2.5" fill={muted}/>
          </svg>
        )}
      </div>
      {/* large title */}
      <div style={{
        padding: '0 16px',
        fontFamily: '-apple-system, system-ui',
        fontSize: 34, fontWeight: 700, lineHeight: '41px',
        color: text, letterSpacing: 0.4,
      }}>{title}</div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Grouped list (inset card, r:26) + row (52px)
// ─────────────────────────────────────────────────────────────
function IOSListRow({ title, detail, icon, chevron = true, isLast = false, dark = false }) {
  const text = dark ? '#fff' : '#000';
  const sec = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const ter = dark ? 'rgba(235,235,245,0.3)' : 'rgba(60,60,67,0.3)';
  const sep = dark ? 'rgba(84,84,88,0.65)' : 'rgba(60,60,67,0.12)';
  return (
    <div style={{
      display: 'flex', alignItems: 'center', minHeight: 52,
      padding: '0 16px', position: 'relative',
      fontFamily: '-apple-system, system-ui', fontSize: 17,
      letterSpacing: -0.43,
    }}>
      {icon && (
        <div style={{
          width: 30, height: 30, borderRadius: 7, background: icon,
          marginRight: 12, flexShrink: 0,
        }} />
      )}
      <div style={{ flex: 1, color: text }}>{title}</div>
      {detail && <span style={{ color: sec, marginRight: 6 }}>{detail}</span>}
      {chevron && (
        <svg width="8" height="14" viewBox="0 0 8 14" style={{ flexShrink: 0 }}>
          <path d="M1 1l6 6-6 6" stroke={ter} strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      )}
      {!isLast && (
        <div style={{
          position: 'absolute', bottom: 0, right: 0,
          left: icon ? 58 : 16, height: 0.5, background: sep,
        }} />
      )}
    </div>
  );
}

function IOSList({ header, children, dark = false }) {
  const hc = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const bg = dark ? '#1C1C1E' : '#fff';
  return (
    <div>
      {header && (
        <div style={{
          fontFamily: '-apple-system, system-ui', fontSize: 13,
          color: hc, textTransform: 'uppercase',
          padding: '8px 36px 6px', letterSpacing: -0.08,
        }}>{header}</div>
      )}
      <div style={{
        background: bg, borderRadius: 26,
        margin: '0 16px', overflow: 'hidden',
      }}>{children}</div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Device frame
// ─────────────────────────────────────────────────────────────
function IOSDevice({
  children, width = 402, height = 874, dark = false,
  title, keyboard = false,
}) {
  return (
    <div style={{
      width, height, borderRadius: 0, overflow: 'hidden',
      position: 'relative', background: dark ? '#000' : '#F2F2F7',
      boxShadow: 'none',
      fontFamily: '-apple-system, system-ui, sans-serif',
      WebkitFontSmoothing: 'antialiased',
    }}>
      {/* dynamic island */}
      <div style={{
        position: 'absolute', top: 11, left: '50%', transform: 'translateX(-50%)',
        width: 126, height: 37, borderRadius: 24, background: '#000', zIndex: 50,
      }} />
      {/* status bar (absolute) */}
      <div style={{ position: 'absolute', top: 0, left: 0, right: 0, zIndex: 10 }}>
        <IOSStatusBar dark={dark} />
      </div>
      {/* nav + content */}
      <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
        {title !== undefined && <IOSNavBar title={title} dark={dark} />}
        <div style={{ flex: 1, overflow: 'auto' }}>{children}</div>
        {keyboard && <IOSKeyboard dark={dark} />}
      </div>
      {/* home indicator — always on top */}
      <div style={{
        position: 'absolute', bottom: 0, left: 0, right: 0, zIndex: 60,
        height: 34, display: 'flex', justifyContent: 'center', alignItems: 'flex-end',
        paddingBottom: 8, pointerEvents: 'none',
      }}>
        <div style={{
          width: 139, height: 5, borderRadius: 100,
          background: dark ? 'rgba(255,255,255,0.7)' : 'rgba(0,0,0,0.25)',
        }} />
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Keyboard — iOS 26 liquid glass
// ─────────────────────────────────────────────────────────────
function IOSKeyboard({ dark = false }) {
  const glyph = dark ? 'rgba(255,255,255,0.7)' : '#595959';
  const sugg = dark ? 'rgba(255,255,255,0.6)' : '#333';
  const keyBg = dark ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,0.85)';

  // special-key icons
  const icons = {
    shift: <svg width="19" height="17" viewBox="0 0 19 17"><path d="M9.5 1L1 9.5h4.5V16h8V9.5H18L9.5 1z" fill={glyph}/></svg>,
    del: <svg width="23" height="17" viewBox="0 0 23 17"><path d="M7 1h13a2 2 0 012 2v11a2 2 0 01-2 2H7l-6-7.5L7 1z" fill="none" stroke={glyph} strokeWidth="1.6" strokeLinejoin="round"/><path d="M10 5l7 7M17 5l-7 7" stroke={glyph} strokeWidth="1.6" strokeLinecap="round"/></svg>,
    ret: <svg width="20" height="14" viewBox="0 0 20 14"><path d="M18 1v6H4m0 0l4-4M4 7l4 4" fill="none" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  };

  const key = (content, { w, flex, ret, fs = 25, k } = {}) => (
    <div key={k} style={{
      height: 42, borderRadius: 8.5,
      flex: flex ? 1 : undefined, width: w, minWidth: 0,
      background: ret ? '#08f' : keyBg,
      boxShadow: '0 1px 0 rgba(0,0,0,0.075)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      fontFamily: '-apple-system, "SF Compact", system-ui',
      fontSize: fs, fontWeight: 458, color: ret ? '#fff' : glyph,
    }}>{content}</div>
  );

  const row = (keys, pad = 0) => (
    <div style={{ display: 'flex', gap: 6.5, justifyContent: 'center', padding: `0 ${pad}px` }}>
      {keys.map(l => key(l, { flex: true, k: l }))}
    </div>
  );

  return (
    <div style={{
      position: 'relative', zIndex: 15, borderRadius: 27, overflow: 'hidden',
      padding: '11px 0 2px',
      display: 'flex', flexDirection: 'column', alignItems: 'center',
      boxShadow: dark
        ? '0 -2px 20px rgba(0,0,0,0.09)'
        : '0 -1px 6px rgba(0,0,0,0.018), 0 -3px 20px rgba(0,0,0,0.012)',
    }}>
      {/* liquid glass bg — same recipe as nav pills */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.14)' : 'rgba(255,255,255,0.25)',
      }} />
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
        pointerEvents: 'none',
      }} />

      {/* autocorrect bar */}
      <div style={{
        display: 'flex', gap: 20, alignItems: 'center',
        padding: '8px 22px 13px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {['"The"', 'the', 'to'].map((w, i) => (
          <React.Fragment key={i}>
            {i > 0 && <div style={{ width: 1, height: 25, background: '#ccc', opacity: 0.3 }} />}
            <div style={{
              flex: 1, textAlign: 'center',
              fontFamily: '-apple-system, system-ui', fontSize: 17,
              color: sugg, letterSpacing: -0.43, lineHeight: '22px',
            }}>{w}</div>
          </React.Fragment>
        ))}
      </div>

      {/* key layout */}
      <div style={{
        display: 'flex', flexDirection: 'column', gap: 13,
        padding: '0 6.5px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {row(['q','w','e','r','t','y','u','i','o','p'])}
        {row(['a','s','d','f','g','h','j','k','l'], 20)}
        <div style={{ display: 'flex', gap: 14.25, alignItems: 'center' }}>
          {key(icons.shift, { w: 45, k: 'shift' })}
          <div style={{ display: 'flex', gap: 6.5, flex: 1 }}>
            {['z','x','c','v','b','n','m'].map(l => key(l, { flex: true, k: l }))}
          </div>
          {key(icons.del, { w: 45, k: 'del' })}
        </div>
        <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>

// bp-flame.jsx — the engagement visuals: color helpers, the rank crystal, and the
// effort "flame" centerpiece (BPEffortOrb, flame branch). Intensity (0..100) → effort level
// (1–5) → size, mood color and the circular progress ring.
// Exports to window: BPEffortOrb, bpEffortLevel, BPCrystal, color helpers

// ── tiny color helpers ────────────────────────────────────────
function hexA(hex, a) {
  const { r, g, b } = parseHex(hex);
  return `rgba(${r},${g},${b},${a})`;
}
function lighten(hex, amt) {
  const { r, g, b } = parseHex(hex);
  return `rgb(${mix(r, 255, amt)},${mix(g, 255, amt)},${mix(b, 255, amt)})`;
}
function darken(hex, amt) {
  const { r, g, b } = parseHex(hex);
  return `rgb(${mix(r, 0, amt)},${mix(g, 0, amt)},${mix(b, 0, amt)})`;
}
function mix(a, b, t) { return Math.round(a + (b - a) * t); }
function parseHex(hex) {
  let h = hex.replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  return { r: parseInt(h.slice(0, 2), 16), g: parseInt(h.slice(2, 4), 16), b: parseInt(h.slice(4, 6), 16) };
}

// ── engagement color scale: red(worst) → orange → yellow → green → blue(best)
function engageColor(intensity) {
  const stops = [[0, '#E5391E'], [0.27, '#F5821F'], [0.5, '#FFC93C'], [0.72, '#33B96B'], [1, '#2F80ED']];
  const k = Math.max(0, Math.min(100, intensity)) / 100;
  for (let i = 1; i < stops.length; i++) {
    if (k <= stops[i][0]) {
      const a = stops[i - 1], b = stops[i];
      const t = (k - a[0]) / ((b[0] - a[0]) || 1);
      return mixHex(a[1], b[1], t);
    }
  }
  return stops[stops.length - 1][1];
}
function mixHex(a, b, t) {
  const A = parseHex(a), B = parseHex(b);
  const h = n => mix(A[n], B[n], t).toString(16).padStart(2, '0');
  return '#' + h('r') + h('g') + h('b');
}

// ── faceted crystal — color carries the engagement reading ─────
function BPCrystal({ intensity = 50, size = 200, color, reduce = false }) {
  const c = color || engageColor(intensity);
  const k = Math.max(0, Math.min(100, intensity)) / 100;
  const scale = 0.84 + k * 0.20;
  const glow = 0.32 + k * 0.5;
  const lighter = lighten(c, 0.62), light = lighten(c, 0.32), dark = darken(c, 0.26), darker = darken(c, 0.46);
  const animFloat = reduce ? 'none' : 'bpFloat 4.6s ease-in-out infinite';

  const animShim = reduce ? 'none' : 'bpShimmer 4.2s ease-in-out infinite';

  // twinkle sparkles (more present at higher intensity)
  const sparks = [{ x: '24%', y: '30%', d: 0 }, { x: '74%', y: '40%', d: 1.3 }, { x: '66%', y: '74%', d: 2.4 }];

  return (
    <div style={{ position: 'relative', width: size, height: size, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
      <div style={{
        position: 'absolute', inset: '-14%', borderRadius: '50%',
        background: `radial-gradient(circle at 50% 50%, ${hexA(c, 0.5 * glow)} 0%, ${hexA(c, 0.14 * glow)} 38%, transparent 64%)`,
        filter: 'blur(6px)', animation: animGlow,
      }} />
      {sparks.map((s, i) => (
        <svg key={i} viewBox="0 0 10 10" width="11" height="11" style={{
          position: 'absolute', left: s.x, top: s.y, opacity: 0,

        }}>

        </svg>
      </div>
    </div>

}

// ── Effort rings — concentric "level" gauge ────────────────────
// Five concentric rings = five effort levels (a target/scale). A soft luminous
// orb grows out from the centre to the ring of the current level (small→large =

// solid rings; levels still to unlock are dashed (same grammar as the week dots).
function bpEffortLevel(intensity) {

  return v < 20 ? 1 : v < 40 ? 2 : v < 60 ? 3 : v < 80 ? 4 : 5;

          {/* glints of light sweeping along the rim */}

            </div>
          </div>
          {/* trend flow — stacked chevrons that pulse in the trend direction (reads as flow, not a button) */}
          {(() => {
            const up = trend >= 0;
            const cw = D * 0.2;
            const tcol = up ? '#B7FFD6' : '#FFD0BC';
            return (
              <div style={{
                position: 'absolute', left: '50%', top: '36%', transform: 'translate(-50%,-50%)',

              }}>
                {[0, 1, 2].map(k => (
                  <svg key={k} width={cw} height={cw * 0.5} viewBox="0 0 20 10" style={{
                    display: 'block',

      </div>

      {/* 5 concentric dashed rings — the orb's edge reaching ring N = effort level N */}
      <svg width={W} height={S} viewBox={`0 0 ${W} ${S}`} style={{ position: 'absolute', inset: 0, overflow: 'visible', pointerEvents: 'none' }}>
        <defs>

          return <circle key={i} cx={cx} cy={cy} r={rf * S} fill="none" stroke={stroke}

      {/* flame badge sitting on the middle (top) of the current-level ring */}
      <div style={{
        position: 'absolute', left: cx, top: cy - R[level - 1] * S, transform: 'translate(-50%,-50%)', zIndex: 4,

        boxShadow: `0 2px 10px ${hexA(c, 0.6)}, 0 0 ${(S * 0.05).toFixed(0)}px ${hexA(c, 0.5)}, inset 0 1px 0 ${hexA('#FFFFFF', 0.4)}`,
      }}>
        <BPIcon name="flame" filled size={Math.round(S * 0.058)} color="#FFFFFF" />
      </div>
      </React.Fragment>)}

      {fx === 'flame' && (() => {
        // REALISTIC FIRE — layered & luminous (no displacement artifacts): a teardrop body with a
        // vertical fire gradient (deep ember tip → orange → yellow → white-hot base), a radial inner
        // glow, a bright base hot-spot, a soft outer halo, and a gentle organic flicker.
        const baseY = cy + S * 0.08;
        const fh = (0.26 + (level - 1) * 0.05) * S;
        // from the green level (4) up, the flame grows FATTER / stronger
        const fwRatio = level <= 3 ? 0.58 : 0.58 + (level - 3) * 0.12;
        const fw = fh * fwRatio;
        const FD = "M50 5 C60 40 89 56 89 90 C89 118 71 132 50 132 C29 132 11 118 11 90 C11 56 40 40 50 5 Z";
        const g = gid + 'F';
        // colour scale ticks flanking the flame — 5 levels, current one lit
        const COL5 = ['#E5391E', '#F5821F', '#FFC93C', '#33B96B', '#2F80ED'];
        const tickX = S * 0.6, tickMidY = cy - S * 0.19, tickColH = S * 0.4;  // edges; level maps to the ring's full height (L1≈horizon, L5≈top)
        const sideTicks = (sign) => (
          <div style={{ position: 'absolute', left: cx + sign * tickX, top: tickMidY, transform: 'translate(-50%,-50%)', height: tickColH,
            display: 'flex', flexDirection: 'column-reverse', justifyContent: 'space-between', alignItems: 'center', pointerEvents: 'none' }}>
            {COL5.map((col, i) => {
              const on = i === level - 1;
              return <div key={i} style={{ width: on ? S * 0.058 : S * 0.038, height: 2.5, borderRadius: 999, background: col, opacity: on ? 1 : 0.26, boxShadow: on ? `0 0 6px ${hexA(col, 0.85)}` : 'none', transition: 'all .2s' }} />;
            })}
          </div>
        );
        return (
          <React.Fragment>
            {sideTicks(-1)}
            {sideTicks(1)}
            {/* Circle Progress Bar wrapping the flame — symmetric: fills from the bottom up BOTH
                sides to two endpoints near the top-centre (PMAT version) */}
            {(() => {
              const rPB = S * 0.44;
              const topGapHalf = 12;              // small opening at top-centre → two distinct endpoints
              const span = 180 - topGapHalf;      // each side sweeps bottom (90°) → near top
              // fill so the green head reaches the SAME plane as the current level's side tick
              const lvlTickY = (tickMidY + tickColH / 2) - ((level - 1) / 4) * tickColH;
              const headAngle = Math.asin(Math.max(-1, Math.min(1, (lvlTickY - cy) / rPB))) * 180 / Math.PI;
              const prog = Math.max(0, Math.min(1, (90 - headAngle) / span));
              const ptOf = (deg) => { const a = deg * Math.PI / 180; return [cx + rPB * Math.cos(a), cy + rPB * Math.sin(a)]; };
              const arc = (fromDeg, toDeg, sweep) => {
                const [x0, y0] = ptOf(fromDeg), [x1, y1] = ptOf(toDeg);
                const large = Math.abs(toDeg - fromDeg) > 180 ? 1 : 0;
                return `M ${x0.toFixed(2)} ${y0.toFixed(2)} A ${rPB.toFixed(2)} ${rPB.toFixed(2)} 0 ${large} ${sweep} ${x1.toFixed(2)} ${y1.toFixed(2)}`;
              };
              const pw = S * 0.026;
              const pg = gid + 'PB';
              const rightEnd = 90 - span * prog;  // right side climbs (sweep 0)
              const leftEnd = 90 + span * prog;   // left side climbs (sweep 1)
              const track = hexA('#FFFFFF', dark ? 0.09 : 0.12);
              const glow = { filter: `drop-shadow(0 0 ${(S * 0.02).toFixed(0)}px ${hexA(c, 0.7)})` };
              return (
                <svg width={W} height={S} viewBox={`0 0 ${W} ${S}`} style={{ position: 'absolute', inset: 0, overflow: 'visible', pointerEvents: 'none' }}>
                  <defs>
                    <linearGradient id={pg} x1="0" y1="1" x2="0" y2="0">
                      <stop offset="0" stopColor={darken(c, 0.12)} />
                      <stop offset="0.5" stopColor={c} />
                      <stop offset="1" stopColor={lighten(c, 0.45)} />
                    </linearGradient>
                  </defs>
                  {/* track — both sides, full span with a small top gap */}
                  <path d={arc(90, 90 - span, 0)} fill="none" stroke={track} strokeWidth={pw} strokeLinecap="round" />
                  <path d={arc(90, 90 + span, 1)} fill="none" stroke={track} strokeWidth={pw} strokeLinecap="round" />
                  {/* progress — from the bottom up both sides toward the top-centre */}
                  <path d={arc(90, rightEnd, 0)} fill="none" stroke={`url(#${pg})`} strokeWidth={pw} strokeLinecap="round" style={glow} />
                  <path d={arc(90, leftEnd, 1)} fill="none" stroke={`url(#${pg})`} strokeWidth={pw} strokeLinecap="round" style={glow} />
                </svg>
              );

            {/* big faint Score — sits BEHIND the flame as a watermark (mockup) */}
            <div style={{ position: 'absolute', left: cx, top: cy - S * 0.12, transform: 'translate(-50%,-50%)', zIndex: 0, pointerEvents: 'none',
              fontFamily: "'Poppins', 'IBM Plex Sans Thai', sans-serif", fontWeight: 700, fontSize: Math.round(S * 0.42), lineHeight: 1,

              background: 'linear-gradient(180deg, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0.18) 45%, rgba(70,70,70,0.10) 100%)',
              WebkitBackgroundClip: 'text', backgroundClip: 'text', WebkitTextFillColor: 'transparent', color: 'transparent' }}>82</div>
            {/* ambient bloom on the horizon */}
            <div style={{ position: 'absolute', left: cx, top: baseY, transform: 'translate(-50%,-50%)', width: fw * 1.8, height: fh * 0.6, borderRadius: '50%',
              background: `radial-gradient(ellipse, ${hexA(c, dark ? 0.5 : 0.34)} 0%, ${hexA(c, 0)} 70%)`, filter: `blur(${(S * 0.05).toFixed(0)}px)`, pointerEvents: 'none' }} />
            <div style={{ position: 'absolute', left: cx, top: baseY, width: fw, height: fh, transform: 'translate(-50%,-100%)', pointerEvents: 'none' }}>
              <svg width="100%" height="100%" viewBox="0 0 100 137" style={{ display: 'block', overflow: 'visible', transformOrigin: '50% 100%', animation: reduce ? 'none' : 'bpFlick 2.6s ease-in-out infinite' }}>
                <defs>
                  <linearGradient id={g + 'b'} x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stopColor={hexA(c, 0)} />
                    <stop offset="0.12" stopColor={hexA(c, 0.55)} />
                    <stop offset="0.36" stopColor={c} />
                    <stop offset="0.64" stopColor={lighten(c, 0.5)} />
                    <stop offset="0.9" stopColor={lighten(c, 0.85)} />
                    <stop offset="1" stopColor="#FFFFFF" />
                  </linearGradient>
                  <radialGradient id={g + 'rc'} cx="50%" cy="62%" r="52%">
                    <stop offset="0" stopColor="#FFFFFF" />
                    <stop offset="0.32" stopColor={lighten(c, 0.78)} />
                    <stop offset="0.62" stopColor={hexA(c, 0.45)} />
                    <stop offset="1" stopColor={hexA(c, 0)} />
                  </radialGradient>
                  <filter id={g + 'gl'} x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="4.5" /></filter>

                </defs>
                {/* soft outer halo */}
                <path d={FD} fill={hexA(c, 0.4)} filter={`url(#${g}gl)`} transform="translate(50 132) scale(1.16) translate(-50 -132)" />
                {/* main fire body */}
                <path d={FD} fill={`url(#${g}b)`} filter={`url(#${g}soft)`} />
                {/* radial inner glow — the luminous heart, low-centred so it flows into the base */}
                <ellipse cx="50" cy="106" rx="22" ry="48" fill={`url(#${g}rc)`} opacity="0.92" />
                {/* white-hot base hot-spot */}
                <ellipse cx="50" cy="118" rx="15" ry="18" fill="#FFFFFF" filter={`url(#${g}soft)`} opacity="0.95" />

      {fx === 'line' && (() => {
        // PRINCIPLED PLOT: the line tells the last 5 days. Each point's HEIGHT = that day's
        // Effort level (1–5); its COLOUR follows the height via the 5-level palette
        // (low = red … high = blue). The most recent day (rightmost) is the glowing head.
        const COL5 = ['#E5391E', '#F5821F', '#FFC93C', '#33B96B', '#2F80ED']; // level 1..5
        // a believable 5-day series that ends on the current level (driven by the slider)
        const SERIES = { 1: [3, 2, 2, 1, 1], 2: [2, 1, 2, 2, 2], 3: [2, 3, 2, 3, 3], 4: [3, 2, 4, 3, 4], 5: [3, 4, 4, 5, 5] };
        const days = SERIES[level] || [2, 3, 2, 3, 3];
        const REC = 4;                                 // recommended Effort level (the target to reach)
        const xFirst = W * 0.10, xLast = W * 0.82;     // day 1 … day 5 (head)
        const leftBleed = -W * 0.12;                   // line/area run off the left screen edge (clipped by the frame)
        const gridR = W * 0.99;                        // gridlines reach almost the full width
        const yTop = S * 0.20, yBot = S * 0.74;        // level 5 sits at yTop, level 1 at yBot
        const yOf = (lv) => yBot - ((lv - 1) / 4) * (yBot - yTop);
        const pts = days.map((lv, i) => [xFirst + (xLast - xFirst) * (i / 4), yOf(lv)]);
        const sp = (p) => {
          let d = `M ${p[0][0].toFixed(1)} ${p[0][1].toFixed(1)}`;
          for (let i = 0; i < p.length - 1; i++) {
            const a = p[i - 1] || p[i], b = p[i], cc = p[i + 1], e = p[i + 2] || p[i + 1];
            const c1x = b[0] + (cc[0] - a[0]) / 6, c1y = b[1] + (cc[1] - a[1]) / 6;
            const c2x = cc[0] - (e[0] - b[0]) / 6, c2y = cc[1] - (e[1] - b[1]) / 6;
            d += ` C ${c1x.toFixed(1)} ${c1y.toFixed(1)}, ${c2x.toFixed(1)} ${c2y.toFixed(1)}, ${cc[0].toFixed(1)} ${cc[1].toFixed(1)}`;
          }
          return d;
        };
        const pathPts = [[leftBleed, pts[0][1]], ...pts];   // flat lead-in from the screen edge into day 1
        const lineD = sp(pathPts);
        const areaD = `${lineD} L ${xLast.toFixed(1)} ${S} L ${leftBleed.toFixed(1)} ${S} Z`;
        const sw = (S * 0.016).toFixed(1);
        const rDot = S * 0.034, rMark = S * 0.017;
        const head = pts[4], headColor = COL5[days[4] - 1];
        const recColor = COL5[REC - 1];
        // vertical colour scale: height → colour (top = level 5 blue … bottom = level 1 red)
        const vStops = [[0, COL5[4]], [0.25, COL5[3]], [0.5, COL5[2]], [0.75, COL5[1]], [1, COL5[0]]];
        return (
          <svg width="100%" height="100%" viewBox={`0 0 ${W} ${S}`} style={{ position: 'absolute', inset: 0, overflow: 'visible', pointerEvents: 'none' }}>
            <defs>
              <linearGradient id={gid + 'ln'} x1="0" y1={yTop} x2="0" y2={yBot} gradientUnits="userSpaceOnUse">
                {vStops.map(([o, col]) => <stop key={o} offset={o} stopColor={col} />)}
              </linearGradient>
              <linearGradient id={gid + 'ar'} x1="0" y1={yTop} x2="0" y2={yBot} gradientUnits="userSpaceOnUse">
                {vStops.map(([o, col]) => <stop key={o} offset={o} stopColor={col} stopOpacity="0.34" />)}
              </linearGradient>
              <linearGradient id={gid + 'fd'} x1="0" y1={yTop} x2="0" y2={S} gradientUnits="userSpaceOnUse">
                <stop offset="0" stopColor="#fff" stopOpacity="0.85" />
                <stop offset="0.6" stopColor="#fff" stopOpacity="0.32" />
                <stop offset="1" stopColor="#fff" stopOpacity="0" />
              </linearGradient>
              <mask id={gid + 'm'}><rect x={leftBleed} y="0" width={W - leftBleed} height={S} fill={`url(#${gid}fd)`} /></mask>
              <radialGradient id={gid + 'dg'}>
                <stop offset="0" stopColor={headColor} stopOpacity="0.6" />
                <stop offset="1" stopColor={headColor} stopOpacity="0" />
              </radialGradient>
            </defs>
            {/* level reference gridlines — thin lines marking each of the 5 Effort levels */}
            {[1, 2, 3, 4, 5].map((lv) => {
              const gy = yOf(lv), rec = lv === REC;
              return <line key={lv} x1={leftBleed} y1={gy} x2={gridR} y2={gy}
                stroke={rec ? hexA(recColor, 0.65) : 'rgba(255,255,255,0.12)'}
                strokeWidth={rec ? 1.5 : 1} strokeDasharray={rec ? '6 5' : '2 5'} />;
            })}
            <path d={areaD} fill={`url(#${gid}ar)`} mask={`url(#${gid}m)`} />
            <path d={lineD} fill="none" stroke={`url(#${gid}ln)`} strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round"
              style={{ filter: `drop-shadow(0 0 ${(S * 0.014).toFixed(0)}px ${hexA(headColor, 0.5)})` }} />
            {/* day markers (first 4 days) — solid beads coloured by their own height */}
            {pts.slice(0, 4).map((p, i) => (
              <circle key={i} cx={p[0]} cy={p[1]} r={rMark} fill={COL5[days[i] - 1]} stroke="#FFFFFF" strokeWidth={(S * 0.005).toFixed(1)}
                style={{ filter: `drop-shadow(0 0 ${(S * 0.012).toFixed(0)}px ${hexA(COL5[days[i] - 1], 0.8)})` }} />
            ))}
            {/* most-recent day = glowing head */}
            <circle cx={head[0]} cy={head[1]} r={rDot * 2.8} fill={`url(#${gid}dg)`} />
            <circle cx={head[0]} cy={head[1]} r={rDot} fill="#FFFFFF" style={{ filter: `drop-shadow(0 0 ${(S * 0.022).toFixed(0)}px ${hexA(headColor, 0.95)})` }} />
            {/* recommended-level label */}
            <text x={gridR} y={yOf(REC) - S * 0.022} textAnchor="end" fill={hexA(recColor, 0.95)}
              fontFamily="'IBM Plex Sans Thai', sans-serif" fontSize={S * 0.042} fontWeight="600">แนะนำ</text>
          </svg>
        );
      })()}

      {/* glassy lower half — dark frosted glass, faded at the sides to read as a horizon
          (skipped for the 'line' variant, which reads as a clean curve on black) */}
      {fx !== 'line' && (
      <div style={{
        position: 'absolute', left: 0, right: 0, top: '50%', bottom: 0,
        backdropFilter: `blur(${glassBlur}px) saturate(135%)`, WebkitBackdropFilter: `blur(${glassBlur}px) saturate(135%)`,
        background: dark
          ? 'linear-gradient(180deg, rgba(6,6,9,0.40) 0%, rgba(6,6,9,0.72) 55%, rgba(6,6,9,0.88) 100%)'
          : 'linear-gradient(180deg, rgba(40,36,38,0.30) 0%, rgba(40,36,38,0.5) 60%, rgba(40,36,38,0.62) 100%)',
        WebkitMaskImage: edgeFade, maskImage: edgeFade,
      }}>
        {/* horizon line — fades out at both ends */}
        <div style={{
          position: 'absolute', top: 0, left: 0, right: 0, height: 1,
          background: `linear-gradient(90deg, transparent, ${dark ? 'rgba(255,255,255,0.4)' : 'rgba(255,255,255,0.7)'} 50%, transparent)`,
        }} />
      </div>
      )}
    </div>
  );
}

const BP_RANK_ORDER = ['Ignorance', 'Questioner', 'Goal Setter', 'Apprentice', 'Practitioner', 'Graduate'];
function _lbRankColor(rank) {
  const i = BP_RANK_ORDER.indexOf(rank);
  return _lbEngage(i >= 0 ? (i / (BP_RANK_ORDER.length - 1)) * 100 : 50);
}

function MoveIndicator({ th, move }) {
  if (!move) return <span style={{ fontFamily: _lbEN, fontSize: 11, color: th.t4 }}>—</span>;
  const up = move > 0;
  const c = up ? '#33B96B' : th.accent;
  return (
    <span style={{ display: 'inline-flex', alignItems: 'center', gap: 2, fontFamily: _lbEN, fontSize: 11.5, fontWeight: 600, color: c }}>
      <span style={{ fontSize: 9 }}>{up ? '▲' : '▼'}</span>{Math.abs(move)}
    </span>
  );
}

// top-3 podium — clean: just the crystal avatar + medal badge, #1 larger & centred (no bars)
const _lbMEDAL = { 1: '#F1B304', 2: '#C4CAD4', 3: '#D08B5A' };
function PodiumPillar({ th, place, learner }) {
  const c = _lbRankColor(learner.rank);
  const big = place === 1;
  const ring = big ? 82 : 62;
  const order = { 1: 2, 2: 1, 3: 3 };
  const md = _lbMEDAL[place];
  return (
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 7, order: order[place] }}>
      <div style={{ position: 'relative' }}>
        {big && (
          <span style={{ position: 'absolute', top: -15, left: '50%', transform: 'translateX(-50%)' }}>
            <BPIcon name="trophy" size={18} color="#F1B304" stroke={2} />
          </span>
        )}
        <div style={{
          width: ring, height: ring, borderRadius: 999,
          background: _lbHexA(c, th.dark ? 0.12 : 0.08),
          display: 'flex', alignItems: 'center', justifyContent: 'center',
        }}>
          <BPCrystal intensity={50} size={ring - 16} color={c} reduce={true} />
        </div>
        <span style={{
          position: 'absolute', bottom: -3, left: '50%', transform: 'translateX(-50%)',
          width: 22, height: 22, borderRadius: 999, background: md,
          border: `2px solid ${th.dark ? '#0c0d11' : '#fff'}`,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          fontFamily: _lbEN, fontWeight: 700, fontSize: 11, color: '#16110E',
        }}>{place}</span>

      <span style={{ fontFamily: _lbTH, fontWeight: 600, fontSize: big ? 14 : 13, color: th.t1, marginTop: 4, textAlign: 'center', whiteSpace: 'nowrap' }}>{learner.name}</span>
      <span style={{ display: 'inline-flex', alignItems: 'center', gap: 4 }}>
        <BPIcon name="flame" filled size={11} color={th.t4} />
        <span style={{ fontFamily: _lbEN, fontWeight: 700, fontSize: 12.5, color: th.t2 }}>{learner.pts.toLocaleString()}</span>
      </span>
    </div>
  );
}

// a row in the full ranked list
function RankRow({ th, learner, place }) {
  const c = _lbRankColor(learner.rank);
  const me = learner.me;
  return (
    <div style={{
      display: 'flex', alignItems: 'center', gap: 12, padding: '12px 14px', borderRadius: 18,
      background: th.glassBg, backdropFilter: th.glassBlur, WebkitBackdropFilter: th.glassBlur,
      border: `1px solid ${me ? _lbHexA(th.accent, 0.55) : th.glassBorder}`,
      boxShadow: me ? `${th.glassSheen}, 0 8px 22px ${_lbHexA(th.accent, th.dark ? 0.18 : 0.1)}` : th.glassSheen,
    }}>
      <span style={{ width: 24, textAlign: 'center', fontFamily: _lbEN, fontWeight: 700, fontSize: 14, color: me ? th.accent : th.t3, flexShrink: 0 }}>{place}</span>
      <div style={{
        width: 40, height: 40, borderRadius: 12, flexShrink: 0,
        background: _lbHexA(c, th.dark ? 0.14 : 0.1), border: `1px solid ${_lbHexA(c, 0.4)}`,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
      }}>
        <BPCrystal intensity={50} size={34} color={c} reduce={true} />
      </div>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
          <span style={{ fontFamily: _lbTH, fontWeight: 600, fontSize: 14.5, color: th.t1, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{learner.name}</span>
          {me && <span style={{ fontFamily: _lbTH, fontSize: 10.5, fontWeight: 600, color: th.accent, background: _lbHexA(th.accent, th.dark ? 0.18 : 0.1), padding: '2px 7px', borderRadius: 999, flexShrink: 0 }}>คุณ</span>}
        </div>
        <span style={{ fontFamily: _lbEN, fontSize: 11.5, color: c, fontWeight: 600 }}>{learner.rank}</span>
      </div>
      <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 2, flexShrink: 0 }}>
        <span style={{ display: 'inline-flex', alignItems: 'center', gap: 4 }}>
          <BPIcon name="flame" filled size={12} color={th.accent} />
          <span style={{ fontFamily: _lbEN, fontWeight: 700, fontSize: 14, color: th.t1 }}>{learner.pts.toLocaleString()}</span>
        </span>
        <MoveIndicator th={th} move={learner.move} />
      </div>
    </div>
  );
}

function LeaderboardScreen({ th, nickname = 'จอย', reduce = false }) {
  const [scope, setScope] = _lbS('week'); // 'week' | 'all'
  const sorted = BP_LEADERS.slice().sort((a, b) => b.pts - a.pts);
  const top3 = sorted.slice(0, 3);
  const rest = sorted.slice(3);
  const myPlace = sorted.findIndex(l => l.me) + 1;

  const seg = (id, label) => {
    const active = scope === id;
    return (
      <button onClick={() => setScope(id)} style={{
        flex: 1, cursor: 'pointer', border: 'none', borderRadius: 999, padding: '8px 0',
        fontFamily: _lbTH, fontSize: 13, fontWeight: 600,
        background: active ? (th.dark ? '#fff' : th.t1) : 'transparent',
        color: active ? (th.dark ? '#16110E' : '#fff') : th.t3,
        transition: 'background 180ms, color 180ms',
      }}>{label}</button>
    );
  };

  return (
    <main style={{ flex: 1, overflowY: 'auto', padding: '114px 20px 110px', display: 'flex', flexDirection: 'column', gap: 20 }}>
      {/* heading */}
      <div>
        <h1 style={{ margin: 0, fontFamily: _lbTH, fontWeight: 600, fontSize: 25, color: th.t1, letterSpacing: '-0.01em' }}>อันดับ</h1>
        <span style={{ fontFamily: _lbTH, fontSize: 13, color: th.t3 }}>Essential Leadership · 24 คน</span>
      </div>

      {/* scope toggle */}
      <div style={{ display: 'flex', gap: 4, padding: 4, borderRadius: 999, background: th.dark ? 'rgba(255,255,255,0.05)' : 'rgba(35,31,32,0.05)', border: `1px solid ${th.line}` }}>
        {seg('week', 'สัปดาห์นี้')}
        {seg('all', 'ตลอดกาล')}
      </div>

      {/* podium — clean top 3 (no pillar bars) */}
      <div style={{ display: 'flex', alignItems: 'flex-end', gap: 10, padding: '14px 0 6px' }}>
        {top3.map((l, i) => <PodiumPillar key={l.name} th={th} place={i + 1} learner={l} />)}
      </div>

      {/* your standing — flat, minimal */}
      <div style={{
        display: 'flex', alignItems: 'center', gap: 13, padding: '14px 16px', borderRadius: 18,
        background: th.glassBg, backdropFilter: th.glassBlur, WebkitBackdropFilter: th.glassBlur,
        border: `1px solid ${_lbHexA(th.accent, 0.4)}`, boxShadow: th.glassSheen,
      }}>
        <span style={{ fontFamily: _lbEN, fontWeight: 700, fontSize: 20, color: th.accent }}>#{myPlace}</span>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontFamily: _lbTH, fontWeight: 600, fontSize: 14, color: th.t1 }}>อันดับของคุณ</div>
          <div style={{ fontFamily: _lbTH, fontSize: 12, color: th.t3 }}>ขยับขึ้น 2 อันดับ · อีก 520 แต้มแซง #3</div>
        </div>
      </div>

      {/* full list (place 4+) */}
      <div style={{ display: 'flex', flexDirection: 'column', gap: 9 }}>
        {rest.map((l, i) => <RankRow key={l.name} th={th} learner={l} place={i + 4} />)}
      </div>
    </main>
  );
}

Object.assign(window, { LeaderboardScreen });

</script>
<script type="text/babel" data-from="bp-challenge.jsx">
// bp-challenge.jsx — the "ภารกิจ" (Challenge / Missions) tab for JOINSTICK.
// A featured daily challenge, today's momentum stats, then all missions grouped
// by where they stand (ค้างอยู่ / กำลังทำ / เสร็จแล้ว). Reuses the global MissionCard.
// Exports to window: ChallengeScreen
const { useState: _chS } = React;
const _chHexA = window.bpHexA;
const _chTH = "'IBM Plex Sans Thai', sans-serif";
const _chEN = "'Poppins', 'IBM Plex Sans Thai', sans-serif";

// the broader mission pool for this tab (todo / doing / late / done)
const BP_CHALLENGES = [
  { type: 'Recall Quiz', icon: 'rotate', title: 'ทบทวนสไตล์การนำทีม & Trust Lens', minutes: 5, points: 20, status: 'todo', daysLeft: 2 },
  { type: 'Mission',     icon: 'target', title: 'Identify your team\'s trust lenses', minutes: 15, points: 50, status: 'doing' },
  { type: 'Flash Card',  icon: 'layers', title: 'ทบทวนศัพท์ Leadership & Trust Lens', minutes: 8, points: 15, status: 'todo', daysLeft: 1 },
  { type: 'Quiz',        icon: 'help',   title: 'แบบทดสอบ: สร้าง Trust ในทีม', minutes: 10, points: 30, status: 'late' },
  { type: 'Mission',     icon: 'target', title: 'เขียนสะท้อนการนำทีมวันนี้', minutes: 7, points: 25, status: 'doing' },
  { type: 'Flash Card',  icon: 'layers', title: 'ทบทวนรูปแบบผู้นำ 6 สไตล์', minutes: 6, points: 15, status: 'done' },
  { type: 'Recall Quiz', icon: 'rotate', title: 'ทบทวนบท Leadership Styles', minutes: 5, points: 20, status: 'done' },
];

// ── Anytime Challenges — daily, pick ONE type per day; the other goes on Cool Down ──
const BP_ANYTIME = [
  { type: 'Recall Quiz', icon: 'rotate', desc: 'ทบทวนสิ่งที่เพิ่งเรียนไป', minutes: 5, points: 20 },
  { type: 'Flash Card',  icon: 'layers', desc: 'ทวนศัพท์และหลักการสั้นๆ', minutes: 8, points: 15 },
];

// ── Main Challenges — the steady path to transformation (Home-style long cards) ──
const BP_MAIN = [
  { type: 'Mission', icon: 'target', title: 'Identify your team\'s trust lenses', minutes: 15, points: 50, status: 'doing' },
  { type: 'Mission', icon: 'target', title: 'เขียนสะท้อนการนำทีมวันนี้', minutes: 7, points: 25, status: 'doing' },
  { type: 'Quiz',    icon: 'help',   title: 'แบบทดสอบ: สร้าง Trust ในทีม', minutes: 10, points: 30, status: 'late' },
  { type: 'Mission', icon: 'book',   title: 'อ่านบทความ The Foundation of Trust แล้วสรุป', minutes: 12, points: 35, status: 'todo', daysLeft: 3 },
  { type: 'Quiz',    icon: 'help',   title: 'ทบทวนบท Leadership Styles', minutes: 8, points: 20, status: 'done' },
];

// compact 2-column card for the Anytime section (NOT a long row card)
function AnytimeCard({ th, item, state, onStart }) {
  const done = state === 'done', cool = state === 'cooldown', ready = state === 'ready';
  const accent = done ? '#33B96B' : cool ? th.t4 : th.accent;
  const openTask = () => { try { window.parent.postMessage({ type: 'js-open-task', taskType: item.type, title: item.title }, '*'); } catch (e) {} };
  return (
    <button onClick={ready ? openTask : undefined} style={{
      flex: 1, minWidth: 0, textAlign: 'left', cursor: ready ? 'pointer' : 'default',
      background: th.glassBg, backdropFilter: th.glassBlur, WebkitBackdropFilter: th.glassBlur,
      border: `1px solid ${done ? _chHexA('#33B96B', 0.32) : th.glassBorder}`,
      borderRadius: 20, padding: 15, boxShadow: th.glassSheen,
      display: 'flex', flexDirection: 'column', gap: 11, opacity: cool ? 0.5 : 1, transition: 'all 180ms ease',
    }}>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
        <span style={{ width: 42, height: 42, borderRadius: 13, display: 'flex', alignItems: 'center', justifyContent: 'center',
          background: _chHexA(accent, th.dark ? 0.16 : 0.1), border: `1px solid ${_chHexA(accent, 0.32)}` }}>
          <BPIcon name={item.icon} size={20} color={accent} stroke={2} />
        </span>
        {done && <span style={{ width: 24, height: 24, borderRadius: 999, background: _chHexA('#33B96B', 0.18), display: 'flex', alignItems: 'center', justifyContent: 'center' }}><BPIcon name="check" size={14} color="#33B96B" stroke={2.6} /></span>}
        {cool && <BPIcon name="lock" size={15} color={th.t4} stroke={2} />}
      </div>
      <div>
        <div style={{ fontFamily: _chEN, fontSize: 13.5, fontWeight: 700, color: th.t1, letterSpacing: '-0.01em' }}>{item.type}</div>
        <div style={{ fontFamily: _chTH, fontSize: 11.5, color: th.t3, marginTop: 2, lineHeight: 1.35 }}>{item.desc}</div>
      </div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, fontFamily: _chTH, fontSize: 11.5, color: th.t3 }}>
        <span style={{ display: 'inline-flex', alignItems: 'center', gap: 4 }}><BPIcon name="flame" filled size={12} color={th.t4} /><span style={{ fontFamily: _chEN, fontWeight: 600, color: th.t2 }}>+{item.points}</span></span>
        <span style={{ width: 3, height: 3, borderRadius: 99, background: th.t4 }} />
        {item.minutes} นาที
      </div>
      <div style={{ display: 'inline-flex', alignItems: 'center', gap: 6, fontFamily: _chTH, fontSize: 12, fontWeight: 600, color: accent, marginTop: 1 }}>
        {done && <><span style={{ width: 6, height: 6, borderRadius: 999, background: '#33B96B', boxShadow: `0 0 6px ${_chHexA('#33B96B', 0.7)}` }} />สำเร็จแล้ว</>}
        {cool && <><BPIcon name="clock" size={13} color={th.t4} stroke={2} />Cool Down · พรุ่งนี้</>}
        {ready && <><BPIcon name="play" filled size={12} color={th.accent} />เริ่มทำ</>}
      </div>
    </button>
  );
}

function ChallengeScreen({ th, reduce = false }) {
  const [done, setDone] = _chS({});
  const toggle = i => setDone(d => ({ ...d, [i]: !d[i] }));
  // Anytime: pick ONE type per day → it becomes 'done', the other 'cooldown'
  const [anytimeDone, setAnytimeDone] = _chS(null); // null | item.type
  const anytimeState = item => anytimeDone == null ? 'ready' : (anytimeDone === item.type ? 'done' : 'cooldown');

  // Main: sort กำลังทำ(doing) > ล่าช้า(late) > เหลืออีก(todo) > สำเร็จ(done)
  const prio = m => m.status === 'doing' ? 1 : m.status === 'late' ? 2 : m.status === 'done' ? 4 : 3;
  const mainSorted = BP_MAIN.map((m, i) => ({ m, i })).sort((a, b) => prio(a.m) - prio(b.m));

  const head = (title, desc) => (
    <div style={{ marginBottom: 13 }}>
      <h2 style={{ margin: 0, fontFamily: _chTH, fontWeight: 700, fontSize: 19, color: th.t1, letterSpacing: '-0.01em' }}>{title}</h2>
      <div style={{ fontFamily: _chTH, fontSize: 12.5, color: th.t3, marginTop: 3, lineHeight: 1.4 }}>{desc}</div>
    </div>
  );

  return (
    <main style={{ flex: 1, overflowY: 'auto', padding: '114px 20px 110px', display: 'flex', flexDirection: 'column', gap: 30 }}>
      <h1 style={{ margin: 0, fontFamily: _chTH, fontWeight: 600, fontSize: 25, color: th.t1, letterSpacing: '-0.01em' }}>ภารกิจ</h1>

      {/* ── Section 1 — Anytime Challenge ── */}
      <section>
        {head('ภารกิจทุกเมื่อ', 'เพื่อหล่อเลี้ยงความรู้ และนำไปสู่ความจำระยะยาว')}
        <div style={{ display: 'flex', gap: 10 }}>
          {BP_ANYTIME.map(item => (
            <AnytimeCard key={item.type} th={th} item={item} state={anytimeState(item)} onStart={() => setAnytimeDone(item.type)} />
          ))}
        </div>
      </section>

      {/* ── Section 2 — Main Challenge ── */}
      <section>
        {head('ภารกิจหลัก', 'เพื่อการพัฒนาอย่างสม่ำเสมอสู่การเปลี่ยนแปลง')}
        <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
          {mainSorted.map(({ m, i }) => (
            <MissionCard key={i} th={th} m={m} done={done[i] ?? m.status === 'done'} onToggle={() => toggle(i)} />
          ))}
        </div>
      </section>
    </main>
  );
}

Object.assign(window, { ChallengeScreen });

</script>

  { cat: 'ผู้นำ',   type: 'บทเรียน',    icon: 'book',   title: 'Delivery A Meaningful ONE ON ONE Session', items: '8 บท', progress: 62, color: '#2F80ED' },

  if (done || m.status === 'done') return { label: 'เสร็จแล้ว', color: '#33B96B', dot: true };
  if (m.status === 'late') return { label: 'ล่าช้า', color: th.accent, dot: true };
  if (m.status === 'doing') return { label: 'กำลังทำ', color: '#4DA8F0', dot: true };
  const d = m.daysLeft;
  return { label: `เหลืออีก ${d} วัน`, color: th.t1, dot: true };
}

// status priority: กำลังทำ(doing) > ล่าช้า(late) > เหลืออีก(todo) > สำเร็จ(done)
function bpMissionPrio(x) {
  if (x.isDone) return 4;
  if (x.m.status === 'doing') return 1;
  if (x.m.status === 'late') return 2;
  return 3;
}
function Missions({ th, variant, done, toggle }) {
  const horizontal = variant === 2;
  const items = BP_MISSIONS
    .map((m, i) => ({ m, i, isDone: !!done[i] || m.status === 'done' }))
    .sort((a, b) => bpMissionPrio(a) - bpMissionPrio(b) || ((a.m.daysLeft || 99) - (b.m.daysLeft || 99)))
    .slice(0, 3);
  return (
    <div>
      <SectionHead th={th} title="ภารกิจที่แนะนำ" action="ดูทั้งหมด" />
      {horizontal ? (
        <div style={{ display: 'flex', gap: 12, overflowX: 'auto', margin: '0 -20px', padding: '2px 20px 4px', scrollbarWidth: 'none' }}>
          {items.map(x => <MissionCard key={x.i} th={th} m={x.m} done={x.isDone} onToggle={() => toggle(x.i)} horizontal />)}
        </div>
      ) : (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
          {items.map(x => <MissionCard key={x.i} th={th} m={x.m} done={x.isDone} onToggle={() => toggle(x.i)} />)}
        </div>
      )}
    </div>
  );
}

function InsightScreen({ variant = 1, dark = true, accent = '#ED4724', intensity = 38, nickname = 'จอย', rank = 'Practitioner', reduce = false }) {
  const th = bpTheme(dark, accent);
  const msg = bpMessages(intensity, nickname);
  const week = bpWeekStates(intensity);
  const mood = bpEngageColor(intensity);
  // momentum direction (this week's effort rising or falling) — drives the centre arrow
  const trend = (() => {
    const past = week.slice(0, 4);
    const recent = past.slice(2).filter(s => s === 'done').length;
    const earlier = past.slice(0, 2).filter(s => s === 'done').length;
    return recent < earlier ? -1 : 1;
  })();
  const [tab, setTab] = _uS(window.__TAB || 'insight');
  const [sheet, setSheet] = _uS(null); // 'join' | 'notif' | 'profile'
  const [done, setDone] = _uS({});
  const toggle = i => setDone(d => ({ ...d, [i]: !d[i] }));

  return (
    <div style={{ height: '100%', position: 'relative', display: 'flex', flexDirection: 'column', background: th.bgGrad, overflow: 'hidden' }}>
      <TopBar th={th} notifCount={2}
        onProfile={() => setSheet('profile')} onNotif={() => setSheet('notif')} onJoin={() => setSheet('join')} />

      {tab === 'insight' && (() => {
        // v2 ("Option 3"): the nav + status stay clean on the app base (a fixed-feeling header),
        // and the scrollable content (Effort + missions) becomes a rounded-top SHEET with a drag
        // handle that slides up underneath — zone division lives on the scrollable surface, not the header.
        const sheetMode = false;  // zone-dividing sheet removed — clean continuous layout
        const lc = th.dark ? 'rgba(255,255,255,0.13)' : 'rgba(35,31,32,0.12)';
        const divider = (
          <div key="dv" aria-hidden style={{
            height: 18, flexShrink: 0, width: '100%',
            borderTop: `1.5px solid ${lc}`, borderLeft: `1.5px solid ${lc}`, borderRight: `1.5px solid ${lc}`,
            borderTopLeftRadius: '90px 18px', borderTopRightRadius: '90px 18px',
            WebkitMaskImage: 'linear-gradient(to bottom, #000 0%, #000 38%, transparent 100%)',
            maskImage: 'linear-gradient(to bottom, #000 0%, #000 38%, transparent 100%)',
          }} />
        );
        const phase = window.__PHASE || 'out';
        const phaseTitles = { pre: 'Pre-Class', in: 'In Class', out: 'Out of Class' };
        const placeholder = (
          <div key="ph" style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 10, minHeight: 320,
            border: `1.5px dashed ${th.line2}`, borderRadius: 24, margin: '10px 0', textAlign: 'center', padding: '36px 22px' }}>
            <span style={{ fontFamily: EN, fontSize: 12, fontWeight: 700, letterSpacing: '0.14em', color: th.t3, textTransform: 'uppercase' }}>{phaseTitles[phase]}</span>
            <span style={{ fontFamily: TH, fontSize: 15.5, fontWeight: 600, color: th.t1 }}>หน้านี้ยังไม่ได้ออกแบบ</span>
            <span style={{ fontFamily: TH, fontSize: 12.5, color: th.t3, maxWidth: 250, lineHeight: 1.5 }}>เฟสนี้ยังไม่มีเปลวไฟและระดับ Stage (ยังไม่มีคะแนน) — รอกำหนดเนื้อหา</span>
          </div>
        );
        const body =
          phase === 'out' ? [
            variant === 1 && <HearthSection key="h" th={th} intensity={intensity} msg={msg} week={week} reduce={reduce} mood={mood} trend={trend} onInfo={() => setSheet('engageInfo')} />,
            divider,
            <Missions key="m" th={th} variant={variant} done={done} toggle={toggle} />,
          ]
          : phase === 'pre' ? [
            // Pre-Class: Out-of-Class layout, but the flame zone is empty (3-line greeting), then the
            // Pre-Test shown as a normal MissionCard so it matches the Out-of-Class design style
            <PreClassHero key="ph" th={th} nickname={nickname} />,
            divider,
            <div key="pt">
              <SectionHead th={th} title="ภารกิจที่แนะนำ" />
              <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                <MissionCard th={th} m={{ type: 'Pre-Test', icon: 'target', title: 'แบบทดสอบก่อนเรียน: ภาวะผู้นำ', minutes: 10, points: 30, status: 'todo', daysLeft: 3 }} done={false} onToggle={() => {}} />
              </div>
            </div>,
          ]
          : [placeholder];  // In-Class — still to be designed
        return (
          <main style={{ flex: 1, overflowY: 'auto', padding: sheetMode ? '4px 20px 0' : '114px 20px 110px', display: 'flex', flexDirection: 'column', gap: sheetMode ? 16 : 28 }}>
            <StatusCard th={th} nickname={nickname} rank={rank} onInfo={() => setSheet('rankInfo')} />
            {sheetMode ? (
              <div style={{
                margin: '2px -20px 0', padding: '22px 20px 120px', borderTopLeftRadius: 30, borderTopRightRadius: 30, flexShrink: 0,
                background: th.dark
                  ? 'linear-gradient(180deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.022) 28%, rgba(255,255,255,0.008) 100%)'
                  : 'linear-gradient(180deg, #faf9fb, #f4f3f5)',
                boxShadow: th.dark ? 'inset 0 1px 0 rgba(255,255,255,0.08), 0 -10px 26px rgba(0,0,0,0.28)' : 'inset 0 1px 0 #fff, 0 -8px 22px rgba(35,31,32,0.06)',
                display: 'flex', flexDirection: 'column', gap: 16,
              }}>
                {body}
              </div>
            ) : body}
          </main>
        );
      })()}
      {tab === 'leaderboard' && <LeaderboardScreen th={th} nickname={nickname} reduce={reduce} />}
      {tab === 'challenge' && <ChallengeScreen th={th} reduce={reduce} />}
      {tab === 'resource' && <ResourceScreen th={th} reduce={reduce} />}

      <BottomNav th={th} tab={tab} setTab={setTab} />

      <JoinClassSheet th={th} open={sheet === 'join'} onClose={() => setSheet(null)} />
      <NotifSheet th={th} open={sheet === 'notif'} onClose={() => setSheet(null)} />
      <ProfileSheet th={th} open={sheet === 'profile'} onClose={() => setSheet(null)} name={nickname} rank={rank} />
      <RankJourneyPage th={th} open={sheet === 'rankInfo'} onClose={() => setSheet(null)} rank={rank} reduce={reduce} />
      <EngageInfoSheet th={th} open={sheet === 'engageInfo'} onClose={() => setSheet(null)} intensity={intensity} mood={mood} />
    </div>
  );
}
