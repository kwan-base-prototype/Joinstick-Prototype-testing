<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>JOINSTICK — Stage Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="./config.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; background: #050505; }
    body {
      color: #fafaf9;
      font-family: 'Poppins', 'IBM Plex Sans Thai', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior-y: none;
    }
    button, input, textarea { font-family: inherit; }
    textarea::placeholder { color: #57534e; font-family: 'IBM Plex Sans Thai', 'Poppins', sans-serif; }
    input::placeholder { color: #44403c; }

    .font-th { font-family: 'IBM Plex Sans Thai', 'Poppins', sans-serif; }
    .font-mono-num { font-family: 'JetBrains Mono', monospace; }

    .app-shell {
      position: relative;
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      min-height: 100vh;
      min-height: 100dvh;
      background: #050505;
      overflow-x: hidden;
    }
    .scr {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh;
    }
    .screen-fade { animation: fadeSlideUp 0.35s ease both; }

    /* hide scrollbars everywhere — scrolling still works, the bar just disappears */
    .scr, .scr *, main { scrollbar-width: none; -ms-overflow-style: none; }
    .scr::-webkit-scrollbar, .scr *::-webkit-scrollbar, main::-webkit-scrollbar { width: 0; height: 0; display: none; }

    @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    /* ── wide screens (desktop / tablet / Claude preview): show as a centered
          phone mockup instead of a 430px column floating in black.
          transform on .app-shell makes the inner position:fixed overlays
          (eyes-up, flash, challenge sheet, toast) anchor to the FRAME. ── */
    @media (min-width: 600px) {
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        min-height: 100dvh;
        padding: 16px;
        background: radial-gradient(circle at 50% 28%, #1b1512 0%, #050505 68%);
      }
      .app-shell {
        width: 390px;
        max-width: 390px;
        height: 844px;
        max-height: calc(100dvh - 32px);
        min-height: 0;
        border-radius: 46px;
        overflow: hidden;
        transform: translateZ(0);
        box-shadow: 0 0 0 11px #14100d, 0 0 0 13px #2c241f, 0 30px 80px rgba(0,0,0,0.65);
      }
      .scr {
        min-height: 100%;
        height: 100%;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes logoWiggle {
      0%   { transform: rotate(0deg) scale(0.9); }
      12%  { transform: rotate(-12deg) scale(1.04); }
      25%  { transform: rotate(10deg) scale(1.08); }
      38%  { transform: rotate(-8deg) scale(1.05); }
      50%  { transform: rotate(7deg) scale(1.06); }
      62%  { transform: rotate(-5deg) scale(1.04); }
      75%  { transform: rotate(4deg) scale(1.03); }
      88%  { transform: rotate(-2deg) scale(1.01); }
      100% { transform: rotate(0deg) scale(1); }
    }
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeSlideDown {
      from { opacity: 0; transform: translate(-50%, -10px); }
      to   { opacity: 1; transform: translate(-50%, 0); }
    }
    @keyframes popIn {
      0%   { transform: scale(0.5); opacity: 0; }
      60%  { transform: scale(1.12); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes bounceIn {
      0%   { transform: scale(0.3); opacity: 0; }
      55%  { transform: scale(1.15); opacity: 1; }
      75%  { transform: scale(0.95); }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes flashFade {
      0%   { opacity: 0.92; }
      100% { opacity: 0; }
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-8px); }
    }
    @keyframes blinkEyes {
      0%, 90%, 100% { transform: scaleY(1); }
      94%           { transform: scaleY(0.08); }
    }
    /* Eyes Up — rising chevrons + breathing glow */
    @keyframes arrowRise {
      0%, 100% { opacity: 0.22; transform: translateY(6px); }
      50%      { opacity: 1;    transform: translateY(-6px); }
    }
    @keyframes eyesUpGlow {
      0%, 100% { opacity: 0.45; transform: scale(0.88); }
      50%      { opacity: 1;    transform: scale(1.12); }
    }
    @keyframes sheetUp {
      from { transform: translateY(100%); }
      to   { transform: translateY(0); }
    }
    @keyframes glowPulse {
      0%, 100% { opacity: 0.55; }
      50%      { opacity: 0.85; }
    }
    @keyframes sparkleFloat {
      0%   { transform: translateY(6px) scale(0.7); opacity: 0; }
      40%  { opacity: 1; }
      100% { transform: translateY(-6px) scale(1.05); opacity: 1; }
    }
    /* flame flicker — drives the SiEffortOrb fire */
    @keyframes bpFlick { 0%,100% { transform: scaleY(1) scaleX(1) skewX(0deg); } 28% { transform: scaleY(1.08) scaleX(0.95) skewX(-3deg); } 62% { transform: scaleY(0.93) scaleX(1.04) skewX(3deg); } }
    /* crystal animations — used by SiCrystal (active when reduce=false) */
    @keyframes bpFloat { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-5px) rotate(0.6deg); } }
    @keyframes bpGlow { 0%, 100% { opacity: 0.82; transform: scale(1); } 50% { opacity: 1; transform: scale(1.05); } }
    @keyframes bpShimmer { 0%, 100% { opacity: 0.18; } 45% { opacity: 0.7; } }
    @keyframes bpTwinkle { 0%, 100% { opacity: 0; transform: scale(0.6); } 50% { opacity: 0.9; transform: scale(1); } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    /* ─────────────────────────────────────────────────────────
       Config + mode
    ───────────────────────────────────────────────────────── */
    const CFG = window.STAGE_DEMO_CONFIG || { SUPABASE_URL: '', SUPABASE_ANON_KEY: '', ADMIN_PASSCODE: '' };
    const IS_LOCAL = !CFG.SUPABASE_URL;
    const sb = IS_LOCAL ? null : window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);

    const nowIso = () => new Date().toISOString();

    /* ─────────────────────────────────────────────────────────
       Flame orb helpers (ported from joinstick, `si` prefixed)
    ───────────────────────────────────────────────────────── */
    // tiny color helpers
    const siParseHex = (hex) => {
      let h = hex.replace('#', '');
      if (h.length === 3) h = h.split('').map(c => c + c).join('');
      return { r: parseInt(h.slice(0, 2), 16), g: parseInt(h.slice(2, 4), 16), b: parseInt(h.slice(4, 6), 16) };
    };
    const siMix = (a, b, t) => Math.round(a + (b - a) * t);
    const siHexA = (hex, a) => {
      const { r, g, b } = siParseHex(hex);
      return `rgba(${r},${g},${b},${a})`;
    };
    const siLighten = (hex, amt) => {
      const { r, g, b } = siParseHex(hex);
      return `rgb(${siMix(r, 255, amt)},${siMix(g, 255, amt)},${siMix(b, 255, amt)})`;
    };
    const siDarken = (hex, amt) => {
      const { r, g, b } = siParseHex(hex);
      return `rgb(${siMix(r, 0, amt)},${siMix(g, 0, amt)},${siMix(b, 0, amt)})`;
    };
    const siMixHex = (a, b, t) => {
      const A = siParseHex(a), B = siParseHex(b);
      const h = n => siMix(A[n], B[n], t).toString(16).padStart(2, '0');
      return '#' + h('r') + h('g') + h('b');
    };
    // engagement color scale: red(worst) → orange → yellow → green → blue(best)
    const siEngageColor = (intensity) => {
      const stops = [[0, '#E5391E'], [0.27, '#F5821F'], [0.5, '#FFC93C'], [0.72, '#33B96B'], [1, '#2F80ED']];
      const k = Math.max(0, Math.min(100, intensity)) / 100;
      for (let i = 1; i < stops.length; i++) {
        if (k <= stops[i][0]) {
          const a = stops[i - 1], b = stops[i];
          const t = (k - a[0]) / ((b[0] - a[0]) || 1);
          return siMixHex(a[1], b[1], t);
        }
      }
      return stops[stops.length - 1][1];
    };
    // effort level 1–5 from intensity
    const siEffortLevel = (intensity) => {
      const v = Math.max(0, Math.min(100, intensity));
      return v < 20 ? 1 : v < 40 ? 2 : v < 60 ? 3 : v < 80 ? 4 : 5;
    };
    // engagement copy keyed by intensity zone (Thai 3-line message)
    const siZone = (intensity) => {
      if (intensity < 20) return 'z1';
      if (intensity < 40) return 'z2';
      if (intensity < 60) return 'z3';
      if (intensity < 80) return 'z4';
      return 'z5';
    };
    const siMessages = (intensity, name) => {
      const z = siZone(intensity);
      const sets = {
        z5: { state: 'แสงเจิดจ้าเต็มที่', lines: ['สุดยอดมาก', 'การเรียนรู้ของคุณดูดีมาก', 'อย่าลืมพักผ่อนให้เพียงพอด้วยนะ'] },
        z4: { state: 'แสงกำลังสว่างไสว', lines: ['ดูดีเลย', 'การเรียนรู้ของคุณไปได้สวย', 'รักษาระดับไว้นะ'] },
        z3: { state: 'แสงเริ่มหรี่ลง', lines: ['ใช้ได้เลย', 'คุณเริ่มจะลืมแล้ว แต่เป็นเรื่องปกติ', 'ลองเติมแสงอีกหน่อยจะดูดีเลย'] },
        z2: { state: 'แสงเริ่มจาง', lines: ['เราเริ่มห่างกันนะ', 'คุณกำลังลืมหลายเรื่องแล้ว', 'แต่ยังทัน มาโฟกัสกันเลยดีกว่า'] },
        z1: { state: 'แสงแทบจะดับ', lines: ['ดีใจที่กลับมา กำลังเป็นห่วงเลย', 'การเรียนรู้ของคุณหายไปเยอะเลย', 'แต่ยังมีหวัง มาเริ่มกันเลย'] },
      };
      return sets[z];
    };

    /* ─────────────────────────────────────────────────────────
       Constants (per stage-demo contract)
    ───────────────────────────────────────────────────────── */
    const HOLD_MS = 1600;

    const HARVESTER_QUESTIONS = [
      { id: 'q1', dim: 'Inspiration', text: 'วันนี้คุณได้ไอเดียใหม่ ๆ จากเวทีนี้มากแค่ไหน?' },
      { id: 'q2', dim: 'Relevance',   text: 'เนื้อหาที่ฟังเชื่อมโยงกับงานของคุณมากแค่ไหน?' },
      { id: 'q3', dim: 'Action',      text: 'คุณอยากนำสิ่งที่ได้ฟังไปลองใช้จริงมากแค่ไหน?' }
    ];
    const RATING_LABELS = ['น้อยที่สุด', 'น้อย', 'ปานกลาง', 'มาก', 'มากที่สุด'];

    const SURVEY_QUESTIONS = [
      'คุณพึงพอใจกับการใช้งาน Joinstick ที่ได้ทดลองมากน้อยแค่ไหน?',
      'ตลอดการบรรยายนี้คุณคิดว่า Joinstick จะช่วยให้เกิด Behavior Transformation ได้จริงมากน้อยแค่ไหน?'
    ];
    const SURVEY_FACES = [
      { emoji: '😞', label: 'ไม่พอใจ' },
      { emoji: '😕', label: 'เฉย ๆ' },
      { emoji: '🙂', label: 'พอใจ' },
      { emoji: '😄', label: 'พอใจมาก' },
      { emoji: '🤩', label: 'ประทับใจมาก' }
    ];

    const CHALLENGES = [
      { id: 'c1', type: 'Mission',    title: 'ทักคนข้าง ๆ แล้วแลกเปลี่ยน 1 ไอเดียที่ได้จากวันนี้', points: 50, duration: '5 นาที' },
      { id: 'c2', type: 'Quiz',       title: 'Trust Lenses — ทายสไตล์ความไว้ใจของตัวเอง',          points: 30, duration: '3 นาที' },
      { id: 'c3', type: 'Flash Card', title: 'เก็บคำศัพท์ผู้นำยุคใหม่ 5 คำ',                        points: 20, duration: '2 นาที' }
    ];
    const TYPE_STYLES = {
      'Mission':    { color: '#ED4724', bg: 'rgba(237,71,36,0.14)',  border: 'rgba(237,71,36,0.4)' },
      'Quiz':       { color: '#fbbf24', bg: 'rgba(251,191,36,0.12)', border: 'rgba(251,191,36,0.35)' },
      'Flash Card': { color: '#22c55e', bg: 'rgba(34,197,94,0.12)',  border: 'rgba(34,197,94,0.35)' }
    };

    const ADJ = ['Brave','Swift','Sunny','Clever','Mighty','Chill','Cosmic','Turbo','Lucky','Zen'];
    const ANIMAL = ['Otter','Falcon','Panda','Tiger','Dolphin','Fox','Koala','Eagle','Lynx','Bear'];
    const genNickname = () => {
      const a = ADJ[Math.floor(Math.random() * ADJ.length)];
      const b = ANIMAL[Math.floor(Math.random() * ANIMAL.length)];
      const n = String(Math.floor(Math.random() * 90) + 10);
      return a + ' ' + b + ' #' + n;
    };

    /* Learning Energy score (0-100) from 3 harvester ratings (each 0-4, total 0-12)
       → mapped to one of 4 JOINSTICK journey stages. */
    const scoreFromRatings = (ratings) => {
      const total = (ratings.q1 || 0) + (ratings.q2 || 0) + (ratings.q3 || 0);
      return Math.round((total / 12) * 100); // max 100
    };
    const stageFor = (score) => (
      score >= 85 ? { num: 4, role: 'Trailblazer', emoji: '🚀', color: '#22c55e', glow: 'rgba(34,197,94,',
                      headline: 'ดูดีเลย!', sub: 'พลังการเรียนรู้ของคุณเต็มเปี่ยม พร้อมเป็นผู้นำการเปลี่ยนแปลง' }
      : score >= 65 ? { num: 3, role: 'Practitioner', emoji: '🔥', color: '#f97316', glow: 'rgba(249,115,22,',
                        headline: 'ไปได้สวย', sub: 'คุณพร้อมลงมือทำจริง — รักษาโมเมนตัมนี้ไว้นะ' }
      : score >= 40 ? { num: 2, role: 'Explorer', emoji: '🧭', color: '#fbbf24', glow: 'rgba(251,191,36,',
                        headline: 'กำลังมาเลย', sub: 'คุณกำลังเก็บไอเดียและมองหาจุดเชื่อมโยง — ลองเลือกไปทดลองใช้สักอย่าง' }
      : { num: 1, role: 'Observer', emoji: '👀', color: '#a8a29e', glow: 'rgba(168,162,158,',
          headline: 'เริ่มต้นได้ดี', sub: 'การเปลี่ยนแปลงเริ่มจากการมองเห็น — ค่อย ๆ ก้าวไปด้วยกัน' }
    );

    /* ─────────────────────────────────────────────────────────
       Device + resume state helpers
    ───────────────────────────────────────────────────────── */
    const getDeviceId = () => {
      let id = localStorage.getItem('stage_demo_device_id');
      if (!id) {
        id = crypto.randomUUID();
        localStorage.setItem('stage_demo_device_id', id);
      }
      return id;
    };

    const stateKeyFor = (code) => 'stage_demo_state_' + code;
    const loadStateFor = (code) => {
      try {
        const raw = localStorage.getItem(stateKeyFor(code));
        return raw ? JSON.parse(raw) : null;
      } catch (e) { return null; }
    };

    const dbStepFor = (scr) => ({
      join: 'join', welcome: 'harvester', harvester: 'harvester', insight: 'insight',
      challenge: 'challenge', eyes_up: 'eyes_up', survey: 'survey', done: 'done'
    })[scr] || null;

    /* ─────────────────────────────────────────────────────────
       Local-mode storage backend (localStorage + BroadcastChannel)
    ───────────────────────────────────────────────────────── */
    const LOCAL_DB_KEY = 'stage_demo_local_db';
    const EMPTY_DB = { sessions: [], participants: [], harvester_answers: [], survey_responses: [], events: [] };

    const readDb = () => {
      try {
        const raw = localStorage.getItem(LOCAL_DB_KEY);
        if (raw) {
          const db = JSON.parse(raw);
          return {
            sessions: db.sessions || [], participants: db.participants || [],
            harvester_answers: db.harvester_answers || [], survey_responses: db.survey_responses || [],
            events: db.events || []
          };
        }
      } catch (e) {}
      return JSON.parse(JSON.stringify(EMPTY_DB));
    };

    const writeDb = (db) => {
      localStorage.setItem(LOCAL_DB_KEY, JSON.stringify(db));
      try { (new BroadcastChannel('stage_demo_sync')).postMessage({ type: 'db_change' }); } catch (e) {}
    };

    const nextIdFor = (rows) => rows.reduce((m, r) => Math.max(m, typeof r.id === 'number' ? r.id : 0), 0) + 1;

    const localApi = {
      async getSessionByCode(code) {
        const db = readDb();
        const s = db.sessions.find((x) => x.code === code && x.is_active);
        return s ? { ...s } : null;
      },
      async getSessionById(id) {
        const db = readDb();
        const s = db.sessions.find((x) => x.id === id);
        return s ? { ...s } : null;
      },
      async getLatestActiveSession() {
        const db = readDb();
        const actives = db.sessions.filter((x) => x.is_active)
          .sort((a, b) => String(b.created_at).localeCompare(String(a.created_at)));
        return actives.length ? { ...actives[0] } : null;
      },
      async ensureDefaultSession() {
        const db = readDb();
        let s = db.sessions.find((x) => x.code === 'DEMO01' && x.is_active);
        if (!s) {
          s = {
            id: crypto.randomUUID(), code: 'DEMO01', name: 'Local Demo', phase: 'demo',
            is_active: true, created_at: nowIso(), phase_changed_at: nowIso()
          };
          db.sessions.push(s);
          writeDb(db);
        }
        return { ...s };
      },
      async upsertParticipant(p) {
        const db = readDb();
        let row = db.participants.find((x) => x.session_id === p.session_id && x.device_id === p.device_id);
        if (row) {
          row.nickname = p.nickname != null ? p.nickname : row.nickname;
          row.user_agent = p.user_agent != null ? p.user_agent : row.user_agent;
          row.current_step = p.current_step != null ? p.current_step : row.current_step;
          row.last_seen_at = nowIso();
        } else {
          row = {
            id: crypto.randomUUID(), session_id: p.session_id, device_id: p.device_id,
            nickname: p.nickname || null, current_step: p.current_step || 'join',
            user_agent: p.user_agent || null, joined_at: nowIso(), last_seen_at: nowIso()
          };
          db.participants.push(row);
        }
        writeDb(db);
        return { ...row };
      },
      async heartbeat(participantId, step) {
        const db = readDb();
        const row = db.participants.find((x) => x.id === participantId);
        if (row) {
          row.last_seen_at = nowIso();
          if (step) row.current_step = step;
          writeDb(db);
        }
      },
      async getParticipantById(id) {
        const db = readDb();
        const p = db.participants.find((x) => x.id === id);
        return p ? { ...p } : null;
      },
      async saveHarvesterAnswers(rows) {
        const db = readDb();
        rows.forEach((r) => {
          const ex = db.harvester_answers.find((x) => x.participant_id === r.participant_id && x.question_id === r.question_id);
          if (ex) {
            ex.rating = r.rating;
            ex.question_text = r.question_text;
          } else {
            db.harvester_answers.push({ id: nextIdFor(db.harvester_answers), ...r, created_at: nowIso() });
          }
        });
        writeDb(db);
      },
      async saveSurvey(row) {
        const db = readDb();
        const ex = db.survey_responses.find((x) => x.participant_id === row.participant_id);
        if (ex) {
          ex.rating = row.rating;
          ex.rating2 = row.rating2;
          ex.comment = row.comment;
        } else {
          db.survey_responses.push({ id: nextIdFor(db.survey_responses), ...row, created_at: nowIso() });
        }
        writeDb(db);
      },
      async logEvent(row) {
        const db = readDb();
        db.events.push({
          id: nextIdFor(db.events), session_id: row.session_id || null,
          participant_id: row.participant_id || null, event_type: row.event_type,
          payload: row.payload || {}, created_at: nowIso()
        });
        writeDb(db);
      },
      subscribeSession(sessionId, cb) {
        const fire = () => {
          const db = readDb();
          const s = db.sessions.find((x) => x.id === sessionId);
          if (s) cb({ ...s });
        };
        let ch = null;
        try {
          ch = new BroadcastChannel('stage_demo_sync');
          ch.onmessage = fire;
        } catch (e) {}
        const iv = setInterval(fire, 2000); // always poll-reload localStorage (contract)

        const { data, error } = await sb.from('demo_sessions').select('*').eq('code', code).eq('is_active', true).maybeSingle();
        if (error) throw error;
        return data;
      },
      async getSessionById(id) {
        const { data, error } = await sb.from('demo_sessions').select('*').eq('id', id).maybeSingle();
        if (error) throw error;
        return data;
      },
      async getLatestActiveSession() {
        const { data, error } = await sb.from('demo_sessions').select('*')
          .eq('is_active', true).order('created_at', { ascending: false }).limit(1);
        if (error) throw error;
        return (data && data.length) ? data[0] : null;
      },
      async ensureDefaultSession() { return null; },
      async upsertParticipant(p) {
        const { data, error } = await sb.from('demo_participants').upsert({
          session_id: p.session_id, device_id: p.device_id, nickname: p.nickname,
          user_agent: p.user_agent, current_step: p.current_step, last_seen_at: nowIso()
        }, { onConflict: 'session_id,device_id' }).select().single();
        if (error) throw error;
        return data;
      },
      async heartbeat(participantId, step) {
        const patch = { last_seen_at: nowIso() };
        if (step) patch.current_step = step;
        const { error } = await sb.from('demo_participants').update(patch).eq('id', participantId);
        if (error) throw error;
      },
      async getParticipantById(id) {
        const { data, error } = await sb.from('demo_participants').select('id').eq('id', id).maybeSingle();
        if (error) throw error;
        return data;
      },
      async saveHarvesterAnswers(rows) {
        const { error } = await sb.from('demo_harvester_answers').upsert(rows, { onConflict: 'participant_id,question_id' });
        if (error) throw error;
      },
      async saveSurvey(row) {
        const { error } = await sb.from('demo_survey_responses').upsert(row, { onConflict: 'participant_id' });
        if (error) throw error;
      },
      async logEvent(row) {
        const { error } = await sb.from('demo_events').insert({
          session_id: row.session_id || null, participant_id: row.participant_id || null,
          event_type: row.event_type, payload: row.payload || {}
        });
        if (error) throw error;
      },
      subscribeSession(sessionId, cb) {
        const ch = sb.channel('stage-demo-' + sessionId)
          .on('postgres_changes',
            { event: '*', schema: 'public', table: 'demo_sessions', filter: 'id=eq.' + sessionId },
            (payload) => { if (payload && payload.new && payload.new.id) cb(payload.new); })
          .subscribe();
        return () => { try { sb.removeChannel(ch); } catch (e) {} };
      }
    };

    const RING_R = 46;
    const RING_C = 2 * Math.PI * RING_R;

    /* One corner pad. Controlled by JoinScreen: reports its own press via
       onDown/onUp; `pressed` = this pad is down, `active` = BOTH pads are down
       (drives the progress ring so both fill together). */
    const HoldPad = ({ side, enabled, pressed, active, onDown, onUp }) => {
      const padRef = useRef(null);
      const isLeft = side === 'left';

      useEffect(() => {
        const el = padRef.current;
        if (!el) return;
        const prevent = (e) => { e.preventDefault(); };
        el.addEventListener('touchstart', prevent, { passive: false }); // stops iOS long-press callout
        el.addEventListener('contextmenu', prevent);
        return () => {
          el.removeEventListener('touchstart', prevent);
          el.removeEventListener('contextmenu', prevent);
        };
      }, []);

      const start = (e) => {
        if (!enabled) return;
        if (padRef.current && e.pointerId !== undefined && padRef.current.setPointerCapture) {
          try { padRef.current.setPointerCapture(e.pointerId); } catch (err) {}
        }
        onDown();
      };

      const cornerRadius = isLeft ? '0 100% 0 0' : '100% 0 0 0';
      const transformOrigin = isLeft ? 'bottom left' : 'bottom right';
      const sidePos = isLeft ? { left: 0 } : { right: 0 };
      const fpPos = isLeft ? { left: 30, bottom: 26 } : { right: 30, bottom: 26 };
      const ringPos = isLeft ? { left: 6, bottom: 2 } : { right: 6, bottom: 2 };

      return (
        <div ref={padRef}
          onPointerDown={start} onPointerUp={onUp} onPointerCancel={onUp} onPointerLeave={onUp}
          style={{
            position: 'absolute', bottom: 0, width: 150, height: 150, zIndex: 5, ...sidePos,
            background: '#ffffff', borderRadius: cornerRadius,
            opacity: enabled ? 1 : 0.4,
            transform: pressed ? 'scale(1.06)' : 'scale(1)', transformOrigin: transformOrigin,
            filter: pressed ? 'brightness(1.12)' : 'brightness(1)',
            transition: 'transform 0.18s ease, filter 0.18s ease, opacity 0.3s ease',
            touchAction: 'none', userSelect: 'none', WebkitUserSelect: 'none',
            WebkitTouchCallout: 'none', cursor: enabled ? 'pointer' : 'default'
          }}>
          <div style={{ position: 'absolute', pointerEvents: 'none', ...fpPos }}>
            <FingerprintIcon size={60} color="#ED4724" rotate={isLeft ? -15 : 15}/>
          </div>
          <svg width="108" height="108" viewBox="0 0 108 108"
            style={{ position: 'absolute', transform: 'rotate(-90deg)', pointerEvents: 'none', ...ringPos }}>
            <circle cx="54" cy="54" r={RING_R} fill="none" stroke="rgba(237,71,36,0.18)" strokeWidth="5"
              style={{ opacity: active ? 1 : 0, transition: 'opacity 0.2s ease' }}/>
            <circle cx="54" cy="54" r={RING_R} fill="none" stroke="#ED4724" strokeWidth="5" strokeLinecap="round"
              strokeDasharray={RING_C} strokeDashoffset={active ? 0 : RING_C}
              style={{ transition: active ? 'stroke-dashoffset ' + HOLD_MS + 'ms linear' : 'stroke-dashoffset 0.25s ease' }}/>
          </svg>
        </div>
      );
    };

    const JoinScreen = ({ session, onJoin }) => {
      const [flash, setFlash] = useState(false);
      const [leftDown, setLeftDown] = useState(false);
      const [rightDown, setRightDown] = useState(false);
      const enabled = !!session && !flash;
      const bothHeld = enabled && leftDown && rightDown;
      const timerRef = useRef(null);

      const handleHoldComplete = () => {
        if (navigator.vibrate) { try { navigator.vibrate(40); } catch (e) {} }
        setFlash(true);
        setLeftDown(false);
        setRightDown(false);
        setTimeout(() => { onJoin(); }, 320);
        setTimeout(() => { setFlash(false); }, 1200); // safety reset if join failed
      };

      /* arm the join timer only while BOTH pads are held; release either → cancel */
      useEffect(() => {
        if (bothHeld) {
          timerRef.current = setTimeout(() => {
            timerRef.current = null;
            handleHoldComplete();
          }, HOLD_MS);
          return () => { if (timerRef.current) { clearTimeout(timerRef.current); timerRef.current = null; } };
        }
      }, [bothHeld]);

      /* PC testing: hold A (left pad) + ' (right pad) together */
      useEffect(() => {
        if (!session) return;
        const isLeftKey = (e) => e.code === 'KeyA' || (e.key && e.key.toLowerCase() === 'a');
        const isRightKey = (e) => e.code === 'Quote' || e.key === "'" || e.key === '"';
        const down = (e) => {
          if (e.repeat) return;
          if (isLeftKey(e)) { e.preventDefault(); setLeftDown(true); }
          else if (isRightKey(e)) { e.preventDefault(); setRightDown(true); }

        const up = (e) => {
          if (isLeftKey(e)) setLeftDown(false);
          else if (isRightKey(e)) setRightDown(false);
        };
        const clearAll = () => { setLeftDown(false); setRightDown(false); };
        window.addEventListener('keydown', down);
        window.addEventListener('keyup', up);
        window.addEventListener('blur', clearAll);
        return () => {
          window.removeEventListener('keydown', down);
          window.removeEventListener('keyup', up);
          window.removeEventListener('blur', clearAll);
        };
      }, [session]);

    const HarvesterScreen = ({ onFinish }) => {
      const [qi, setQi] = useState(0);
      const [ratings, setRatings] = useState({});
      const [sel, setSel] = useState(null);

            <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 36, padding: '0 2px' }}>
              {[0, 1, 2, 3, 4].map((v) => {
                const on = sel === v;

                  <button key={v} onClick={() => pick(v)} style={{
                    width: 56, height: 56, borderRadius: '50%', cursor: 'pointer',
                    background: on ? '#f97316' : 'rgba(255,255,255,0.04)',
                    border: '1.5px solid ' + (on ? '#f97316' : 'rgba(255,255,255,0.22)'),
                    color: on ? '#ffffff' : '#d6d3d1',
                    fontFamily: "'JetBrains Mono', monospace", fontSize: 18, fontWeight: 600,
                    boxShadow: on ? '0 6px 20px rgba(249,115,22,0.45)' : 'none',
                    animation: on ? 'popIn 0.25s ease' : 'none',

              display: 'flex', justifyContent: 'space-between',
              color: '#78716c', fontSize: 11, marginTop: 10, padding: '0 2px'

              <span>{RATING_LABELS[0]}</span>

            <div className="font-th" style={{
              textAlign: 'center', marginTop: 20, minHeight: 22, fontSize: 14, fontWeight: 600,

            }}>
              {sel !== null ? RATING_LABELS[sel] : 'แตะเพื่อเลือกคะแนน'}

    /* ─────────────────────────────────────────────────────────
       4. INSIGHT — SiCrystal + SiEffortOrb
       Direct copies of BPCrystal / BPEffortOrb (flame mode) from
       /JOINSTICK_App/project/joinstick.html — renamed only.
    ───────────────────────────────────────────────────────── */

    /* ── SiCrystal — copy of BPCrystal. Renames: hexA→siHexA, lighten→siLighten,
       darken→siDarken, engageColor→siEngageColor, bp IDs→si IDs. ── */
    const SiCrystal = ({ intensity = 50, size = 200, color, reduce = false }) => {
      const c = color || siEngageColor(intensity);
      const k = Math.max(0, Math.min(100, intensity)) / 100;
      const scale = 0.84 + k * 0.20;
      const glow = 0.32 + k * 0.5;
      const lighter = siLighten(c, 0.62), light = siLighten(c, 0.32), dark = siDarken(c, 0.26), darker = siDarken(c, 0.46);
      const animFloat = reduce ? 'none' : 'bpFloat 4.6s ease-in-out infinite';
      const animGlow  = reduce ? 'none' : 'bpGlow 3.6s ease-in-out infinite';
      const animShim  = reduce ? 'none' : 'bpShimmer 4.2s ease-in-out infinite';
      const sparks = [{ x: '24%', y: '30%', d: 0 }, { x: '74%', y: '40%', d: 1.3 }, { x: '66%', y: '74%', d: 2.4 }];
      return (
        <div style={{ position: 'relative', width: size, height: size, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          <div style={{
            position: 'absolute', inset: '-14%', borderRadius: '50%',
            background: `radial-gradient(circle at 50% 50%, ${siHexA(c, 0.5 * glow)} 0%, ${siHexA(c, 0.14 * glow)} 38%, transparent 64%)`,
            filter: 'blur(6px)', animation: animGlow,
          }} />
          {sparks.map((s, i) => (
            <svg key={i} viewBox="0 0 10 10" width="11" height="11" style={{
              position: 'absolute', left: s.x, top: s.y, opacity: 0,
              animation: reduce ? 'none' : `bpTwinkle ${(2.8 + i * 0.6).toFixed(1)}s ease-in-out ${s.d}s infinite`,
            }}>
              <path d="M5 0 L6 4 L10 5 L6 6 L5 10 L4 6 L0 5 L4 4 Z" fill={siLighten(c, 0.5)} />
            </svg>
          ))}
          <div style={{ position: 'relative', zIndex: 1, transform: `scale(${scale})`, animation: animFloat, lineHeight: 0 }}>
            <svg viewBox="0 0 100 122" width={size * 0.6} height={size * 0.74} style={{ filter: `drop-shadow(0 12px 24px ${siHexA(c, 0.5)})` }}>
              <defs>
                <linearGradient id="siCryCrownL" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stopColor="#FFFFFF" /><stop offset="100%" stopColor={lighter} />
                </linearGradient>
                <linearGradient id="siCryCrownR" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stopColor={lighter} /><stop offset="100%" stopColor={light} />
                </linearGradient>
                <linearGradient id="siCryL" x1="0" y1="0" x2="0.3" y2="1">
                  <stop offset="0" stopColor={light} /><stop offset="100%" stopColor={c} />
                </linearGradient>
                <linearGradient id="siCryR" x1="1" y1="0" x2="0.6" y2="1">
                  <stop offset="0" stopColor={c} /><stop offset="100%" stopColor={darker} />
                </linearGradient>
              </defs>
              <polygon points="50,6 26,40 50,46" fill="url(#siCryCrownL)" />
              <polygon points="50,6 74,40 50,46" fill="url(#siCryCrownR)" />
              <polygon points="26,40 50,46 50,116 34,88" fill="url(#siCryL)" />
              <polygon points="74,40 50,46 50,116 66,88" fill="url(#siCryR)" />
              <polygon points="26,40 34,88 28,84 22,44" fill={darker} opacity="0.55" />
              <polygon points="74,40 66,88 72,84 78,44" fill={dark} opacity="0.5" />
              <polygon points="50,6 38,34 50,46" fill="#FFFFFF" opacity="0.5" style={{ animation: animShim }} />
              <polygon points="50,6 26,40 34,88 50,116 66,88 74,40" fill="none" stroke={siHexA(darker, 0.55)} strokeWidth="1" strokeLinejoin="round" />
              <line x1="50" y1="46" x2="50" y2="116" stroke={siHexA(lighter, 0.4)} strokeWidth="0.8" />
            </svg>
          </div>
        </div>
      );
    };

    /* ── SiEffortOrb — copy of BPEffortOrb (flame mode only, __FX='flame').
       Renames: hexA→siHexA, lighten→siLighten, darken→siDarken,
       bpEffortLevel→siEffortLevel, React.useRef→useRef.
       Added: score prop drives the watermark (replaces hardcoded 82). ── */
    const SiEffortOrb = ({ intensity = 50, score = 0, size = 284, accent = '#ED4724', reduce = false, dark = true, spread = 1, trend = 1 }) => {
      const level = siEffortLevel(intensity);
      const c = accent;
      const S = size;
      const W = Math.round(S * spread);
      const R = [0.16, 0.235, 0.31, 0.385, 0.46];
      const D = 2 * R[level - 1] * S;
      const bloomD = Math.min(S * 1.08, D * 1.8);
      const cx = W / 2, cy = S / 2;

      const ctr = (d, extra = {}) => ({
        position: 'absolute', left: cx, top: cy, width: d, height: d,
        transform: 'translate(-50%,-50%)', borderRadius: '50%', boxSizing: 'border-box', ...extra,
      });
      const gidRef = useRef();
      if (!gidRef.current) gidRef.current = 'siorb' + Math.random().toString(36).slice(2, 8);
      const gid = gidRef.current;

      // REALISTIC FIRE — teardrop body with a vertical fire gradient, radial inner glow, base hot-spot, soft halo, gentle flicker.
      const baseY = cy + S * 0.08;
      const fh = (0.26 + (level - 1) * 0.05) * S;
      const fwRatio = level <= 3 ? 0.58 : 0.58 + (level - 3) * 0.12;
      const fw = fh * fwRatio;
      const FD = "M50 5 C60 40 89 56 89 90 C89 118 71 132 50 132 C29 132 11 118 11 90 C11 56 40 40 50 5 Z";
      const g = gid + 'F';
      // colour scale ticks flanking the flame — 5 levels, current one lit
      const COL5 = ['#E5391E', '#F5821F', '#FFC93C', '#33B96B', '#2F80ED'];
      const tickX = S * 0.6, tickMidY = cy - S * 0.19, tickColH = S * 0.4;
      const sideTicks = (sign) => (
        <div style={{ position: 'absolute', left: cx + sign * tickX, top: tickMidY, transform: 'translate(-50%,-50%)', height: tickColH,
          display: 'flex', flexDirection: 'column-reverse', justifyContent: 'space-between', alignItems: 'center', pointerEvents: 'none' }}>
          {COL5.map((col, i) => {
            const on = i === level - 1;
            return <div key={i} style={{ width: on ? S * 0.058 : S * 0.038, height: 2.5, borderRadius: 999, background: col, opacity: on ? 1 : 0.26, boxShadow: on ? `0 0 6px ${siHexA(col, 0.85)}` : 'none', transition: 'all .2s' }} />;
          })}
        </div>
      );

      return (
        <div style={{ position: 'relative', width: W, height: S, flexShrink: 0 }}>
          {/* dim ambient bloom so the dark sphere doesn't read as a hole */}
          <div style={ctr(bloomD)}>
            <div style={{
              width: '100%', height: '100%', borderRadius: '50%',
              background: `radial-gradient(circle at 50% 40%, ${siHexA(c, dark ? 0.11 : 0.09)} 0%, ${siHexA(c, 0)} 58%)`,
              filter: `blur(${(S * 0.04).toFixed(1)}px)`,
            }} />
          </div>

          {sideTicks(-1)}
          {sideTicks(1)}
          {/* Circle Progress Bar wrapping the flame — symmetric: fills from the bottom up
              BOTH sides to two endpoints near the top-centre */}
          {(() => {
            const rPB = S * 0.44;
            const topGapHalf = 12;              // small opening at top-centre → two distinct endpoints
            const span = 180 - topGapHalf;      // each side sweeps bottom (90°) → near top
            // fill so the head reaches the SAME plane as the current level's side tick
            const lvlTickY = (tickMidY + tickColH / 2) - ((level - 1) / 4) * tickColH;
            const headAngle = Math.asin(Math.max(-1, Math.min(1, (lvlTickY - cy) / rPB))) * 180 / Math.PI;
            const prog = Math.max(0, Math.min(1, (90 - headAngle) / span));
            const ptOf = (deg) => { const a = deg * Math.PI / 180; return [cx + rPB * Math.cos(a), cy + rPB * Math.sin(a)]; };
            const arc = (fromDeg, toDeg, sweep) => {
              const [x0, y0] = ptOf(fromDeg), [x1, y1] = ptOf(toDeg);
              const large = Math.abs(toDeg - fromDeg) > 180 ? 1 : 0;
              return `M ${x0.toFixed(2)} ${y0.toFixed(2)} A ${rPB.toFixed(2)} ${rPB.toFixed(2)} 0 ${large} ${sweep} ${x1.toFixed(2)} ${y1.toFixed(2)}`;
            };
            const pw = S * 0.026;
            const pg = gid + 'PB';
            const rightEnd = 90 - span * prog;  // right side climbs (sweep 0)
            const leftEnd = 90 + span * prog;   // left side climbs (sweep 1)
            const track = siHexA('#FFFFFF', dark ? 0.09 : 0.12);
            const glow = { filter: `drop-shadow(0 0 ${(S * 0.02).toFixed(0)}px ${siHexA(c, 0.7)})` };
            return (
              <svg width={W} height={S} viewBox={`0 0 ${W} ${S}`} style={{ position: 'absolute', inset: 0, overflow: 'visible', pointerEvents: 'none' }}>
                <defs>
                  <linearGradient id={pg} x1="0" y1="1" x2="0" y2="0">
                    <stop offset="0" stopColor={siDarken(c, 0.12)} />
                    <stop offset="0.5" stopColor={c} />
                    <stop offset="1" stopColor={siLighten(c, 0.45)} />
                  </linearGradient>
                </defs>
                {/* track — both sides, full span with a small top gap */}
                <path d={arc(90, 90 - span, 0)} fill="none" stroke={track} strokeWidth={pw} strokeLinecap="round" />
                <path d={arc(90, 90 + span, 1)} fill="none" stroke={track} strokeWidth={pw} strokeLinecap="round" />
                {/* progress — from the bottom up both sides toward the top-centre */}
                <path d={arc(90, rightEnd, 0)} fill="none" stroke={`url(#${pg})`} strokeWidth={pw} strokeLinecap="round" style={glow} />
                <path d={arc(90, leftEnd, 1)} fill="none" stroke={`url(#${pg})`} strokeWidth={pw} strokeLinecap="round" style={glow} />
              </svg>
            );
          })()}
          {/* big faint Score — sits BEHIND the flame as a watermark */}
          <div style={{ position: 'absolute', left: cx, top: cy - S * 0.12, transform: 'translate(-50%,-50%)', zIndex: 0, pointerEvents: 'none',
            fontFamily: "'Poppins', 'IBM Plex Sans Thai', sans-serif", fontWeight: 700, fontSize: Math.round(S * 0.42), lineHeight: 1,
            letterSpacing: '0.08em',
            background: 'linear-gradient(180deg, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0.18) 45%, rgba(70,70,70,0.10) 100%)',
            WebkitBackgroundClip: 'text', backgroundClip: 'text', WebkitTextFillColor: 'transparent', color: 'transparent' }}>{score}</div>
          {/* ambient bloom on the horizon */}
          <div style={{ position: 'absolute', left: cx, top: baseY, transform: 'translate(-50%,-50%)', width: fw * 1.8, height: fh * 0.6, borderRadius: '50%',
            background: `radial-gradient(ellipse, ${siHexA(c, dark ? 0.5 : 0.34)} 0%, ${siHexA(c, 0)} 70%)`, filter: `blur(${(S * 0.05).toFixed(0)}px)`, pointerEvents: 'none' }} />
          <div style={{ position: 'absolute', left: cx, top: baseY, width: fw, height: fh, transform: 'translate(-50%,-100%)', pointerEvents: 'none' }}>
            <svg width="100%" height="100%" viewBox="0 0 100 137" style={{ display: 'block', overflow: 'visible', transformOrigin: '50% 100%', animation: reduce ? 'none' : 'bpFlick 2.6s ease-in-out infinite' }}>
              <defs>
                <linearGradient id={g + 'b'} x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stopColor={siHexA(c, 0)} />
                  <stop offset="0.12" stopColor={siHexA(c, 0.55)} />
                  <stop offset="0.36" stopColor={c} />
                  <stop offset="0.64" stopColor={siLighten(c, 0.5)} />
                  <stop offset="0.9" stopColor={siLighten(c, 0.85)} />
                  <stop offset="1" stopColor="#FFFFFF" />
                </linearGradient>
                <radialGradient id={g + 'rc'} cx="50%" cy="62%" r="52%">
                  <stop offset="0" stopColor="#FFFFFF" />
                  <stop offset="0.32" stopColor={siLighten(c, 0.78)} />
                  <stop offset="0.62" stopColor={siHexA(c, 0.45)} />
                  <stop offset="1" stopColor={siHexA(c, 0)} />
                </radialGradient>
                <filter id={g + 'gl'} x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="4.5" /></filter>
                <filter id={g + 'soft'} x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.3" /></filter>
              </defs>
              {/* soft outer halo */}
              <path d={FD} fill={siHexA(c, 0.4)} filter={`url(#${g}gl)`} transform="translate(50 132) scale(1.16) translate(-50 -132)" />
              {/* main fire body */}
              <path d={FD} fill={`url(#${g}b)`} filter={`url(#${g}soft)`} />
              {/* radial inner glow — the luminous heart, low-centred so it flows into the base */}
              <ellipse cx="50" cy="106" rx="22" ry="48" fill={`url(#${g}rc)`} opacity="0.92" />
              {/* white-hot base hot-spot */}
              <ellipse cx="50" cy="118" rx="15" ry="18" fill="#FFFFFF" filter={`url(#${g}soft)`} opacity="0.95" />
            </svg>
          </div>
        </div>
      );
    };

    /* ═══════════════════════════════════════════════════════════════

    );

    /* ─────────────────────────────────────────────────────────
       7. SURVEY — 1 question, 5 emoji faces
    ───────────────────────────────────────────────────────── */
    /* 5-level satisfaction face, drawn as a line-SVG (replaces the OS emoji) */
    const FaceIcon = ({ level, size = 32, color = 'currentColor' }) => {
      const mouths = {
        1: 'M8.4 16 Q12 12.4 15.6 16',     // frown
        2: 'M8.4 15.2 Q12 13.6 15.6 15.2', // slight frown
        3: 'M9 14.6 L15 14.6',             // flat
        4: 'M8.4 14 Q12 16.6 15.6 14',     // smile
        5: 'M7.8 13.4 Q12 18 16.2 13.4'    // big smile
      };
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color}
          strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round">
          <circle cx="12" cy="12" r="9.2" />
          {level === 5 ? (
            <>
              <path d="M7.6 10.4 Q9 8.9 10.4 10.4" />
              <path d="M13.6 10.4 Q15 8.9 16.4 10.4" />
            </>
          ) : (
            <>
              <circle cx="9" cy="9.9" r="1.05" fill={color} stroke="none" />
              <circle cx="15" cy="9.9" r="1.05" fill={color} stroke="none" />
            </>
          )}
          <path d={mouths[level]} />
        </svg>
      );
    };

    const SurveyScreen = ({ onSubmit, busy }) => {
      const [ratings, setRatings] = useState([0, 0]);
      const [comment, setComment] = useState('');
      const setR = (qi, v) => setRatings(rs => rs.map((x, i) => (i === qi ? v : x)));
      const allRated = ratings.every(r => r > 0);

      // one question's 5-face row + selected-label
      const faces = (qi) => (
        <>
          <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 16, padding: '0 2px' }}>
            {SURVEY_FACES.map((f, i) => {
              const v = i + 1, on = ratings[qi] === v;
              return (
                <button key={v} onClick={() => setR(qi, v)} aria-label={f.label} style={{
                  width: 52, height: 52, borderRadius: '50%', border: 'none', cursor: 'pointer', padding: 0,
                  background: 'transparent',
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                  transform: on ? 'scale(1.18)' : 'scale(1)',
                  transition: 'all 0.2s ease'
                }}>
                  <FaceIcon level={v} size={34} color={on ? '#ED4724' : '#a8a29e'} />
                </button>
              );
            })}
          </div>
          <div className="font-th" style={{ textAlign: 'center', marginTop: 11, minHeight: 20, fontSize: 13.5, fontWeight: 600, color: ratings[qi] ? '#ED4724' : '#57534e' }}>
            {ratings[qi] ? SURVEY_FACES[ratings[qi] - 1].label : 'แตะเลือกความรู้สึกของคุณ'}
          </div>
        </>
      );

      return (
        <div style={{ flex: 1, display: 'flex', flexDirection: 'column', padding: '34px 24px 32px', position: 'relative', overflowY: 'auto' }}>
          <div style={{
            position: 'absolute', top: -50, left: -60, width: 200, height: 200, borderRadius: '50%',
            background: 'rgba(237,71,36,0.10)', filter: 'blur(44px)', pointerEvents: 'none'
          }}/>

          <h2 className="font-th" style={{ color: '#ffffff', fontSize: 23, fontWeight: 800, margin: 0 }}>
            ขอบคุณที่ร่วมเล่น!
          </h2>
          <p className="font-th" style={{ color: '#a8a29e', fontSize: 13, margin: '8px 0 0' }}>
            ขออีกนิดเดียว — 2 คำถามสั้น ๆ
          </p>

          {SURVEY_QUESTIONS.map((q, qi) => (
            <div key={qi} style={{ marginTop: qi === 0 ? 28 : 26 }}>
              <div className="font-th" style={{ color: '#ffffff', fontSize: 16, fontWeight: 600, lineHeight: 1.6 }}>
                <span style={{ color: '#ED4724', fontWeight: 700 }}>{qi + 1}.</span> {q}
              </div>
              {faces(qi)}
            </div>
          ))}

          <textarea
            value={comment}
            onChange={(e) => setComment(e.target.value)}
            placeholder={"บอกเราหน่อยว่าชอบ/อยากให้ปรับอะไร\n(ไม่บังคับ)"}
            className="font-th"
            style={{
              width: '100%', minHeight: 84, marginTop: 22, padding: 14, boxSizing: 'border-box',
              background: 'rgba(255,255,255,0.05)', border: '1px solid rgba(255,255,255,0.12)',
              borderRadius: 16, color: '#fafaf9', fontSize: 16, lineHeight: 1.6,
              resize: 'none', outline: 'none'
            }}/>

          <div style={{ flex: 1, minHeight: 16 }}/>
          <button
            onClick={() => { if (allRated && !busy) onSubmit(ratings, comment); }}
            disabled={!allRated || busy}
            className="font-th"
            style={{
              width: '100%', marginTop: 20, padding: '15px 0', borderRadius: 16, border: 'none', flexShrink: 0,
              background: allRated ? '#ED4724' : 'rgba(255,255,255,0.08)',
              color: allRated ? '#ffffff' : '#57534e',
              fontSize: 15, fontWeight: 700, cursor: allRated && !busy ? 'pointer' : 'default',
              boxShadow: allRated ? '0 8px 24px rgba(237,71,36,0.4)' : 'none',
              transition: 'background 0.2s ease, color 0.2s ease'
            }}>
            {busy ? 'กำลังส่ง...' : 'ส่งคำตอบ'}
          </button>
        </div>
      );
    };

    /* ─────────────────────────────────────────────────────────
       8. DONE — booth info (persistent end state)
    ───────────────────────────────────────────────────────── */
    const DoneScreen = () => (
      <div style={{
        flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center',
        justifyContent: 'center', padding: '40px 24px', textAlign: 'center',
        position: 'relative', overflow: 'hidden'
      }}>
        <div style={{
          position: 'absolute', bottom: -80, left: '50%', transform: 'translateX(-50%)',
          width: 320, height: 320, borderRadius: '50%', pointerEvents: 'none',
          background: 'radial-gradient(circle, rgba(237,71,36,0.16) 0%, transparent 65%)', filter: 'blur(20px)'
        }}/>

        <div style={{
          width: 74, height: 74, borderRadius: '50%', background: '#22c55e',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          fontSize: 34, color: '#ffffff', boxShadow: '0 8px 32px rgba(34,197,94,0.35)',
          animation: 'bounceIn 0.6s ease both'
        }}>✓</div>
        <h2 className="font-th" style={{ color: '#ffffff', fontSize: 24, fontWeight: 800, margin: '18px 0 6px' }}>
          ขอบคุณมาก!
        </h2>
        <p className="font-th" style={{ color: '#a8a29e', fontSize: 13, margin: 0 }}>
          คำตอบของคุณถูกบันทึกแล้ว
        </p>

        <div style={{
          width: '100%', marginTop: 28, background: '#1c1917',
          border: '1px solid rgba(237,71,36,0.35)', borderRadius: 22,
          padding: '26px 22px', position: 'relative', zIndex: 2,
          display: 'flex', flexDirection: 'column', alignItems: 'center',
          animation: 'fadeSlideUp 0.5s ease both 0.25s'
        }}>
          <JoinstickLogo size={44} variant="white"/>
          <div className="font-th" style={{ color: '#ffffff', fontSize: 16, fontWeight: 700, marginTop: 14 }}>
            อยากรู้จัก JOINSTICK มากขึ้น?
          </div>
          <div className="font-th" style={{ color: '#a8a29e', fontSize: 13, marginTop: 6 }}>
            แวะมาคุยกับทีม BASE Playhouse ได้ที่บูธ
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginTop: 14 }}>
            <MapPinIcon size={28} color="#ED4724"/>
            <span className="font-mono-num" style={{ fontSize: 44, fontWeight: 600, color: '#ED4724', letterSpacing: '0.02em' }}>
              E11
            </span>
          </div>
          <div className="font-th" style={{ color: '#78716c', fontSize: 12.5, lineHeight: 1.7, marginTop: 12 }}>
            มาดูเวอร์ชันเต็ม พร้อมคุยเรื่องการวัดผลการเรียนรู้ในองค์กรของคุณ
          </div>
        </div>

        <a href="https://baseos.co/pmat2026/joinstick?src=li-app" target="_blank" rel="noopener noreferrer"
          className="font-th" style={{
            width: '100%', marginTop: 18, padding: '15px 0', borderRadius: 16,
            background: '#ED4724', color: '#ffffff', fontSize: 15, fontWeight: 700,
            textAlign: 'center', textDecoration: 'none', cursor: 'pointer',
            boxShadow: '0 8px 24px rgba(237,71,36,0.4)', position: 'relative', zIndex: 2
          }}>
          สนใจ JOINSTICK →
        </a>
      </div>
    );

    /* ─────────────────────────────────────────────────────────
       App — screen state machine + phase watcher + heartbeat
    ───────────────────────────────────────────────────────── */
    const App = () => {
      const [screen, setScreen] = useState('boot');
      const [session, setSession] = useState(null);
      const [participant, setParticipant] = useState(null);
      const [resume, setResume] = useState(null);
      const [hvRatings, setHvRatings] = useState({});
      const [toast, setToast] = useState(null);
      const [surveyBusy, setSurveyBusy] = useState(false);

      const sessionRef = useRef(null);
      const participantRef = useRef(null);
      const resumeRef = useRef(null);
      const screenRef = useRef('boot');
      const lastPhaseRef = useRef(null);
      const lastDbStepRef = useRef(null);
      const toastTimerRef = useRef(null);

      const urlCode = useMemo(() => {
        const c = new URLSearchParams(location.search).get('s');
        return c ? c.toUpperCase() : '';
      }, []);

      const showToast = useCallback((msg) => {
        setToast(msg || 'การเชื่อมต่อมีปัญหา ลองใหม่อีกครั้ง');
        if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
        toastTimerRef.current = setTimeout(() => setToast(null), 3000);
      }, []);

      const saveResume = useCallback((patch) => {
        const sess = sessionRef.current;
        if (!sess) return;
        const next = { ...(resumeRef.current || {}), ...patch };
        resumeRef.current = next;
        setResume(next);
        try { localStorage.setItem(stateKeyFor(sess.code), JSON.stringify(next)); } catch (e) {}
      }, []);

      /* PHASE ROUTING RULE (contract) */
      const routeForPhase = useCallback((phase) => {
        if (!participantRef.current) { setScreen('join'); return; }
        const st = resumeRef.current || {};
        if (phase === 'eyes_up') { setScreen('eyes_up'); return; }
        if (phase === 'survey') {
          setScreen((st.surveyDone || st.step === 'done') ? 'done' : 'survey');
          return;
        }
        // phase 'demo' — resume saved step; done stays done
        if (st.surveyDone || st.step === 'done') { setScreen('done'); return; }
        if (st.step === 'insight' || st.step === 'challenge') setScreen('insight');
        else setScreen('harvester');
      }, []);

      const initSession = useCallback((sess) => {
        sessionRef.current = sess;
        setSession(sess);
        lastPhaseRef.current = sess.phase;
        const saved = loadStateFor(sess.code);
        resumeRef.current = saved || null;
        setResume(saved || null);
        if (saved && saved.hvRatings) setHvRatings(saved.hvRatings);
        if (saved && saved.participantId) {
          const p = { id: saved.participantId, nickname: saved.nickname };
          participantRef.current = p;
          setParticipant(p);
          routeForPhase(sess.phase);
        } else {
          setScreen('join');
        }
      }, [routeForPhase]);

      /* boot: scan = in. Resolve session with no typing, retrying until one opens:
         1) ?s= code from the QR  2) latest active session  3) local default */
      useEffect(() => {
        let alive = true;
        let timer = null;
        const resolveSession = async () => {
          if (!alive || sessionRef.current) return;
          let sess = null;
          try {
            if (urlCode) {
              try { sess = await api.getSessionByCode(urlCode); } catch (e) {}
            }
            if (!sess) {
              try { sess = await api.getLatestActiveSession(); } catch (e) {}
            }
            if (!sess && IS_LOCAL) sess = await api.ensureDefaultSession();
          } catch (e) {}
          if (!alive) return;
          if (sess) {
            initSession(sess);
          } else {
            // no active session yet — show join screen (pad disabled) and keep retrying
            if (screenRef.current === 'boot') setScreen('join');
            timer = setTimeout(resolveSession, 5000);
          }
        };
        resolveSession();
        return () => {
          alive = false;
          if (timer) clearTimeout(timer);
        };
      }, []);

      /* admin pressed Reset All → our participant row is gone: wipe local state, back to join */
      const resetToJoin = useCallback(() => {
        const sess = sessionRef.current;
        if (sess) { try { localStorage.removeItem(stateKeyFor(sess.code)); } catch (e) {} }
        participantRef.current = null;
        setParticipant(null);
        resumeRef.current = null;
        setResume(null);
        setHvRatings({});
        lastDbStepRef.current = null;
        setScreen('join');
      }, []);

      /* phase watcher: realtime subscribe + 5s poll (poll is the baseline) */
      const handleSessionUpdate = useCallback((s) => {
        if (!s || !s.id) return;
        sessionRef.current = s;
        if (s.phase !== lastPhaseRef.current) {
          lastPhaseRef.current = s.phase;
          setSession(s);
          routeForPhase(s.phase);
        }
      }, [routeForPhase]);

      useEffect(() => {
        if (!session || !session.id) return;
        let unsub = null;
        try { unsub = api.subscribeSession(session.id, handleSessionUpdate); } catch (e) {}
        const iv = setInterval(async () => {
          try {
            const s = await api.getSessionById(session.id);
            if (s) handleSessionUpdate(s);
            const p = participantRef.current;
            if (p && p.id) {
              // null (not an error) = row deleted by admin Reset All
              const row = await api.getParticipantById(p.id);
              if (row === null) resetToJoin();
            }
          } catch (e) {}
        }, 5000);
        return () => {
          if (unsub) { try { unsub(); } catch (e) {} }
          clearInterval(iv);
        };
      }, [session ? session.id : null]);

      /* heartbeat every 20s */
      useEffect(() => {
        if (!participant || !participant.id) return;
        const send = () => {
          const step = lastDbStepRef.current || dbStepFor(screenRef.current) || 'join';
          api.heartbeat(participant.id, step).catch(() => {});
        };
        send();
        const iv = setInterval(send, 20000);
        return () => clearInterval(iv);
      }, [participant ? participant.id : null]);

      /* current_step sync + step_change events on screen change */
      useEffect(() => {
        screenRef.current = screen;
        const p = participantRef.current;
        if (!p) return;
        const step = dbStepFor(screen);
        if (!step || step === lastDbStepRef.current) return;
        const from = lastDbStepRef.current;
        lastDbStepRef.current = step;
        api.heartbeat(p.id, step).catch(() => {});
        const sess = sessionRef.current;
        if (sess && from) {
          api.logEvent({
            session_id: sess.id, participant_id: p.id,
            event_type: 'step_change', payload: { from: from, to: step }
          }).catch(() => {});
        }
      }, [screen]);

      /* join (hold pad completed) */
      const doJoin = useCallback(async () => {
        const sess = sessionRef.current;
        if (!sess || participantRef.current) return;
        try {
          const nickname = genNickname();
          const phase = sess.phase;
          const initialStep = phase === 'demo' ? 'harvester' : phase;
          const p = await api.upsertParticipant({
            session_id: sess.id, device_id: getDeviceId(), nickname: nickname,
            user_agent: navigator.userAgent, current_step: initialStep
          });
          participantRef.current = p;
          setParticipant(p);
          lastDbStepRef.current = initialStep;
          api.logEvent({
            session_id: sess.id, participant_id: p.id,
            event_type: 'join', payload: { nickname: p.nickname, code: sess.code }
          }).catch(() => {});
          saveResume({
            participantId: p.id, nickname: p.nickname, step: 'harvester',
            harvesterDone: false, challengeAccepted: [], surveyDone: false
          });
          if (phase === 'demo') {
            setScreen('welcome');
            setTimeout(() => {
              if (screenRef.current === 'welcome') setScreen('harvester');
            }, 1300);
          } else {
            routeForPhase(phase);
          }
        } catch (e) {
          showToast();
        }
      }, [routeForPhase, saveResume, showToast]);

      /* harvester finished — save 3 answers, flash 1.2s, then insight */
      const handleHarvesterFinish = useCallback((ratings) => {
        setHvRatings(ratings);
        const sess = sessionRef.current;
        const p = participantRef.current;
        if (sess && p) {
          (async () => {
            try {
              const rows = HARVESTER_QUESTIONS.map((q) => ({
                session_id: sess.id, participant_id: p.id,
                question_id: q.id, question_text: q.text,
                rating: ratings[q.id] != null ? ratings[q.id] : 0
              }));
              await api.saveHarvesterAnswers(rows);
              api.logEvent({
                session_id: sess.id, participant_id: p.id,
                event_type: 'harvester_complete', payload: { ratings: ratings }
              }).catch(() => {});
            } catch (e) { showToast(); }
          })();
        }
        saveResume({ harvesterDone: true, step: 'insight', hvRatings: ratings });
        setTimeout(() => {
          const s = sessionRef.current;
          if (s && s.phase !== 'demo') return; // a phase lock took over
          if (screenRef.current === 'harvester') setScreen('insight');
        }, 1200);
      }, [saveResume, showToast]);

      const goChallenge = useCallback(() => {
        saveResume({ step: 'challenge' });
        const s = sessionRef.current;
        if (s && s.phase !== 'demo') return;
        setScreen('challenge');
      }, [saveResume]);

      const handleAccept = useCallback((ch) => {
        const sess = sessionRef.current;
        const p = participantRef.current;
        if (sess && p) {
          api.logEvent({
            session_id: sess.id, participant_id: p.id,
            event_type: 'challenge_accept',
            payload: { challenge_id: ch.id, title: ch.title, points: ch.points }
          }).catch(() => { showToast(); });
        }
        const cur = (resumeRef.current && resumeRef.current.challengeAccepted) || [];
        if (cur.indexOf(ch.id) === -1) {
          saveResume({ challengeAccepted: [...cur, ch.id] });
        }
      }, [saveResume, showToast]);

      const handleSurveySubmit = useCallback(async (ratings, comment) => {
        const sess = sessionRef.current;
        const p = participantRef.current;
        if (!sess || !p) return;
        setSurveyBusy(true);
        const [satisfaction, transformation] = ratings;
        const userComment = (comment || '').trim();
        try {
          await api.saveSurvey({
            session_id: sess.id, participant_id: p.id,
            rating: satisfaction, rating2: transformation, comment: userComment || null
          });
          api.logEvent({
            session_id: sess.id, participant_id: p.id,
            event_type: 'survey_submit', payload: { satisfaction: satisfaction, transformation: transformation, comment: userComment || null }
          }).catch(() => {});
          saveResume({ surveyDone: true, step: 'done' });
          setScreen('done');
        } catch (e) {
          showToast();
        }
        setSurveyBusy(false);
      }, [saveResume, showToast]);

      const accepted = (resume && resume.challengeAccepted) || [];

      return (
        <div className="app-shell">
          <div key={screen} className="screen-fade scr">
            {screen === 'boot' && <BootScreen/>}
            {screen === 'join' && <JoinScreen session={session} onJoin={doJoin}/>}
            {screen === 'welcome' && <WelcomeScreen/>}
            {screen === 'harvester' && <HarvesterScreen onFinish={handleHarvesterFinish}/>}
            {screen === 'insight' && <InsightScreen ratings={hvRatings}/>}
            {screen === 'eyes_up' && <EyesUpScreen/>}
            {screen === 'survey' && <SurveyScreen onSubmit={handleSurveySubmit} busy={surveyBusy}/>}
            {screen === 'done' && <DoneScreen/>}
          </div>
          {toast && <Toast msg={toast}/>}
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
