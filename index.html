<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Joinstick — Learner App Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap');
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; background: #161412; }
    .bp-heading { font-family: 'Poppins', sans-serif; letter-spacing: 0.04em; }
    .bp-slogan { font-family: 'Poppins', sans-serif; letter-spacing: 0.4em; font-weight: 500; }
    ::-webkit-scrollbar { display: none; }
    /* ── Fade in (tab content, general) ── */
    .fade-in { animation: fadeIn 0.35s ease forwards; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    /* ── Slide up (bottom sheets) ── */
    .slide-up { animation: slideUp 0.38s cubic-bezier(0.32,1.15,0.64,1) forwards; }
    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0.4; }
      to   { transform: translateY(0);    opacity: 1; }
    }
    /* ── Scale in (detail screens, cards) ── */
    .scale-in { animation: scaleIn 0.28s cubic-bezier(0.34,1.2,0.64,1) forwards; }
    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.94); }
      to   { opacity: 1; transform: scale(1); }
    }
    /* ── Bounce in (result/success icons) ── */
    .bounce-in { animation: bounceIn 0.45s cubic-bezier(0.34,1.56,0.64,1) forwards; }
    @keyframes bounceIn {
      0%   { opacity: 0; transform: scale(0.4); }
      65%  { opacity: 1; transform: scale(1.12); }
      100% { opacity: 1; transform: scale(1); }
    }
    /* ── Staggered list items ── */
    .stagger { opacity: 0; animation: fadeIn 0.32s ease forwards; }
    /* ── Dot pulse (bell, live indicators) ── */
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.45; transform: scale(0.85); }
    }
    .anim-pulse { animation: pulse 2s cubic-bezier(0.4,0,0.6,1) infinite; }
    /* ── Glow pulse (กำลังทำ badge) ── */
    @keyframes glowAmber {
      0%, 100% { box-shadow: 0 0 0 0 rgba(245,158,11,0); }
      50%       { box-shadow: 0 0 0 4px rgba(245,158,11,0.22); }
    }
    .glow-amber { animation: glowAmber 2.2s ease-in-out infinite; }
    /* ── CTA press ── */
    .btn-press:active { transform: scale(0.97); transition: transform 0.1s; }
    /* ── Video ripple on play ── */
    @keyframes rippleOut {
      0%   { transform: scale(1);   opacity: 0.7; }
      100% { transform: scale(2.6); opacity: 0; }
    }
    .vdo-ripple { animation: rippleOut 0.55s cubic-bezier(0.2,0,0.4,1) forwards; }
    /* ── Audio bar animation (ML player) ── */
    @keyframes barPulse {
      from { transform: scaleY(0.4); }
      to   { transform: scaleY(1); }
    }
    /* ── Shimmer on locked cards ── */
    @keyframes shimmer {
      0%   { background-position: -200% center; }
      100% { background-position:  200% center; }
    }
    /* ── Float (gentle vertical bob) ── */
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-14px); }
    }
    .anim-float { animation: float 6s ease-in-out infinite; }

    /* ── Float (slow, larger drift for blobs) ── */
    @keyframes driftBlob {
      0%   { transform: translate(0, 0)        scale(1); }
      33%  { transform: translate(40px, -20px) scale(1.08); }
      66%  { transform: translate(-30px, 30px) scale(0.95); }
      100% { transform: translate(0, 0)        scale(1); }
    }
    .anim-drift { animation: driftBlob 18s ease-in-out infinite; }
    .anim-drift-rev { animation: driftBlob 22s ease-in-out infinite reverse; }

    /* ── Animated gradient text ── */
    @keyframes textShimmer {
      0%   { background-position: -200% center; }
      100% { background-position: 200%  center; }
    }
    .anim-gradient-text {
      background: linear-gradient(90deg, #ED4724 0%, #FB7C58 25%, #FFB39A 50%, #FB7C58 75%, #ED4724 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
              background-clip: text;
      -webkit-text-fill-color: transparent;
              text-fill-color: transparent;
      animation: textShimmer 4s linear infinite;
    }

    /* ── Sparkle (small twinkle dots) ── */
    @keyframes sparkleTwinkle {
      0%, 100% { opacity: 0;   transform: scale(0)   rotate(0deg);   }
      50%      { opacity: 1;   transform: scale(1.1) rotate(180deg); }
    }
    .anim-sparkle { animation: sparkleTwinkle 3.4s ease-in-out infinite; }

    /* ── Wiggle (for emoji icons on hover) ── */
    @keyframes wiggle {
      0%, 100% { transform: rotate(0deg)   scale(1); }
      20%      { transform: rotate(-10deg) scale(1.1); }
      40%      { transform: rotate(8deg)   scale(1.12); }
      60%      { transform: rotate(-6deg)  scale(1.08); }
      80%      { transform: rotate(4deg)   scale(1.04); }
    }
    .anim-wiggle-hover:hover .anim-wiggle-target { animation: wiggle 0.7s ease-in-out; }

    /* ── Glow ring pulse ── */
    @keyframes glowRing {
      0%   { box-shadow: 0 0 0 0   rgba(237,71,36,0.55); }
      80%  { box-shadow: 0 0 0 30px rgba(237,71,36,0);   }
      100% { box-shadow: 0 0 0 0   rgba(237,71,36,0);   }
    }
    .anim-glow-ring { animation: glowRing 2.4s ease-out infinite; }

    /* ── Transformation Journey animations ── */
    @keyframes tjCurveReveal {
      from { clip-path: inset(0 100% 0 0); }
      to   { clip-path: inset(0 0 0 0); }
    }
    @keyframes tjMarkerPop {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(0); }
      60%  { opacity: 1; transform: translate(-50%, -50%) scale(1.18); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }
    @keyframes tjLabelRise {
      0%   { opacity: 0; transform: translateX(-50%) translateY(8px); }
      100% { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    @keyframes tjChipPop {
      0%   { opacity: 0; transform: translateY(6px) scale(0.92); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes tjPhaseShimmer {
      0%   { transform: translateX(-120%) skewX(-18deg); opacity: 0; }
      40%  { opacity: 1; }
      60%  { opacity: 1; }
      100% { transform: translateX(200%) skewX(-18deg); opacity: 0; }
    }
    @keyframes tjSelectedPulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50%      { transform: translate(-50%, -50%) scale(1.04); }
    }
    .tj-shimmer {
      position: absolute; top: 0; bottom: 0; left: 0;
      width: 30%;
      background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.18) 50%, transparent 100%);
      pointer-events: none;
      animation: tjPhaseShimmer 5s ease-in-out infinite;
    }

    /* ── Marquee horizontal scroll ── */
    @keyframes marquee {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    .anim-marquee { animation: marquee 28s linear infinite; }

    /* ── Animated grid background ── */
    @keyframes gridShift {
      0%   { background-position: 0 0; }
      100% { background-position: 80px 80px; }
    }
    .anim-grid {
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 80px 80px;
      animation: gridShift 30s linear infinite;
    }

    /* ── Tilt phone slow ── */
    @keyframes phoneTilt {
      0%, 100% { transform: translateY(0)   rotate(-1.2deg); }
      50%      { transform: translateY(-10px) rotate(1.2deg);  }
    }
    .anim-phone-tilt { animation: phoneTilt 7s ease-in-out infinite; transform-origin: center center; }

    /* ── Slide in from sides ── */
    @keyframes slideInLeft {
      from { opacity: 0; transform: translateX(-30px); }
      to   { opacity: 1; transform: translateX(0);     }
    }
    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(30px); }
      to   { opacity: 1; transform: translateX(0);    }
    }
    .anim-slide-l { animation: slideInLeft 0.7s cubic-bezier(0.22,1,0.36,1) forwards; }
    .anim-slide-r { animation: slideInRight 0.7s cubic-bezier(0.22,1,0.36,1) forwards; }

    /* ── Phone screen cross-fade ── */
    @keyframes screenFade {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0);   }
    }
    .anim-screen-fade { animation: screenFade 0.55s ease forwards; }

    /* ── Feature card hover lift ── */
    .feature-card { transition: transform 0.35s cubic-bezier(0.22,1,0.36,1), box-shadow 0.35s ease, border-color 0.25s ease, background 0.25s ease; }
    .feature-card:hover { transform: translateY(-6px); }

    /* ── Card colored glow ring on hover ── */
    .feature-card .feature-icon-wrap { transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1), background 0.3s ease, box-shadow 0.4s ease; }
    .feature-card:hover .feature-icon-wrap { transform: rotate(-6deg) scale(1.1); }

    /* ── Underline grow ── */
    @keyframes underlineGrow {
      from { transform: scaleX(0); }
      to   { transform: scaleX(1); }
    }

    /* ── Journey path: dot traveling left → right ── */
    @keyframes journeyDot {
      0%   { offset-distance: 0%;   opacity: 0; }
      8%   { opacity: 1; }
      92%  { opacity: 1; }
      100% { offset-distance: 100%; opacity: 0; }
    }
    .journey-dot {
      offset-rotate: 0deg;
      animation: journeyDot 6s cubic-bezier(0.45,0,0.55,1) infinite;
    }

    /* ── CTA button shimmer sweep ── */
    @keyframes ctaShimmer {
      0%   { transform: translateX(-120%); }
      100% { transform: translateX(220%); }
    }
    .anim-cta-shimmer {
      position: absolute; inset: 0;
      background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,0.32) 50%, transparent 70%);
      transform: translateX(-120%);
      animation: ctaShimmer 3.6s ease-in-out infinite;
      pointer-events: none;
    }

    /* ── CTA arrow nudge (every few seconds) ── */
    @keyframes arrowNudge {
      0%, 60%, 100% { transform: translateX(0); }
      70%, 80%      { transform: translateX(4px); }
    }
    .anim-arrow-nudge { animation: arrowNudge 3.2s ease-in-out infinite; display: inline-block; }

    /* ── Particle field (slow rising dots) ── */
    @keyframes particleRise {
      0%   { transform: translate3d(0, 100vh, 0) scale(0.6); opacity: 0; }
      8%   { opacity: 0.5; }
      92%  { opacity: 0.5; }
      100% { transform: translate3d(0, -10vh, 0) scale(1);   opacity: 0; }
    }
    .journey-particle {
      position: absolute;
      width: 3px; height: 3px;
      border-radius: 50%;
      pointer-events: none;
      animation: particleRise linear infinite;
    }

    /* ── Mini mockup floating bob ── */
    @keyframes mockupBob {
      0%, 100% { transform: translateY(0)    rotate(var(--mockup-tilt, -6deg)); }
      50%      { transform: translateY(-6px) rotate(var(--mockup-tilt, -6deg)); }
    }
    .anim-mockup-bob { animation: mockupBob 5.5s ease-in-out infinite; }

    /* ── Multi-color gradient text for Learning Journey hero ── */
    @keyframes journeyTitleGradient {
      0%   { background-position: 0% center; }
      100% { background-position: 200% center; }
    }
    .journey-title-gradient {
      background: linear-gradient(90deg,
        #F59E0B 0%, #FB7C58 18%, #ED4724 36%,
        #818cf8 60%, #6366f1 78%, #06b6d4 100%,
        #F59E0B 120%);
      background-size: 220% auto;
      -webkit-background-clip: text;
              background-clip: text;
      -webkit-text-fill-color: transparent;
              text-fill-color: transparent;
      animation: journeyTitleGradient 9s linear infinite;
    }

    /* ── Pulsing ring on active phase icon ── */
    @keyframes phaseActivePulse {
      0%   { box-shadow: 0 0 0 0   rgba(99,102,241,0.45); }
      70%  { box-shadow: 0 0 0 18px rgba(99,102,241,0);   }
      100% { box-shadow: 0 0 0 0   rgba(99,102,241,0);   }
    }
    .anim-phase-active { animation: phaseActivePulse 2.4s cubic-bezier(0.4,0,0.6,1) infinite; }

    /* ── Scroll indicator (mouse with bouncing dot) ── */
    @keyframes scrollDot {
      0%   { transform: translateY(0);    opacity: 0; }
      30%  { opacity: 1; }
      80%  { opacity: 0.4; }
      100% { transform: translateY(10px); opacity: 0; }
    }
    .anim-scroll-dot { animation: scrollDot 1.8s ease-out infinite; }

    /* ── Phase card hover lift specifically for journey cards ── */
    .journey-phase-card {
      transition: transform 0.35s cubic-bezier(0.22,1,0.36,1), box-shadow 0.35s ease, border-color 0.25s ease, background 0.25s ease;
    }
    .journey-phase-card:hover { transform: translateY(-8px); }

    /* ── Responsive helpers (utility classes) ─────── */
    /* Tablet (≤1024px) */
    @media (max-width: 1024px) {
      .lp-pills        { display: none !important; }
      .lp-nav          { padding: 0 20px !important; }
      .mr-preview-grid { grid-template-columns: 1fr !important; }
      .hr-2col         { grid-template-columns: 1fr !important; }
      .phase-card-grid          { grid-template-columns: 1fr !important; gap: 18px !important; }
      .journey-path-svg         { display: none !important; }
      .journey-card-stagger     { margin-top: 0 !important; }
      .phase-mockup             { width: 64px !important; height: 50px !important; }
      .journey-transform-label  { display: none !important; }
      .lp-hero         { padding-left: 24px !important; padding-right: 24px !important; gap: 32px !important; }
      .lp-section      { padding-left: 24px !important; padding-right: 24px !important; }
      .journey-nav-btn { top: 16px !important; padding: 8px 14px !important; font-size: 0.78rem !important; }
      .journey-nav-btn.left  { left: 16px !important; }
      .journey-nav-btn.right { right: 16px !important; }
    }

    /* Mobile (≤640px) */
    @media (max-width: 640px) {
      .lp-nav-cta      { padding: 7px 14px !important; font-size: 0.8rem !important; }
      .lp-nav          { height: 56px !important; padding: 0 16px !important; }
      .lp-hero         { padding: 40px 18px 56px !important; gap: 32px !important; }
      .lp-section      { padding: 60px 18px !important; }
      .lp-cta-card     { padding: 40px 24px 36px !important; border-radius: 22px !important; }
      .lp-hero-stats   { gap: 16px !important; }
      .lp-hero-buttons { width: 100% !important; flex-direction: column !important; align-items: stretch !important; }
      .lp-hero-buttons > * { width: 100% !important; }
      .lp-hero-buttons button { width: 100% !important; }
      .phone-scale     { transform: scale(0.86) !important; transform-origin: top center !important; }
      .mr-hero         { padding: 32px 18px !important; }
      .mr-section      { padding-left: 18px !important; padding-right: 18px !important; }
      .journey-nav-btn { top: 12px !important; padding: 6px 12px !important; font-size: 0.72rem !important; }
      .journey-nav-btn.left  { left: 12px !important; }
      .journey-nav-btn.right { right: 12px !important; }
    }

    /* Tiny phone (≤390px) — scale PhoneFrame down */
    @media (max-width: 414px) {
      .phone-frame-wrap   { transform: scale(0.92); transform-origin: center top; }
      .phone-frame-outer  { padding: 0.75rem !important; }
    }
    @media (max-width: 360px) {
      .phone-frame-wrap   { transform: scale(0.84); }
    }

    /* ── Flash Card 3D flip ── */
    .fc-scene { perspective: 1400px; width: 100%; height: 100%; }
    .fc-card {
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.55s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      width: 100%;
      height: 100%;
      will-change: transform;
    }
    .fc-card.is-flipped { transform: rotateY(180deg); }
    .fc-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px;
      overflow: hidden;
    }
    .fc-back { transform: rotateY(180deg); }

    /* ── Flash Card next-card slide transition ── */
    @keyframes fcSlideExit {
      from { transform: translateX(0)     scale(1);    opacity: 1; }
      to   { transform: translateX(-40px) scale(0.94); opacity: 0; }
    }
    @keyframes fcSlideEnter {
      from { transform: translateX(40px)  scale(0.96); opacity: 0; }
      to   { transform: translateX(0)     scale(1);    opacity: 1; }
    }
    .fc-scene.fc-exit  { animation: fcSlideExit  0.28s cubic-bezier(0.4,0,0.2,1) forwards; }
    .fc-scene.fc-enter { animation: fcSlideEnter 0.36s cubic-bezier(0.22,1,0.36,1) forwards; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel" data-presets="react">
    const { useState, useRef, useEffect } = React;

    /* ── SVG Icon primitives ─────────────────────── */
    const Svg = ({ size=24, className='', strokeWidth=2, fill='none', children, style }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size}
        viewBox="0 0 24 24" fill={fill} stroke="currentColor"
        strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round"
        className={className} style={style}>{children}</svg>
    );

    const Home         = p => <Svg {...p}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></Svg>;
    const BookOpen     = p => <Svg {...p}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></Svg>;
    const BarChart2    = p => <Svg {...p}><line x1="18" x2="18" y1="20" y2="10"/><line x1="12" x2="12" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="14"/></Svg>;
    const UserIcon     = p => <Svg {...p}><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></Svg>;
    const PlayCircle   = p => <Svg {...p}><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></Svg>;
    const CheckCircle2 = p => <Svg {...p}><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></Svg>;
    const CheckCircle  = p => <Svg {...p}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></Svg>;
    const XCircle      = p => <Svg {...p}><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></Svg>;
    const ChevronRight = p => <Svg {...p}><path d="m9 18 6-6-6-6"/></Svg>;
    const ChevronLeft  = p => <Svg {...p}><path d="m15 18-6-6 6-6"/></Svg>;
    const ChevronDown  = p => <Svg {...p}><path d="m6 9 6 6 6-6"/></Svg>;
    const Bell         = p => <Svg {...p}><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></Svg>;
    const Info         = p => <Svg {...p}><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></Svg>;
    const Plus         = p => <Svg {...p}><path d="M5 12h14"/><path d="M12 5v14"/></Svg>;
    const Flame        = p => <Svg {...p}><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></Svg>;
    const Trophy       = p => <Svg {...p}><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2z"/></Svg>;
    const Activity     = p => <Svg {...p}><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></Svg>;
    const Award        = p => <Svg {...p}><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/></Svg>;
    const Star         = p => <Svg {...p}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></Svg>;
    const Zap          = p => <Svg {...p}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></Svg>;

                </div>
                <div className="flex gap-2 mb-4">
                  <span style={{background:'rgba(63,63,70,.4)',border:'1px solid rgba(63,63,70,.6)',color:'#a1a1aa',fontSize:'0.7rem',fontWeight:600,padding:'3px 10px',borderRadius:999}}>
                    {sectionLabel}
                  </span>
                  <span style={{background:ts.bg,border:`1px solid ${ts.border}`,color:ts.color,fontSize:'0.7rem',fontWeight:600,padding:'3px 10px',borderRadius:999}}>
                    {ch.type}
                  </span>
                </div>
                <h2 className="text-white text-2xl font-bold leading-snug mb-6">{ch.title}</h2>
                <div className="rounded-2xl p-5 mb-4" style={{background:ts.bg,border:`1px solid ${ts.border}`}}>
                  <div className="text-sm font-semibold mb-1" style={{color:ts.color}}>{ch.type}</div>
                  <p className="text-zinc-300 text-sm leading-relaxed">{activatorDesc[ch.type]}</p>
                </div>
                <div className="rounded-2xl overflow-hidden mb-8" style={{background:'#111113',border:'1px solid rgba(63,63,70,.5)'}}>
                  <div className="text-zinc-400 text-xs font-semibold px-5 pt-4 pb-2 border-b border-zinc-800/60">ข้อมูลเพิ่มเติม</div>
                  <div className="px-5 py-3 flex justify-between items-center border-b border-zinc-800/40">
                    <span className="text-zinc-400 text-sm">สถานะ</span>
                    <div className="flex items-center gap-1.5">
                      <div style={{width:7,height:7,borderRadius:'50%',background:statusDot[ch.status]}}/>
                      <span className="text-zinc-200 text-sm font-medium">{statusLabel[ch.status]}</span>
                    </div>
                  </div>
                  {ch.timeLeft && (
                    <div className="px-5 py-3 flex justify-between items-center border-b border-zinc-800/40">
                      <span className="text-zinc-400 text-sm">เวลาเหลือ</span>
                      <span className="text-sm font-medium" style={{color:'#e4e4e7'}}>{ch.timeLeft}</span>
                    </div>
                  )}
                  {ch.points && (
                    <div className="px-5 py-3 flex justify-between items-center border-b border-zinc-800/40">
                      <span className="text-zinc-400 text-sm">คะแนนที่ได้รับ</span>
                      <span className="text-amber-400 text-sm font-semibold">+{ch.points} EXP</span>
                    </div>
                  )}
                  <div className="px-5 py-3 flex justify-between items-center">
                    <span className="text-zinc-400 text-sm flex items-center gap-1.5">
                      <Clock size={13}/>เวลาใช้ทำ
                    </span>
                    <span className="text-zinc-200 text-sm font-medium">{activatorTime[ch.type]}</span>
                  </div>
                </div>
                <button
                  onClick={() => canStart && startChallenge(ch)}
                  className="w-full font-semibold py-4 rounded-full text-base flex items-center justify-center gap-2 transition-all btn-press"
                  style={{background:canStart?'#ffffff':'#27272a',color:canStart?'#09090b':'#52525b',cursor:canStart?'pointer':'not-allowed',border:'none'}}>
                  เริ่มทำภารกิจ
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 16 16 12 12 8"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
                </button>
              </div>
            </div>
          </PhoneFrame>
        );
      }

      /* ─── Recall Quiz Screen ─────────────────── */
      if (screen === 'recallQuiz') {
        const rq = recallQuizData;
        const done = rcStep >= rq.length;

        if (done) {
          const correct = rq.filter((q,i) => {
            const sel = rcSelections[i] || [];
            return sel.length === q.correct.length && q.correct.every(c => sel.includes(c));
          }).length;
          const rcExp = Math.round((correct/rq.length)*25);
          const rcHeadline = correct===rq.length ? 'ยอดเยี่ยม!' : correct>=rq.length/2 ? 'ดีมาก!' : 'ลองอีกครั้งนะ';
          return (
            <ChallengeResult
              type="Recall Quiz"
              counter={`${rq.length} / ${rq.length}`}
              headline={rcHeadline}
              subline={`ตอบถูก ${correct} จาก ${rq.length} ข้อ`}
              scoreDisplay={`${correct} / ${rq.length}`}
              scoreNote="ข้อที่ตอบถูก"
              exp={rcExp}
              engagement={100}
              onDone={startHarvester}
            />
          );
        }

        const cur = rq[rcStep];
        const isCheckbox = cur.mode === 'checkbox';
        const curSel = rcSelections[rcStep] || [];

        const toggleOption = idx => {
          if (rcRevealed) { setRcInspect(idx); return; }
          const prev = rcSelections[rcStep] || [];
          let next;
          if (isCheckbox) {
            next = prev.includes(idx) ? prev.filter(x => x !== idx) : [...prev, idx];
          } else {
            next = [idx];
          }
          const updated = [...rcSelections];
          updated[rcStep] = next;
          setRcSelections(updated);
        };

        const canNext = curSel.length > 0;

        const handleNext = () => {
          if (!rcRevealed) {
            setRcRevealed(true);
          } else {
            setRcRevealed(false);
            setRcInspect(null);
            setRcStep(s => s + 1);
          }
        };

        // Size per exact char count — wider range for visible variation
        const getDynamicSize = text => {
          const len = text.length;
          if (len <= 6)  return 86;
          if (len === 7) return 96;
          if (len === 8) return 104;  // Coaching
          if (len === 9) return 114;  // Visionary
          if (len === 10) return 124; // Democratic, Commanding
          return 132;                 // Affiliative, Pacesetting (11+)
        };

        // Rows spaced so adjacent bubbles never touch (gap ≥ 20px between edges)
        // Bubble area ≈ 500px tall. Max radius ≈ 60px.
        // Row centres at 13%, 46%, 79% → 65px, 230px, 395px → gaps of 165px > 120px ✓
        // Left col x=25%, right col x=72% → horiz gap 185px > 120px ✓
        const bubblePositions = [
          { x: 25, y: 13 },  // idx0: left  row1
          { x: 72, y:  5 },  // idx1: right row1 (higher stagger)
          { x: 23, y: 46 },  // idx2: left  row2
          { x: 72, y: 40 },  // idx3: right row2
          { x: 25, y: 79 },  // idx4: left  row3
          { x: 71, y: 74 },  // idx5: right row3
        ];

        const getBubbleStyle = idx => {
          const isSelected = curSel.includes(idx);
          const isCorrect  = cur.correct.includes(idx);
          if (rcRevealed) {
            if (isCorrect)  return { bg:'rgba(21,128,61,0.7)',  border:'#22c55e', color:'#bbf7d0', icon:'✓', glow:'0 0 18px rgba(34,197,94,0.35)' };
            if (isSelected) return { bg:'rgba(127,29,29,0.7)',  border:'#ef4444', color:'#fca5a5', icon:'✗', glow:'none' };
            return { bg:'#1a1a1c', border:'rgba(63,63,70,0.4)', color:'#3f3f46', icon:null, glow:'none' };
          }
          if (isSelected) return { bg:'rgba(120,53,15,0.85)', border:'#f59e0b', color:'#fde68a', icon:null, glow:'0 0 20px rgba(245,158,11,0.4)' };
          return { bg:'#1e1e20', border:'rgba(63,63,70,0.6)', color:'#a1a1aa', icon:null, glow:'none' };
        };

        return (
          <PhoneFrame>
            <div style={{flex:1, display:'flex', flexDirection:'column', overflow:'hidden'}}>

              {/* ── Header ── */}
              <div style={{padding:'16px 20px 0', flexShrink:0}}>
                {/* top label */}
                <div style={{fontSize:'0.65rem', color:'#6366f1', fontWeight:600, marginBottom:10, letterSpacing:'0.04em'}}>
                  {cur.label}
                </div>
                {/* back + title + counter row */}
                <div style={{display:'flex', alignItems:'center', gap:12, marginBottom:12}}>
                  <button onClick={goBack} className="btn-press"
                    style={{width:36,height:36,borderRadius:10,background:'#1c1c1e',
                      border:'1px solid rgba(255,255,255,.1)',display:'flex',alignItems:'center',
                      justifyContent:'center',cursor:'pointer',flexShrink:0}}>
                    <ChevronLeft size={17} className="text-zinc-300"/>
                  </button>
                  <span style={{flex:1,color:'#ffffff',fontSize:'1.05rem',fontWeight:700}}>Recall Quiz</span>
                  <span style={{color:'#71717a',fontSize:'0.85rem',fontWeight:600,flexShrink:0}}>
                    {rcStep} / {rq.length}
                  </span>
                </div>
                {/* progress bar */}
                <div style={{height:4,background:'#27272a',borderRadius:99,overflow:'hidden',marginBottom:20}}>
                  <div style={{height:'100%',borderRadius:99,transition:'width 0.4s ease',
                    width:`${(rcStep/rq.length)*100}%`,
                    background:'linear-gradient(to right,#6366f1,#818cf8)'}}/>
                </div>
              </div>

              {/* ── Question ── */}
              <div style={{padding:'0 20px 16px', flexShrink:0}}>
                <p style={{color:'#ffffff', fontSize:'1.0rem', fontWeight:600, lineHeight:1.5, margin:0}}>
                  {cur.question}
                </p>
                <div style={{marginTop:8, display:'flex', alignItems:'center', gap:6}}>
                  <div style={{
                    fontSize:'0.65rem', fontWeight:600, padding:'2px 9px', borderRadius:999,
                    background: isCheckbox ? 'rgba(99,102,241,.15)' : 'rgba(245,158,11,.12)',
                    border: `1px solid ${isCheckbox ? 'rgba(99,102,241,.35)' : 'rgba(245,158,11,.28)'}`,
                    color: isCheckbox ? '#a5b4fc' : '#fde68a',
                  }}>
                    {isCheckbox ? 'เลือกได้หลายข้อ' : 'เลือก 1 ข้อ'}
                  </div>
                </div>
              </div>

              {/* ── Bubble Area ── */}
              <div style={{flex:1, position:'relative', minHeight:0}}>
                {cur.options.map((opt, idx) => {
                  const pos = bubblePositions[idx];
                  const bs = getBubbleStyle(idx);
                  const isSelected = curSel.includes(idx);
                  const base = getDynamicSize(opt);
                  const sz = isSelected && !rcRevealed ? base + 16 : base;
                  const fontSize = sz >= 140 ? '0.85rem' : sz >= 128 ? '0.8rem' : sz >= 116 ? '0.75rem' : '0.72rem';
                  return (
                    <button key={idx}
                      onClick={() => toggleOption(idx)}
                      style={{
                        position:'absolute',
                        left: `${pos.x}%`,
                        top:  `${pos.y}%`,
                        width: sz,
                        height: sz,
                        transform: 'translate(-50%,-50%)',
                        borderRadius: '50%',
                        background: bs.bg,
                        border: `2px solid ${bs.border}`,
                        color: bs.color,
                        cursor: rcRevealed ? 'default' : 'pointer',
                        display: 'flex',
                        alignItems: 'center',
                        justifyContent: 'center',
                        transition: 'all 0.25s cubic-bezier(0.34,1.2,0.64,1)',
                        lineHeight: 1.25,
                        zIndex: isSelected ? 3 : 1,
                        boxShadow: bs.glow,
                        padding: 0,
                      }}>
                      {bs.icon
                        ? <span style={{fontSize:'1.4rem', fontWeight:700}}>{bs.icon}</span>
                        : <span style={{
                            fontSize,
                            fontWeight: 600,
                            textAlign: 'center',
                            padding: '0 10px',
                            letterSpacing: '-0.01em',
                          }}>{opt}</span>
                      }
                    </button>
                  );
                })}
              </div>

              {/* ── Tap hint (after reveal) ── */}
              {rcRevealed && (
                <div style={{margin:'0 20px 8px', padding:'10px 14px', borderRadius:14,
                  background:'rgba(99,102,241,.07)', border:'1px solid rgba(99,102,241,.18)'}}
                  className="fade-in">
                  <div style={{color:'#818cf8', fontSize:'0.72rem', lineHeight:1.5}}>
                    ✦ แตะที่วงกลมแต่ละอันเพื่อดูเฉลย
                  </div>
                </div>
              )}

              {/* ── Bottom CTA ── */}
              <div style={{padding:'8px 20px 32px', flexShrink:0,
                background:'linear-gradient(to top,#09090b 80%,transparent)'}}>
                <button
                  onClick={handleNext}
                  disabled={!canNext}
                  className="btn-press"
                  style={{
                    width:'100%', padding:'16px', borderRadius:16,
                    fontSize:'1rem', fontWeight:700,
                    background: canNext ? (rcRevealed ? '#6366f1' : '#ffffff') : '#27272a',
                    color:      canNext ? (rcRevealed ? '#ffffff' : '#09090b') : '#52525b',
                    border: 'none', cursor: canNext ? 'pointer' : 'not-allowed',
                    transition: 'all 0.2s',
                    boxShadow: canNext && rcRevealed ? '0 8px 24px rgba(99,102,241,0.35)' : 'none',
                  }}>
                  {rcRevealed ? (rcStep < rq.length - 1 ? 'ข้อถัดไป →' : 'ดูผลลัพธ์') : 'ถัดไป'}
                </button>
              </div>
            </div>

            {/* ── Inspect Modal Overlay ── */}
            {rcInspect !== null && rcRevealed && (() => {
              const opt    = cur.options[rcInspect];
              const isCorr = cur.correct.includes(rcInspect);
              const expTxt = cur.explanations[rcInspect];
              return (
                <div className="scale-in" onClick={() => setRcInspect(null)}
                  style={{
                    position:'absolute', inset:0, zIndex:50,
                    background:'rgba(0,0,0,0.65)',
                    backdropFilter:'blur(6px)',
                    display:'flex', alignItems:'center', justifyContent:'center',
                    padding:'24px',
                  }}>
                  <div onClick={e => e.stopPropagation()}
                    style={{
                      width:'100%', borderRadius:24,
                      background:'#1a1a1c',
                      border:'1px solid rgba(255,255,255,0.08)',
                      boxShadow:'0 24px 60px rgba(0,0,0,0.6)',
                      overflow:'hidden',
                    }}>
                    {/* Header bar */}
                    <div style={{display:'flex', alignItems:'center', justifyContent:'space-between',
                      padding:'16px 16px 0'}}>
                      <span/>
                      <button onClick={() => setRcInspect(null)}
                        style={{width:30,height:30,borderRadius:'50%',background:'rgba(255,255,255,.08)',
                          border:'none',cursor:'pointer',display:'flex',alignItems:'center',
                          justifyContent:'center',color:'#a1a1aa',fontSize:'1rem',fontWeight:700}}>
                        ×
                      </button>
                    </div>

                    {/* Choice name */}
                    <div style={{textAlign:'center', padding:'8px 20px 16px'}}>
                      <div style={{
                        color:'#ffffff', fontSize:'1.5rem', fontWeight:800, marginBottom:16,
                      }}>{opt}</div>

                      {/* Correct / Wrong card */}
                      <div style={{
                        borderRadius:14, padding:'12px 14px',
                        background: isCorr ? 'rgba(34,197,94,.1)' : 'rgba(239,68,68,.08)',
                        border: `1px solid ${isCorr ? 'rgba(34,197,94,.3)' : 'rgba(239,68,68,.25)'}`,
                        textAlign:'left', marginBottom:14,
                      }}>
                        <div style={{display:'flex', alignItems:'center', gap:8, marginBottom:6}}>
                          <div style={{
                            width:22, height:22, borderRadius:'50%', flexShrink:0,
                            background: isCorr ? '#16a34a' : '#dc2626',
                            display:'flex', alignItems:'center', justifyContent:'center',
                          }}>
                            <span style={{color:'#fff', fontSize:'0.75rem', fontWeight:800}}>
                              {isCorr ? '✓' : '✗'}
                            </span>
                          </div>
                          <span style={{
                            color: isCorr ? '#4ade80' : '#f87171',
                            fontSize:'0.9rem', fontWeight:700,
                          }}>
                            {isCorr ? 'ถูกต้อง' : 'ไม่ถูกต้อง'}
                          </span>
                        </div>
                        <p style={{color:'#d4d4d8', fontSize:'0.85rem', lineHeight:1.6, margin:0}}>
                          {expTxt}
                        </p>
                      </div>
                    </div>
                  </div>
                </div>
              );
            })()}
          </PhoneFrame>
        );
      }

      /* ─── Detail Screens (no bottom nav) ─────── */
      if (screen === 'quiz') {
        const q   = quizQuestions;
        const done = quizStep >= q.length;
        const score = answers.filter((a,i)=>a===q[i].correct).length;

        if (done) {
          const qExp = Math.round((score/q.length)*30);
          const qHeadline = score===q.length ? 'ยอดเยี่ยม!' : score>=q.length/2 ? 'ดีมาก!' : 'ลองอีกครั้งนะ';
          return (
            <ChallengeResult
              type="Quiz"
              counter={`${q.length} / ${q.length}`}
              headline={qHeadline}
              subline={`ตอบถูก ${score} จาก ${q.length} ข้อ`}
              scoreDisplay={`${score} / ${q.length}`}
              scoreNote="ข้อที่ตอบถูก"
              exp={qExp}
              engagement={100}
              onDone={startHarvester}
            />
          );
        }

        const cur = q[quizStep];
        return (
          <PhoneFrame>
            <div className="flex-1 overflow-y-auto px-6 pt-4 pb-10">
              <div className="scale-in">
                <div className="flex items-center gap-3 mb-6 pt-2">
                  <button onClick={goBack} className="w-10 h-10 bg-[#161618] rounded-full flex items-center justify-center border border-zinc-800/80 cursor-pointer text-zinc-400 btn-press">
                    <ChevronLeft size={18}/>
                  </button>
                  <div className="flex-1">
                    <div className="text-xs text-zinc-500 mb-1">Quiz · ข้อ {quizStep+1}/{q.length}</div>
                    <div className="h-1 bg-zinc-800 rounded-full overflow-hidden">
                      <div className="h-full bg-blue-500 rounded-full transition-all duration-300" style={{width:`${((quizStep+1)/q.length)*100}%`}}/>
                    </div>
                  </div>
                </div>

                <h2 className="text-white text-xl font-semibold mb-6 leading-snug">{cur.question}</h2>

                <div className="space-y-3 mb-6">
                  {cur.options.map((opt,i)=>{
                    let bg='#161618', border='rgba(63,63,70,0.6)', color='#d4d4d8';
                    if (selected!==null) {
                      if (i===cur.correct) { bg='rgba(34,197,94,.12)'; border='rgba(34,197,94,.5)'; color='#86efac'; }
                      else if (i===selected) { bg='rgba(239,68,68,.12)'; border='rgba(239,68,68,.5)'; color='#fca5a5'; }
                    }
                    return (
                      <button key={i} disabled={selected!==null} onClick={()=>{setSelected(i);setShowExp(true);}}
                        style={{background:bg,border:`1px solid ${border}`,color,borderRadius:'1rem',padding:'1rem 1.25rem',textAlign:'left',cursor:selected!==null?'default':'pointer',transition:'all .2s',display:'flex',alignItems:'center',gap:'0.75rem',width:'100%'}}>
                        <div style={{width:28,height:28,borderRadius:'50%',flexShrink:0,background:selected!==null&&i===cur.correct?'rgba(34,197,94,.2)':selected===i&&i!==cur.correct?'rgba(239,68,68,.2)':'rgba(63,63,70,.5)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'0.75rem',fontWeight:600,color}}>
                          {['A','B','C','D'][i]}
                        </div>
                        <span style={{fontSize:'0.9375rem',lineHeight:1.4}}>{opt}</span>
                      </button>
                    );
                  })}
                </div>

                {showExp && (
                  <div className="rounded-2xl p-4 mb-6" style={{background:'rgba(59,130,246,.08)',border:'1px solid rgba(59,130,246,.25)'}}>
                    <div className="text-blue-300 text-xs font-medium mb-1">คำอธิบาย</div>
                    <div className="text-zinc-300 text-sm leading-relaxed">{cur.explanation}</div>
                  </div>
                )}

                {selected!==null && (
                  <button onClick={()=>{setAnswers([...answers,selected]);setSelected(null);setShowExp(false);setQuizStep(quizStep+1);}}
                    className="w-full bg-blue-500 text-white font-semibold py-3.5 rounded-full text-base cursor-pointer border-0">
                    {quizStep<q.length-1?'ข้อถัดไป →':'ดูผลลัพธ์'}
                  </button>
                )}
              </div>
            </div>
          </PhoneFrame>
        );
      }

      /* ─── Harvester Screen ──────────────────────── */
      if (screen === 'harvester') {
        const hd = harvesterData;
        const isEnding = hvStep >= hd.length;
        const q = isEnding ? null : hd[hvStep];
        const accent = '#f97316';
        const accentDark = '#ea580c';

        // Ending screen
        if (isEnding) return (
          <PhoneFrame statusBg="#1a0404">
            <div className="scale-in" style={{flex:1,display:'flex',flexDirection:'column',
              background:'linear-gradient(135deg,#7f1d1d 0%,#450a0a 55%,#1a0404 100%)',
              position:'relative',overflow:'hidden'}}>
              <div style={{position:'absolute',top:-40,right:-40,width:200,height:200,borderRadius:'50%',
                background:'rgba(239,68,68,0.15)',filter:'blur(48px)',pointerEvents:'none'}}/>
              {/* Header */}
              <div style={{padding:'14px 20px 0',display:'flex',alignItems:'center',flexShrink:0}}>
                <button onClick={()=>setHvStep(hd.length-1)} style={{width:36,height:36,borderRadius:'50%',
                  background:'rgba(255,255,255,0.1)',border:'none',cursor:'pointer',
                  display:'flex',alignItems:'center',justifyContent:'center'}}>
                  <ChevronLeft size={18} style={{color:'white'}}/>
                </button>
                <span style={{flex:1}}/>
                <span style={{color:'rgba(255,255,255,0.5)',fontSize:'0.75rem',fontWeight:600}}>{hd.length} / {hd.length}</span>
              </div>
              {/* Progress full */}
              <div style={{margin:'10px 20px 0',height:3,borderRadius:4,background:'rgba(255,255,255,0.15)',flexShrink:0}}>
                <div style={{height:'100%',borderRadius:4,background:accent,width:'100%'}}/>
              </div>
              {/* Content */}
              <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'24px 28px',textAlign:'center'}}>
                <div className="bounce-in" style={{fontSize:'3.5rem',marginBottom:16}}>🎉</div>
                <h2 style={{color:'white',fontSize:'1.7rem',fontWeight:800,lineHeight:1.2,margin:'0 0 12px'}}>ยอดเยี่ยมไปเลย!</h2>
                <p style={{color:'rgba(255,255,255,0.6)',fontSize:'0.95rem',lineHeight:1.6,margin:0}}>
                  เราผ่านสิ่งสำคัญ<br/>การเรียนรู้ด้วยกันสมบูรณ์แล้ว
                </p>
              </div>
              {/* CTA */}
              <div style={{padding:'0 20px 32px',flexShrink:0}}>
                <button onClick={()=>{ setScreen(null); setScreenData(null); setActiveTab('challenges'); }}
                  style={{width:'100%',background:accent,color:'white',fontWeight:700,fontSize:'0.95rem',
                    border:'none',borderRadius:40,padding:'15px 0',cursor:'pointer',
                    display:'flex',alignItems:'center',justifyContent:'center',gap:8}}>
                  ถัดไป
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5">
                    <path d="M9 18l6-6-6-6"/>
                  </svg>
                </button>
              </div>
            </div>
          </PhoneFrame>
        );

        // Helpers
        const curAns = hvAnswers[hvStep];
        const setAns = val => setHvAnswers(a => ({...a, [hvStep]: val}));
        const canNext = q.type==='rating'  ? true
          : q.type==='ranking'  ? hvRankOrder.length >= q.items.length
          : q.type==='essay'    ? (curAns||'').trim().length > 0
          : q.type==='checkbox' ? (curAns||[]).length > 0
          : curAns !== undefined;

        const goNext = () => {
          if (q.type==='ranking' && !curAns) setAns([...hvRankOrder]);
          setHvStep(s => s+1);
        };

        // Ranking: tap to assign rank in order
        const toggleRank = (item) => {
          const idx = hvRankOrder.indexOf(item);
          if (idx >= 0) {
            // Remove this and everything ranked after it
            const next = hvRankOrder.slice(0, idx);
            setHvRankOrder(next); setAns(next);
          } else {
            const next = [...hvRankOrder, item];
            setHvRankOrder(next); setAns(next);
          }
        };

        return (
          <PhoneFrame statusBg="#1a0404">
            <div style={{flex:1,display:'flex',flexDirection:'column',
              background:'linear-gradient(135deg,#7f1d1d 0%,#450a0a 55%,#1a0404 100%)',
              position:'relative',overflow:'hidden'}}>
              <div style={{position:'absolute',top:-40,right:-40,width:180,height:180,borderRadius:'50%',
                background:'rgba(239,68,68,0.12)',filter:'blur(40px)',pointerEvents:'none'}}/>

              {/* Header */}
              <div style={{padding:'14px 20px 0',display:'flex',alignItems:'center',gap:12,flexShrink:0}}>
                <button onClick={()=>hvStep>0?setHvStep(s=>s-1):goBack()}
                  style={{width:36,height:36,borderRadius:'50%',background:'rgba(255,255,255,0.1)',
                    border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>
                  <ChevronLeft size={18} style={{color:'white'}}/>
                </button>
                <span style={{flex:1}}/>
                <span style={{color:'rgba(255,255,255,0.55)',fontSize:'0.75rem',fontWeight:600}}>
                  {hvStep+1} / {hd.length}
                </span>
              </div>

              {/* Progress bar */}
              <div style={{margin:'10px 20px 0',height:3,borderRadius:4,background:'rgba(255,255,255,0.15)',flexShrink:0}}>
                <div style={{height:'100%',borderRadius:4,background:accent,
                  width:`${((hvStep+1)/hd.length)*100}%`,transition:'width 0.4s ease'}}/>
              </div>

              {/* Question */}
              <div style={{padding:'24px 24px 0',flexShrink:0}}>
                <div style={{fontSize:'1.55rem',fontWeight:800,lineHeight:1.3,color:'white'}}>
                  {q.lines.map((line,i) => (
                    <div key={i}>{renderFlashText(line, accent)}</div>
                  ))}
                </div>
              </div>

              {/* Answer area */}
              <div style={{flex:1,overflowY:'auto',padding:'20px 20px 0'}}>

                {/* ── Multiple Choice ── */}
                {q.type==='multiple' && (
                  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
                    {q.options.map((opt,i) => {
                      const sel = curAns === i;
                      return (
                        <button key={i} onClick={()=>setAns(i)} style={{
                          padding:'13px 10px',borderRadius:40,fontWeight:600,fontSize:'0.88rem',
                          background:sel?accentDark:'rgba(255,255,255,0.08)',
                          color:'white',cursor:'pointer',
                          border:`1.5px solid ${sel?accentDark:'rgba(255,255,255,0.18)'}`,
                          transition:'all 0.15s'}}>
                          {opt}
                        </button>
                      );
                    })}
                  </div>
                )}

                {/* ── Checkbox ── */}
                {q.type==='checkbox' && (
                  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
                    {q.options.map((opt,i) => {
                      const sel = (curAns||[]).includes(i);
                      const atMax = (curAns||[]).length >= q.maxSelect;
                      return (
                        <button key={i} onClick={()=>{
                          const prev = curAns||[];
                          if (sel) setAns(prev.filter(x=>x!==i));
                          else if (!atMax) setAns([...prev, i]);
                        }} style={{
                          padding:'13px 10px',borderRadius:14,fontWeight:600,fontSize:'0.88rem',
                          background:sel?accentDark:'rgba(255,255,255,0.08)',
                          color:'white',cursor:'pointer',
                          border:`1.5px solid ${sel?accentDark:'rgba(255,255,255,0.18)'}`,
                          display:'flex',alignItems:'center',gap:8,transition:'all 0.15s',textAlign:'left'}}>
                          <div style={{width:16,height:16,borderRadius:4,flexShrink:0,
                            background:sel?'rgba(255,255,255,0.9)':'rgba(255,255,255,0.15)',
                            display:'flex',alignItems:'center',justifyContent:'center'}}>
                            {sel && <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke={accentDark} strokeWidth="3"><polyline points="20 6 9 17 4 12"/></svg>}
                          </div>
                          {opt}
                        </button>
                      );
                    })}
                  </div>
                )}

                {/* ── Essay ── */}
                {q.type==='essay' && (
                  <div>
                    <p style={{color:'rgba(255,255,255,0.4)',fontSize:'0.75rem',margin:'0 0 10px'}}>
                      โปรดพิมพ์คำตอบในช่องด้านล่าง
                    </p>
                    <textarea value={curAns||''} onChange={e=>setAns(e.target.value)}
                      placeholder={q.placeholder} rows={5}
                      style={{width:'100%',background:'rgba(255,255,255,0.07)',
                        border:'1.5px solid rgba(255,255,255,0.15)',borderRadius:16,
                        padding:'14px',color:'white',fontSize:'0.9rem',resize:'none',
                        outline:'none',fontFamily:'inherit',lineHeight:1.6,boxSizing:'border-box'}}/>
                  </div>
                )}

                {/* ── Rating Scale ── */}
                {q.type==='rating' && (
                  <div style={{display:'flex',flexDirection:'column',gap:20}}>
                    {q.scales.map((scale,si) => {
                      const ratings = curAns || [3,3];
                      const val = ratings[si];
                      return (
                        <div key={si} style={{background:'rgba(255,255,255,0.06)',
                          borderRadius:16,padding:'14px 16px',
                          border:'1px solid rgba(255,255,255,0.1)'}}>
                          <div style={{color:'rgba(255,255,255,0.7)',fontSize:'0.78rem',fontWeight:600,marginBottom:4}}>{scale}</div>
                          <div style={{color:'rgba(255,255,255,0.35)',fontSize:'0.65rem',marginBottom:12}}>
                            โปรดให้คะแนน (0 = น้อยที่สุด, 6 = มากที่สุด)
                          </div>
                          <div style={{display:'flex',gap:6,justifyContent:'space-between'}}>
                            {[0,1,2,3,4,5,6].map(n => {
                              const active = val===n;
                              return (
                                <button key={n} onClick={()=>{
                                  const r=[...(curAns||[3,3])]; r[si]=n; setAns(r);
                                }} style={{
                                  width:36,height:36,borderRadius:'50%',fontWeight:700,fontSize:'0.85rem',
                                  background:active?accentDark:'rgba(255,255,255,0.08)',
                                  color:'white',border:`1.5px solid ${active?accentDark:'rgba(255,255,255,0.15)'}`,
                                  cursor:'pointer',flexShrink:0,transition:'all 0.15s'}}>
                                  {n}
                                </button>
                              );
                            })}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}

                {/* ── Ranking ── */}
                {q.type==='ranking' && (
                  <div>
                    <p style={{color:'rgba(255,255,255,0.38)',fontSize:'0.72rem',margin:'0 0 12px',letterSpacing:'0.01em'}}>
                      กดเลือกตามลำดับความสำคัญ จากมากไปน้อย
                    </p>
                    <div style={{display:'flex',flexDirection:'column',gap:10}}>
                      {q.items.map(item => {
                        const ri = hvRankOrder.indexOf(item);
                        const ranked = ri >= 0;
                        return (
                          <button key={item} onClick={()=>toggleRank(item)} style={{
                            display:'flex',alignItems:'center',gap:14,
                            background:ranked?'rgba(249,115,22,0.1)':'rgba(255,255,255,0.06)',
                            border:`1.5px solid ${ranked?'rgba(249,115,22,0.45)':'rgba(255,255,255,0.1)'}`,
                            borderRadius:16,padding:'14px 16px',cursor:'pointer',textAlign:'left',
                            transition:'all 0.2s',width:'100%'}}>
                            <div style={{width:32,height:32,borderRadius:'50%',flexShrink:0,
                              background:ranked?accentDark:'rgba(255,255,255,0.08)',
                              display:'flex',alignItems:'center',justifyContent:'center',
                              fontWeight:800,fontSize:'0.95rem',color:'white',transition:'all 0.2s'}}>
                              {ranked ? ri+1 : ''}
                            </div>
                            <span style={{flex:1,color:ranked?'white':'rgba(255,255,255,0.65)',
                              fontWeight:ranked?700:500,fontSize:'0.92rem',transition:'all 0.2s'}}>
                              {item}
                            </span>
                            {ranked && (
                              <span style={{color:'rgba(249,115,22,0.5)',fontSize:'0.75rem',fontWeight:700}}>✕</span>
                            )}
                          </button>
                        );
                      })}
                    </div>
                    {hvRankOrder.length > 0 && hvRankOrder.length < q.items.length && (
                      <p style={{color:'rgba(255,255,255,0.25)',fontSize:'0.68rem',textAlign:'center',marginTop:10}}>
                        เลือกอีก {q.items.length - hvRankOrder.length} อัน
                      </p>
                    )}
                  </div>
                )}
              </div>

              {/* Next button */}
              <div style={{padding:'16px 20px 28px',flexShrink:0}}>
                <button onClick={goNext}
                  style={{width:'100%',background:canNext?accent:'rgba(255,255,255,0.1)',
                    color:canNext?'white':'rgba(255,255,255,0.3)',
                    fontWeight:700,fontSize:'0.95rem',border:'none',borderRadius:40,
                    padding:'15px 0',cursor:canNext?'pointer':'not-allowed',
                    display:'flex',alignItems:'center',justifyContent:'center',gap:6,
                    transition:'all 0.2s'}}>
                  ถัดไป
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke={canNext?'white':'rgba(255,255,255,0.3)'} strokeWidth="2.5">
                    <path d="M9 18l6-6-6-6"/>
                  </svg>
                </button>
              </div>
            </div>
          </PhoneFrame>
        );
      }

      if (screen === 'mission') {
        if (submitted) return (
          <ChallengeResult
            type="Mission"
            counter="ส่งแล้ว"
            headline="ยินดีด้วย !"
            subline="คุณส่งภารกิจเสร็จแล้ว"
            scoreDisplay="50 EXP"
            scoreNote="จะได้รับเมื่อ Admin อนุมัติ"
            exp={100}
            engagement={100}
            onDone={startHarvester}
          />
        );

        return (
          <PhoneFrame>
            <div className="flex-1 overflow-y-auto px-6 pt-4 pb-10">
              <div className="fade-in">
                <div className="flex items-center gap-3 mb-6 pt-2">
                  <button onClick={goBack} className="w-10 h-10 bg-[#161618] rounded-full flex items-center justify-center border border-zinc-800/80 cursor-pointer text-zinc-400">
                    <ChevronLeft size={18}/>
                  </button>
                  <span className="text-zinc-400 text-xs">Mission</span>
                </div>

                <div className="rounded-2xl p-5 mb-6" style={{background:'rgba(59,130,246,.08)',border:'1px solid rgba(59,130,246,.2)'}}>
                  <div className="text-blue-300 text-xs font-medium mb-1">+{missionInfo.points} EXP เมื่อผ่าน</div>
                  <h2 className="text-white text-xl font-semibold leading-snug mb-2">{missionInfo.title}</h2>
                  <p className="text-zinc-400 text-sm leading-relaxed">{missionInfo.description}</p>
                </div>

                <div className="mb-6">
                  <div className="text-zinc-300 text-sm font-medium mb-3">ขั้นตอน</div>
                  {missionInfo.steps.map((s,i)=>(
                    <div key={i} className="flex gap-3 items-start mb-3">
                      <div className="w-6 h-6 rounded-full flex items-center justify-center shrink-0 text-[0.7rem] font-semibold text-blue-400" style={{background:'rgba(59,130,246,.15)',border:'1px solid rgba(59,130,246,.3)'}}>
                        {i+1}
                      </div>
                      <p className="text-zinc-300 text-sm leading-relaxed">{s}</p>
                    </div>
                  ))}
                </div>

                <div className="text-zinc-300 text-sm font-medium mb-2">บันทึกผลการสังเกต</div>
                <textarea value={missionText} onChange={e=>setMissionText(e.target.value)}
                  placeholder="เขียนสิ่งที่คุณสังเกตพบ..." rows={5}
                  className="w-full bg-[#161618] border border-zinc-800/80 rounded-2xl p-4 text-zinc-200 text-sm resize-none outline-none mb-4"
                  style={{fontFamily:'inherit',lineHeight:1.6}}/>
                <button onClick={()=>missionText.trim()&&setSubmitted(true)}
                  className="w-full font-semibold py-3.5 rounded-full text-base border-0 transition-all"
                  style={{background:missionText.trim()?'#3b82f6':'#27272a',color:missionText.trim()?'white':'#71717a',cursor:missionText.trim()?'pointer':'not-allowed'}}>
                  ส่งภารกิจ
                </button>
              </div>
            </div>
          </PhoneFrame>
        );
      }

      if (screen === 'courseDetail') {
        const detail = courseDetail[screenData.id];
        if (!detail) return null;
        const done = detail.lessons.filter(l=>l.done).length;
        const pct  = Math.round((done/detail.lessons.length)*100);
        return (
          <PhoneFrame>
            <div className="flex-1 overflow-y-auto px-6 pt-4 pb-10">
              <div className="fade-in">
                <div className="flex items-center gap-3 mb-6 pt-2">
                  <button onClick={goBack} className="w-10 h-10 bg-[#161618] rounded-full flex items-center justify-center border border-zinc-800/80 cursor-pointer text-zinc-400">
                    <ChevronLeft size={18}/>
                  </button>
                </div>

                <div className="rounded-3xl p-6 mb-4 relative overflow-hidden" style={{background:'linear-gradient(135deg,#1e3a5f,#0a0a0c)',border:'1px solid rgba(59,130,246,.2)'}}>
                  <div className="absolute -right-8 -top-8 w-32 h-32 rounded-full" style={{background:'rgba(59,130,246,.12)',filter:'blur(24px)'}}></div>
                  <h2 className="text-white text-xl font-bold mb-2">{detail.title}</h2>
                  <p className="text-zinc-400 text-sm leading-relaxed mb-4">{detail.description}</p>
                  <div className="flex gap-3">
                    <div className="flex items-center gap-1.5 rounded-full px-3 py-1.5" style={{background:'rgba(59,130,246,.15)'}}>
                      <CheckCircle2 size={12} className="text-blue-400"/>
                      <span className="text-blue-300 text-xs font-medium">{done}/{detail.lessons.length} บทเรียน</span>
                    </div>
                    <div className="flex items-center gap-1.5 rounded-full px-3 py-1.5" style={{background:'rgba(245,158,11,.1)'}}>
                      <Zap size={12} className="text-amber-400"/>
                      <span className="text-amber-300 text-xs font-medium">{pct}% เสร็จ</span>
                    </div>
                  </div>
                </div>

                <div className="h-2 bg-zinc-800 rounded-full overflow-hidden mb-6">
                  <div className="h-full rounded-full" style={{background:'linear-gradient(to right,#3b82f6,#60a5fa)',width:`${pct}%`}}/>
                </div>

                <div className="text-zinc-300 text-sm font-medium mb-3">บทเรียนทั้งหมด</div>
                <div className="space-y-2">
                  {detail.lessons.map(lesson=>(
                    <div key={lesson.id} className="flex items-center gap-3.5 rounded-2xl p-3.5"
                      style={{background:lesson.done?'rgba(34,197,94,.06)':'#161618',border:`1px solid ${lesson.done?'rgba(34,197,94,.2)':'rgba(63,63,70,.6)'}`}}>
                      <div className="w-8 h-8 rounded-full flex items-center justify-center shrink-0"
                        style={{background:lesson.done?'rgba(34,197,94,.15)':'rgba(63,63,70,.4)'}}>
                        {lesson.done
                          ? <CheckCircle2 size={15} className="text-green-400"/>
                          : <span className="text-zinc-500 text-xs font-semibold">{lesson.id}</span>}
                      </div>
                      <div className="flex-1">
                        <div className="text-sm" style={{color:lesson.done?'#d4d4d8':'#a1a1aa'}}>{lesson.title}</div>
                        <div className="text-zinc-600 text-xs mt-0.5">{lesson.duration}</div>
                      </div>
                      {!lesson.done && <PlayCircle size={18} className="text-zinc-600"/>}
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </PhoneFrame>
        );
      }

      /* ─── TAB VIEWS ──────────────────────────────
         เหมือน original prototype:
         - content: flex-1 overflow-y-auto px-6 pt-12 pb-28
         - nav: absolute bottom-0
      ─────────────────────────────────────────── */
      const renderHome = () => (
        <div className="space-y-6 animate-in fade-in duration-500 pb-8">

          {/* Top Bar */}
          <div className="flex justify-between items-center pt-2 px-1">
            <button onClick={()=>setNotifOpen(true)} className="w-10 h-10 bg-[#161618] rounded-full flex items-center justify-center border border-zinc-800/80 relative cursor-pointer">
              <Bell className="text-zinc-500" size={18} fill="currentColor"/>
              <div className="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full border border-[#09090b] anim-pulse"></div>
            </button>
          </div>

          {/* Greeting & Gauge */}
          <div className="text-center mt-6 relative">
            <h1 className="text-2xl font-semibold text-zinc-300 mb-1">สวัสดี ผู้เรียน</h1>
            <div className="flex items-center justify-center gap-1.5">
              <span className="text-2xl font-medium text-blue-400">Practitioner</span>
              <Info size={14} className="text-zinc-500"/>
            </div>

            <div className="relative w-full max-w-[340px] mx-auto mt-10 mb-2">
              <div className="flex justify-between px-8 text-[10px] text-zinc-500 mb-[-15px] relative z-10">
                <span className="transform -rotate-12">น้อยเกินไป</span>
                <span className="-mt-4">กำลังดี</span>
                <span className="transform rotate-12">ยอดเยี่ยม</span>
              </div>
              <div className="relative">
                <div className="absolute top-0 left-0 w-1/2 h-full bg-amber-500/20 blur-3xl rounded-full"></div>
                <svg viewBox="0 0 200 100" className="w-full drop-shadow-[0_0_8px_rgba(251,191,36,0.5)] relative z-10" style={{overflow:'visible'}}>
                  <defs>
                    <linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                      <stop offset="0%" stopColor="#fbbf24"/>
                      <stop offset="70%" stopColor="#f59e0b"/>
                      <stop offset="100%" stopColor="#3b82f6" stopOpacity="0"/>
                    </linearGradient>
                    {/* Soft halo around sparkle */}
                    <filter id="glowOuter" x="-200%" y="-200%" width="500%" height="500%">
                      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5"/>
                    </filter>
                    {/* Crisp sparkle core */}
                    <filter id="glowMid" x="-100%" y="-100%" width="300%" height="300%">
                      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="b"/>
                      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
                    </filter>
                  </defs>

                  {/* Motion path — full arc, animation will stop at 50% (กำลังดี / top) */}
                  <path id="gaugeArcMotion" d="M 15 90 A 85 85 0 0 1 185 90" fill="none" stroke="none"/>

                  {/* Track */}
                  <path d="M 15 90 A 85 85 0 0 1 185 90" fill="none" stroke="#27272a" strokeWidth="3" strokeLinecap="round"/>
                  {/* Filled arc */}
                  <path d="M 15 90 A 85 85 0 0 1 129 10.2" fill="none" stroke="url(#gaugeGrad)" strokeWidth="4.5" strokeLinecap="round"/>

                  {/* Milestone dots */}
                  <circle cx="20.2"  cy="61"   r="2" fill="#ef4444"/>
                  <circle cx="45.4"  cy="24.9" r="2" fill="#ef4444"/>
                  <circle cx="85.3"  cy="6.3"  r="2" fill="#f59e0b"/>
                  <circle cx="129"   cy="10.2" r="2" fill="#22c55e"/>
                  <circle cx="165.1" cy="35.4" r="2" fill="#22c55e"/>
                  <circle cx="183.7" cy="75.3" r="2" fill="#3b82f6"/>

                  {/* ── Sparkle: soft outer halo ── */}
                  <circle r="5" fill="#fbbf24" filter="url(#glowOuter)">
                    <animateMotion dur="5.5s" repeatCount="indefinite" calcMode="spline"
                      keyPoints="0;0.50;0.50;0" keyTimes="0;0.62;0.88;1"
                      keySplines="0.42 0 0.58 1;0 0 1 1;0 0 1 1">
                      <mpath href="#gaugeArcMotion"/>
                    </animateMotion>
                    <animate attributeName="opacity"
                      values="0;0;0.55;0.7;0.7;0.3;0"
                      keyTimes="0;0.04;0.22;0.62;0.88;0.94;1"
                      dur="5.5s" repeatCount="indefinite"/>
                  </circle>

                  {/* ── Sparkle: bright crisp core ── */}
                  <circle r="2" fill="#fff8e1" filter="url(#glowMid)">
                    <animateMotion dur="5.5s" repeatCount="indefinite" calcMode="spline"
                      keyPoints="0;0.50;0.50;0" keyTimes="0;0.62;0.88;1"
                      keySplines="0.42 0 0.58 1;0 0 1 1;0 0 1 1">
                      <mpath href="#gaugeArcMotion"/>
                    </animateMotion>
                    <animate attributeName="opacity"
                      values="0;0;0.9;1;1;0.5;0"
                      keyTimes="0;0.04;0.22;0.62;0.88;0.94;1"
                      dur="5.5s" repeatCount="indefinite"/>
                    <animate attributeName="r"
                      values="1.5;2;2.8;2.2;1.5"
                      keyTimes="0;0.62;0.72;0.88;1"
                      dur="5.5s" repeatCount="indefinite"/>
                  </circle>
                </svg>
                <div className="absolute bottom-1 left-0 w-full flex flex-col items-center justify-end z-20">
                  <div className="flex items-center justify-center gap-1.5 mb-1.5">
                    <h2 className="text-[17px] font-medium text-white">ใช้ได้เลยผู้เรียน</h2>
                    <div className="w-4 h-4 rounded-full border border-zinc-600 flex items-center justify-center text-zinc-500 text-[10px]">i</div>
                  </div>
                  <p className="text-zinc-400 text-sm leading-relaxed max-w-[260px] mx-auto px-2 text-center">
                    คุณเริ่มจะลืมแล้ว แต่เป็นเรื่องปกติ<br/>ลองใส่ใจอีกหน่อยจะดูดีเลย
                  </p>
                </div>
              </div>
            </div>
          </div>

          {/* Divider */}
          <div className="h-px w-full bg-gradient-to-r from-transparent via-amber-500/30 to-transparent my-8"></div>

          {/* Suggested Challenges */}

    /* ── Transformation Journey · Timeline + How Joinstick Maps ── */
    function TransformationJourney({ onBack, onNav }) {
      const stages = [
        { num:0, name:'Unaware',        role:'Ignorance',    timeStage:'Before journey',     color:'#71717a',
          phase:'Pre Class',  phaseColor:'#F59E0B',
          dayStart:-1, dayEnd:0,
          tagline:'ยังไม่รู้ตัวว่าตัวเองขาด',
          features:['ก่อนเข้า Course']},
        { num:1, name:'Awareness',      role:'Questioner',   timeStage:'Day 1',              color:'#ef4444',
          phase:'In Class',   phaseColor:'#ED4724',
          dayStart:1,  dayEnd:1,
          tagline:'เริ่มเห็นช่องว่างของตัวเอง',
          features:['Pre-Assessment','Speaker Live','Awareness Activities']},
        { num:2, name:'Acknowledgment', role:'Goal Setter',  timeStage:'Day 2–4',             color:'#f97316',
          phase:'In Class',   phaseColor:'#ED4724',
          dayStart:2,  dayEnd:4, markerDay:3,
          tagline:'รู้ว่าขาดอะไร · วางแผน · พร้อมเริ่ม',
          features:['Goal Setting','Live Quiz','Mission Planning']},
        { num:3, name:'Activation',     role:'Apprentice',   timeStage:'Day 4–14 · 11 วัน',   color:'#fbbf24',
          phase:'Out of Class', phaseColor:'#6366f1',
          dayStart:4,  dayEnd:14, markerDay:14,
          tagline:'เริ่มฝึก · ยังต้อง Quick Win',
          features:['Mission','Flash Card','Recall Quiz','Leaderboard']},
        { num:4, name:'Adoption',       role:'Practitioner', timeStage:'Day 15–45 · 31 วัน',  color:'#22c55e',
          phase:'Out of Class', phaseColor:'#6366f1',
          dayStart:15, dayEnd:45, markerDay:45,
          tagline:'ทำสม่ำเสมอ · สร้าง Routine',
          features:['Mission ต่อเนื่อง','Manager Review','Routine Tracking']},
        { num:5, name:'Automate',       role:'Graduates',    timeStage:'Day 46–90 · 45 วัน',  color:'#3b82f6',
          phase:'Out of Class', phaseColor:'#6366f1',
          dayStart:46, dayEnd:90, markerDay:90,
          tagline:'เป็นนิสัย · เป็นตัวตน',
          features:['Self-driven','HR Dashboard','Transformation Rank']},
      ];

      const phases = [
        { name:'Pre Class',    sub:'ก่อนเริ่ม',  color:'#F59E0B', soft:'rgba(245,158,11,0.12)',  bd:'rgba(245,158,11,0.40)',  fg:'#fcd34d', dayStart:-1, dayEnd:1 },
        { name:'In Class',     sub:'Day 1–3',  color:'#ED4724', soft:'rgba(237,71,36,0.12)',  bd:'rgba(237,71,36,0.40)',  fg:'#fda4a4', dayStart:1,  dayEnd:3 },
        { name:'Out of Class', sub:'Day 4–90', color:'#6366f1', soft:'rgba(99,102,241,0.12)', bd:'rgba(99,102,241,0.40)', fg:'#a5b4fc', dayStart:3,  dayEnd:110 },
      ];
      const phaseInfoColorMap = (name) => phases.find(p => p.name === name) || phases[2];

      const GOLD = '#fbbf24';
      const GOLD_SOFT = 'rgba(251,191,36,0.12)';
      const GOLD_BORDER = 'rgba(251,191,36,0.30)';

      // Map day → x position percentage using a log scale.
      // dayMin = -1 reserves a slim Pre Class strip; dayMax = 110 gives right margin for Day 90.
      const dayMin = -1, dayMax = 110;
      const shift = 5;
      const logMin = Math.log(dayMin + shift);
      const logMax = Math.log(dayMax + shift);
      const dayToX = (day) => {
        const v = Math.log(Math.max(dayMin, Math.min(dayMax, day)) + shift);
        return ((v - logMin) / (logMax - logMin)) * 100;
      };
      // Curve y position — exponential growth curve (flat at start, steep at end)
      const stageToY = (num) => {
        // Lower n keeps near baseline (~90), higher n rises sharply to peak (~10)
        // Using y = 92 - 82 * (n/5)^2.2 for a hockey-stick growth shape
        const t = num / 5;
        return 92 - 82 * Math.pow(t, 2.2);
      };

      const [selectedNum, setSelectedNum] = useState(3);
      const [hoverNum, setHoverNum] = useState(null);
      const selected = stages.find(s => s.num === selectedNum) || stages[0];

      useEffect(() => {
        const onKey = (e) => {
          if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
          if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
            e.preventDefault(); setSelectedNum(n => Math.max(0, n - 1));
          } else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
            e.preventDefault(); setSelectedNum(n => Math.min(5, n + 1));
          } else if (e.key >= '0' && e.key <= '5') {
            e.preventDefault(); setSelectedNum(parseInt(e.key, 10));
          }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      // Compute x position for a stage marker (prefer explicit markerDay, fall back to midpoint)
      const stageX = (s) => dayToX(s.markerDay !== undefined ? s.markerDay : (s.dayStart + s.dayEnd) / 2);

      // Build a smooth growth curve path through the 6 stages
      const curvePoints = stages.map(s => ({
        x: stageX(s),
        y: stageToY(s.num),
      }));
      // Catmull-Rom-ish bezier through the points
      const buildPath = (pts) => {
        if (!pts.length) return '';
        let d = `M ${pts[0].x},${pts[0].y}`;
        for (let i = 0; i < pts.length - 1; i++) {
          const p0 = pts[Math.max(0, i - 1)];
          const p1 = pts[i];
          const p2 = pts[i + 1];
          const p3 = pts[Math.min(pts.length - 1, i + 2)];
          const cp1x = p1.x + (p2.x - p0.x) / 6;
          const cp1y = p1.y + (p2.y - p0.y) / 6;
          const cp2x = p2.x - (p3.x - p1.x) / 6;
          const cp2y = p2.y - (p3.y - p1.y) / 6;
          d += ` C ${cp1x},${cp1y} ${cp2x},${cp2y} ${p2.x},${p2.y}`;
        }
        return d;
      };

                color:nextColor, fontSize:'0.82rem', fontWeight:600,
                cursor:'pointer', fontFamily:font,
                transition:'color 0.15s, background 0.15s, border-color 0.15s',
                boxShadow:`0 4px 20px rgba(0,0,0,0.4), 0 0 0 1px ${nextColor}11`,
              }}
              onMouseEnter={e=>{e.currentTarget.style.background=`${nextColor}18`;e.currentTarget.style.borderColor=`${nextColor}99`;}}
              onMouseLeave={e=>{e.currentTarget.style.background='rgba(24,24,27,0.85)';e.currentTarget.style.borderColor=`${nextColor}55`;}}>
              {nextLabel}
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="9 18 15 12 9 6"/>
              </svg>
            </button>
          )}
        </>
      );
    }

    /* ── App shell ────────────────────────────────── */
    function App() {
      const [scene, setScene] = useState('landing'); // 'landing'|'phases'|'preclass'|'inclass'|'learner'|'hr'|'manager'|'transform'|'journey'

      const goTo = (s) => setScene(s);

      const NEXT = {
        preclass: { scene:'inclass',  label:'In-Class',      color:'#ED4724' },
        inclass:  { scene:'learner',  label:'Out of Class',  color:'#6366f1' },
        learner:  { scene:'hr',       label:'HR Dashboard',  color:'#818cf8' },
      };

      const isPhase = ['preclass','inclass','learner'].includes(scene);

      return (
        <>
          {isPhase && (
            <JourneyNav
              onJourney={() => goTo('phases')}
              onNext={NEXT[scene] ? () => goTo(NEXT[scene].scene) : null}
              nextLabel={NEXT[scene]?.label}
              nextColor={NEXT[scene]?.color}
            />
          )}

          {scene === 'landing' && (
            <LandingPage
              onEnter={() => goTo('phases')}
              onShiftStage={() => goTo('transform')}
              onJourney={() => goTo('journey')}
            />
          )}
          {scene === 'phases'  && (
            <PhaseSelect
              onSelect={(phase) =>
                goTo(phase === 'preclass'  ? 'preclass'  :
                     phase === 'inclass'   ? 'inclass'   :
                     phase === 'hr'        ? 'hr'        :
                     phase === 'manager'   ? 'manager'   :
                     phase === 'transform' ? 'transform' :
                     phase === 'journey'   ? 'journey'   : 'learner')
              }
              onBack={() => goTo('landing')}
              onNav={goTo}
            />
          )}
          {scene === 'preclass'  && <PreClassApp   onBack={() => goTo('phases')} onNext={() => goTo('inclass')} />}
          {scene === 'inclass'   && <InClassApp    onBack={() => goTo('phases')} onNext={() => goTo('learner')} />}
          {scene === 'hr'        && <HRDashboard   onBack={() => goTo('manager')} />}
          {scene === 'manager'   && <ManagerReview onBack={() => goTo('phases')} onNav={goTo} />}
          {scene === 'transform' && <TransformStage onBack={() => goTo('landing')} onNav={goTo} />}
          {scene === 'journey'   && <TransformationJourney onBack={() => goTo('landing')} onNav={goTo} />}
          {scene === 'learner'   && <LearnerApp />}
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
