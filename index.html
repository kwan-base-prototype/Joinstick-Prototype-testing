                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5">
                  <path d="M9 18l6-6-6-6"/>
                </svg>
              </button>
            </div>
          </div>
        );

        const curAns = hvAnswers[hvStep];
        const setAns = val => setHvAnswers(a => ({...a, [hvStep]: val}));
        const canNext = q.type==='rating'  ? true
          : q.type==='ranking'  ? hvRankOrder.length >= q.items.length
          : q.type==='essay'    ? (curAns||'').trim().length > 0
          : q.type==='checkbox' ? (curAns||[]).length > 0
          : curAns !== undefined;

        const goNext = () => {
          if (q.type==='ranking' && !curAns) setAns([...hvRankOrder]);
          setHvStep(s => s+1);
        };

        const toggleRank = (item) => {
          const idx = hvRankOrder.indexOf(item);
          if (idx >= 0) {
            const next = hvRankOrder.slice(0, idx);
            setHvRankOrder(next); setAns(next);
          } else {
            const next = [...hvRankOrder, item];
            setHvRankOrder(next); setAns(next);
          }

        return (
          <div style={{flex:1,display:'flex',flexDirection:'column',
            background:'transparent',
            position:'relative',overflow:'hidden'}}>
            <div style={{position:'absolute',top:-40,right:-40,width:180,height:180,borderRadius:'50%',

            <div style={{padding:'14px 20px 0',display:'flex',alignItems:'center',gap:12,flexShrink:0}}>
              <button onClick={()=>hvStep>0?setHvStep(s=>s-1):setScreen('dashboard')}
                style={{width:36,height:36,borderRadius:'50%',background:'rgba(255,255,255,0.1)',

              <div style={{height:'100%',borderRadius:4,background:accent,
                width:`${((hvStep+1)/hd.length)*100}%`,transition:'width 0.4s ease'}}/>
            </div>

            <div style={{padding:'24px 24px 0',flexShrink:0}}>
              <div style={{fontSize:'1.55rem',fontWeight:800,lineHeight:1.3,color:'white'}}>
                {q.lines.map((line,i) => (
                  <div key={i}>{renderFlashText(line, accent)}</div>
                ))}

            </div>

            <div style={{flex:1,overflowY:'auto',padding:'20px 20px 0'}}>

              {q.type==='multiple' && (
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
                  {q.options.map((opt,i) => {
                    const sel = curAns === i;
                    return (
                      <button key={i} onClick={()=>setAns(i)} style={{
                        padding:'13px 10px',borderRadius:40,fontWeight:600,fontSize:'0.88rem',
                        background:sel?accentDark:'rgba(255,255,255,0.08)',
                        color:'white',cursor:'pointer',
                        border:`1.5px solid ${sel?accentDark:'rgba(255,255,255,0.18)'}`,
                        transition:'all 0.15s'}}>
                        {opt}
                      </button>
                    );
                  })}
                </div>
              )}

              {q.type==='checkbox' && (
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
                  {q.options.map((opt,i) => {
                    const sel = (curAns||[]).includes(i);
                    const atMax = (curAns||[]).length >= q.maxSelect;
                    return (
                      <button key={i} onClick={()=>{
                        const prev = curAns||[];
                        if (sel) setAns(prev.filter(x=>x!==i));
                        else if (!atMax) setAns([...prev, i]);
                      }} style={{
                        padding:'13px 10px',borderRadius:14,fontWeight:600,fontSize:'0.88rem',
                        background:sel?accentDark:'rgba(255,255,255,0.08)',
                        color:'white',cursor:'pointer',
                        border:`1.5px solid ${sel?accentDark:'rgba(255,255,255,0.18)'}`,
                        display:'flex',alignItems:'center',gap:8,transition:'all 0.15s',textAlign:'left'}}>
                        <div style={{width:16,height:16,borderRadius:4,flexShrink:0,
                          background:sel?'rgba(255,255,255,0.9)':'rgba(255,255,255,0.15)',
                          display:'flex',alignItems:'center',justifyContent:'center'}}>
                          {sel && <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke={accentDark} strokeWidth="3"><polyline points="20 6 9 17 4 12"/></svg>}
                        </div>
                        {opt}
                      </button>
                    );
                  })}
                </div>
              )}

              {q.type==='essay' && (
                <div>
                  <p style={{color:'rgba(255,255,255,0.4)',fontSize:'0.75rem',margin:'0 0 10px'}}>
                    โปรดพิมพ์คำตอบในช่องด้านล่าง
                  </p>
                  <textarea value={curAns||''} onChange={e=>setAns(e.target.value)}
                    placeholder={q.placeholder} rows={5}
                    style={{width:'100%',background:'rgba(255,255,255,0.07)',
                      border:'1.5px solid rgba(255,255,255,0.15)',borderRadius:16,
                      padding:'14px',color:'white',fontSize:'0.9rem',resize:'none',
                      outline:'none',fontFamily:'inherit',lineHeight:1.6,boxSizing:'border-box'}}/>
                </div>
              )}

              {q.type==='rating' && (
                <div style={{display:'flex',flexDirection:'column',gap:20}}>
                  {q.scales.map((scale,si) => {
                    const ratings = curAns || [3,3];
                    const val = ratings[si];
                    return (
                      <div key={si} style={{background:'rgba(255,255,255,0.06)',
                        borderRadius:16,padding:'14px 16px',
                        border:'1px solid rgba(255,255,255,0.1)'}}>
                        <div style={{color:'rgba(255,255,255,0.7)',fontSize:'0.78rem',fontWeight:600,marginBottom:4}}>{scale}</div>
                        <div style={{color:'rgba(255,255,255,0.35)',fontSize:'0.65rem',marginBottom:12}}>
                          โปรดให้คะแนน (0 = น้อยที่สุด, 5 = มากที่สุด)
                        </div>
                        <div style={{display:'flex',gap:6,justifyContent:'space-between'}}>
                          {[0,1,2,3,4,5].map(n => {
                            const active = val===n;
                            return (
                              <button key={n} onClick={()=>{
                                const r=[...(curAns||[3,3])]; r[si]=n; setAns(r);
                              }} style={{
                                width:36,height:36,borderRadius:'50%',fontWeight:700,fontSize:'0.85rem',
                                background:active?accentDark:'rgba(255,255,255,0.08)',
                                color:'white',border:`1.5px solid ${active?accentDark:'rgba(255,255,255,0.15)'}`,
                                cursor:'pointer',flexShrink:0,transition:'all 0.15s'}}>
                                {n}
                              </button>
                            );
                          })}
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}

              {q.type==='ranking' && (
                <div>
                  <p style={{color:'rgba(255,255,255,0.38)',fontSize:'0.72rem',margin:'0 0 12px',letterSpacing:'0.01em'}}>
                    กดเลือกตามลำดับความสำคัญ จากมากไปน้อย
                  </p>
                  <div style={{display:'flex',flexDirection:'column',gap:10}}>
                    {q.items.map(item => {
                      const ri = hvRankOrder.indexOf(item);
                      const ranked = ri >= 0;
                      return (
                        <button key={item} onClick={()=>toggleRank(item)} style={{
                          display:'flex',alignItems:'center',gap:14,
                          background:ranked?'rgba(249,115,22,0.1)':'rgba(255,255,255,0.06)',
                          border:`1.5px solid ${ranked?'rgba(249,115,22,0.45)':'rgba(255,255,255,0.1)'}`,
                          borderRadius:16,padding:'14px 16px',cursor:'pointer',textAlign:'left',
                          transition:'all 0.2s',width:'100%'}}>
                          <div style={{width:32,height:32,borderRadius:'50%',flexShrink:0,
                            background:ranked?accentDark:'rgba(255,255,255,0.08)',
                            display:'flex',alignItems:'center',justifyContent:'center',
                            fontWeight:800,fontSize:'0.95rem',color:'white',transition:'all 0.2s'}}>
                            {ranked ? ri+1 : ''}
                          </div>
                          <span style={{flex:1,color:ranked?'white':'rgba(255,255,255,0.65)',
                            fontWeight:ranked?700:500,fontSize:'0.92rem',transition:'all 0.2s'}}>
                            {item}
                          </span>
                          {ranked && (
                            <span style={{color:'rgba(249,115,22,0.5)',fontSize:'0.75rem',fontWeight:700}}>✕</span>
                          )}
                        </button>
                      );
                    })}
                  </div>
                  {hvRankOrder.length > 0 && hvRankOrder.length < q.items.length && (
                    <p style={{color:'rgba(255,255,255,0.25)',fontSize:'0.68rem',textAlign:'center',marginTop:10}}>
                      เลือกอีก {q.items.length - hvRankOrder.length} อัน
                    </p>
                  )}
                </div>
              )}
            </div>

            <div style={{padding:'16px 20px 28px',flexShrink:0}}>
              <button onClick={goNext}
                style={{width:'100%',background:canNext?accent:'rgba(255,255,255,0.1)',
                  color:canNext?'white':'rgba(255,255,255,0.3)',
                  fontWeight:700,fontSize:'0.95rem',border:'none',borderRadius:40,
                  padding:'15px 0',cursor:canNext?'pointer':'not-allowed',
                  display:'flex',alignItems:'center',justifyContent:'center',gap:6,
                  transition:'all 0.2s'}}>
                ถัดไป
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                  stroke={canNext?'white':'rgba(255,255,255,0.3)'} strokeWidth="2.5">
                  <path d="M9 18l6-6-6-6"/>
                </svg>
              </button>
            </div>
          </div>
        );
      };

      const inClassTabs = [
        {id:'home',        label:'หน้าหลัก', Icon:Home  },
        {id:'challenges',  label:'ภารกิจ',   Icon:Target},
        {id:'lessons',     label:'บทเรียน',  Icon:Video },
        {id:'leaderboard', label:'อันดับ',    Icon:Trophy},
      ];

      return (
        <PhoneFrame statusBg={APP_BG}>
          {screen==='checkin'    && renderCheckin()}
          {screen==='dashboard'  && renderDashboard()}
          {screen==='poll'       && renderPoll()}
          {screen==='group'      && renderGroup()}
          {screen==='quiz'       && renderQuiz()}
          {screen==='qna'        && renderQnA()}
          {screen==='harvester'  && renderHarvester()}

          {/* ── Bottom Nav — visible only on dashboard ── */}
          {screen==='dashboard' && (
            <div style={{
              position:'absolute',bottom:0,left:0,right:0,
              background:'rgba(24,24,27,0.95)',backdropFilter:'blur(12px)',
              borderTop:'1px solid #27272a',
              paddingTop:8,paddingBottom:24,paddingLeft:8,paddingRight:8,zIndex:50,
            }}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 0'}}>
                {inClassTabs.map(({id,label,Icon:I})=>{
                  const active = id==='home';
                  return (
                    <button key={id}
                      style={{flex:1,display:'flex',flexDirection:'column',
                        alignItems:'center',justifyContent:'center',gap:2,
                        background:'transparent',border:'none',cursor:'pointer',padding:0}}>
                      <I size={20} strokeWidth={active?2.5:2} style={{color:active?'#fff':'#52525b'}}/>
                      <span style={{fontSize:'0.6rem',fontWeight:500,color:active?'#fff':'#52525b'}}>{label}</span>
                      <div style={{height:4,width:4,borderRadius:'50%',marginTop:2,
                        background:active?'#3b82f6':'transparent'}}/>
                    </button>
                  );
                })}
              </div>
            </div>
          )}
        </PhoneFrame>
      );
    }

    /* ── HRDashboard (Soft Bento Modern · 30 Learners · 2-tab + Drawer) ─── */
    function HRDashboard({ onBack }) {
      const [tab, setTab]                     = useState('overview');
      const [statusFilter, setStatusFilter]   = useState('all');   // 'all' | 'onTrack' | 'atRisk' | 'behind'
      const [stageFilter, setStageFilter]     = useState(null);    // null | 0..5
      const [selectedLearner, setSelectedLearner] = useState(null);
      const [drawerOpen, setDrawerOpen]       = useState(false);
      const [openEvidence, setOpenEvidence]   = useState(null);    // mission id whose evidence is expanded
      const [sortBy, setSortBy]               = useState('transformation');
      const [sortDir, setSortDir]             = useState('desc');   // 'asc' | 'desc'
      const [pendingAction, setPendingAction] = useState(null);    // { id, type } | null
      const [showGrowthChart, setShowGrowthChart] = useState(false); // Transformation Movement growth graph
      const [nudgeDialog, setNudgeDialog]     = useState(null);    // { name, role } | null — nudge-sent confirmation
      const [messageDialog, setMessageDialog] = useState(null);    // { id, name, role } | null — compose message
      const [exportToast, setExportToast]     = useState(null);    // { label } | null — mockup export feedback
      const [investCell, setInvestCell]       = useState('2-2');   // Insight tab — selected 9-box persona cell (`${tb}-${eb}`)
      const [dotInfo, setDotInfo]             = useState(null);    // Insight tab — learner whose 9-box dot popover is open
      const [actionExpand, setActionExpand]   = useState(null);    // Insight tab — Recommended Action Plan: expanded grade row
      const [execOpen, setExecOpen]           = useState(true);    // Insight tab — Executive Summary collapse toggle

      const handleExport = () => {
        const label = tab === 'individual' ? 'ไฟล์ CSV (Individual)' : tab === 'insight' ? 'รายงาน Insight Summary (PDF)' : 'รายงาน PDF (Overview)';
        setExportToast({ label });
        setTimeout(() => setExportToast(null), 2600);
      };

      const handleSort = (key) => {
        if (sortBy === key) setSortDir(d => d === 'asc' ? 'desc' : 'asc');
        else { setSortBy(key); setSortDir(key === 'learner' ? 'asc' : 'desc'); }
      };

      const isActionPending = (type, id) => pendingAction && pendingAction.id === id && pendingAction.type === type;
      const isLearnerBusy   = (id) => pendingAction && pendingAction.id === id;
      const handleLearnerAction = (l, type) => {
        setPendingAction({ id: l.id, type });
        setTimeout(() => {
          setPendingAction(null);
          if (type === 'nudge') setNudgeDialog({ name: l.name, role: l.role });
        }, 1000);
      };

      // ── Class metadata ──
      const CLASS = {
        name: 'Essential Leadership',
        tagline: 'Lead with your heart',
        onsite: '1–2 May 2026',
        totalLearners: 30,
        totalDays: 90,
      };
      const dayCurrent  = 25;
      const dayProgress = Math.round((dayCurrent / CLASS.totalDays) * 100);

      // ── Stage metadata ──
      const STAGE_META = [
        {num:0, name:'Unaware',        role:'Ignorance',    color:'#a8a29e', targetDays:1},
        {num:1, name:'Awareness',      role:'Questioner',   color:'#ef4444', targetDays:1},
        {num:2, name:'Acknowledgment', role:'Goal Setter',  color:'#f97316', targetDays:3},
        {num:3, name:'Activation',     role:'Apprentice',   color:'#fbbf24', targetDays:11},
        {num:4, name:'Adoption',       role:'Practitioner', color:'#059669', targetDays:30},

      // ─────────────────────────────────────────────────────────────
      // SECTION 2: Transformation Movement (2-bar Pre vs Now)
      // ─────────────────────────────────────────────────────────────
      const renderTransformationMovement = () => {
        const maxCount = Math.max(...stageCounts, ...prevStageCounts, 1);
        return (
          <div className="hr-card" style={{marginBottom:16}}>
            <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:6, flexWrap:'wrap', gap:12}}>
              <div>
                <div className="hr-eyebrow" style={{marginBottom:4}}>Visible Learning Evidence</div>
                <div style={{display:'flex', alignItems:'center', gap:10}}>
                  <Activity size={18} style={{color:'#059669'}}/>
                  <h3 style={{margin:0, fontFamily:'Poppins,sans-serif', fontWeight:600, fontSize:'1.15rem', color:'#1c1917', letterSpacing:'-0.015em'}}>
                    Transformation Movement
                  </h3>
                </div>
                <div style={{color:'#78716c', fontSize:'0.82rem', marginTop:6}}>

                </div>

                  <span style={{width:14, height:6, background:'#059669', borderRadius:2}}/>Now
                </span>

                  onClick={() => setShowGrowthChart(v => !v)}
                  style={{
                    display:'inline-flex', alignItems:'center', gap:6, cursor:'pointer',

                    border:`1px solid ${showGrowthChart ? 'rgba(5,150,105,0.35)' : '#e7e5e4'}`,

                    color: showGrowthChart ? '#047857' : '#57534e', transition:'all 0.15s',

                  <Activity size={13}/>
                  {showGrowthChart ? 'ซ่อนกราฟ' : 'ดูกราฟการเติบโต'}

                </button>
              </div>
            </div>

            {/* Growth chart panel */}
            {showGrowthChart && (() => {
              const W = 720, H = 200, padL = 8, padR = 8, padT = 14, padB = 26;
              const series = [
                { d:'Pre',  goal:0,  moved:0  },
                { d:'D4',   goal:1,  moved:3  },
                { d:'D8',   goal:4,  moved:8  },
                { d:'D12',  goal:8,  moved:14 },
                { d:'D16',  goal:13, moved:18 },
                { d:'D20',  goal:17, moved:22 },
                { d:'D25',  goal:20, moved:24 },
              ];
              const maxY = totalLearners; // 30
              const innerW = W - padL - padR, innerH = H - padT - padB;
              const xAt = i => padL + (i / (series.length - 1)) * innerW;
              const yAt = v => padT + innerH - (v / maxY) * innerH;
              const linePath = key => series.map((p,i) => `${i===0?'M':'L'}${xAt(i).toFixed(1)} ${yAt(p[key]).toFixed(1)}`).join(' ');
              const areaPath = key => `${linePath(key)} L${xAt(series.length-1).toFixed(1)} ${yAt(0).toFixed(1)} L${xAt(0).toFixed(1)} ${yAt(0).toFixed(1)} Z`;

                    <span style={{width:9, height:9, borderRadius:3, background:color}}/>

                  </div>
                  <div style={{display:'flex', alignItems:'baseline', gap:6, marginTop:4}}>

                return (
                  <div
                    key={s.num}
                    onClick={() => { setStageFilter(s.num); setStatusFilter('all'); setTab('individual'); }}
                    style={{
                      cursor:'pointer', borderRadius:14, padding:'14px 16px',
                      background: isGoalStage ? 'rgba(5,150,105,0.04)' : '#ffffff',
                      border:`1px solid ${isGoalStage ? 'rgba(5,150,105,0.18)' : '#f0eeec'}`,
                      boxShadow:'0 1px 2px rgba(28,25,23,0.04)',
                      transition:'box-shadow 0.15s, border-color 0.15s, transform 0.15s',

                    onMouseEnter={e=>{e.currentTarget.style.boxShadow='0 4px 14px rgba(28,25,23,0.08)'; e.currentTarget.style.borderColor=isGoalStage?'rgba(5,150,105,0.35)':'#e0ddda'; e.currentTarget.style.transform='translateY(-1px)';}}
                    onMouseLeave={e=>{e.currentTarget.style.boxShadow='0 1px 2px rgba(28,25,23,0.04)'; e.currentTarget.style.borderColor=isGoalStage?'rgba(5,150,105,0.18)':'#f0eeec'; e.currentTarget.style.transform='translateY(0)';}}>
                    <div style={{display:'flex', alignItems:'center', gap:14}}>
                      {/* Stage label */}
                      <div style={{flex:'0 0 160px', display:'flex', alignItems:'center', gap:10}}>
                        <span className="num" style={{
                          width:26, height:26, borderRadius:8, flexShrink:0,
                          background: isGoalStage ? 'rgba(5,150,105,0.10)' : '#f5f5f4',
                          color: accent, fontSize:'0.78rem', fontWeight:600,
                          display:'inline-flex', alignItems:'center', justifyContent:'center',
                        }}>{s.num}</span>
                        <div style={{minWidth:0}}>
                          <div style={{color:'#1c1917', fontSize:'0.85rem', fontWeight:500, letterSpacing:'-0.005em'}}>{s.name}</div>
                          <div style={{color:'#a8a29e', fontSize:'0.66rem'}}>{s.role}</div>
                        </div>
                      </div>

                      {/* Bars container */}
                      <div style={{flex:1, display:'flex', flexDirection:'column', gap:6, minWidth:0}}>
                        {/* Pre-Class bar */}
                        <div style={{display:'flex', alignItems:'center', gap:10}}>
                          <span style={{flex:'0 0 56px', color:'#a8a29e', fontSize:'0.62rem', fontWeight:500, letterSpacing:'0.08em', textTransform:'uppercase'}}>Pre</span>
                          <div style={{flex:1, height:8, background:'#fafaf9', borderRadius:4, overflow:'hidden'}}>
                            <div style={{
                              width: prev ? `${Math.max(prevBarW, 1.5)}%` : '0%', height:'100%',
                              background:'#d6d3d1', borderRadius:4, transition:'width 0.7s ease',
                            }}/>
                          </div>
                          <span className="num" style={{flex:'0 0 64px', color:'#78716c', fontSize:'0.76rem', fontWeight:500, textAlign:'right'}}>
                            {prev} <span style={{color:'#a8a29e', fontWeight:400}}>· {prevPct}%</span>
                          </span>
                        </div>
                        {/* Now bar */}
                        <div style={{display:'flex', alignItems:'center', gap:10}}>
                          <span style={{flex:'0 0 56px', color: accent, fontSize:'0.62rem', fontWeight:600, letterSpacing:'0.08em', textTransform:'uppercase'}}>Now</span>
                          <div style={{flex:1, height:10, background:'#fafaf9', borderRadius:5, overflow:'hidden', position:'relative'}}>
                            <div style={{
                              width: now ? `${Math.max(nowBarW, 1.5)}%` : '0%', height:'100%',
                              background: isGoalStage
                                ? 'linear-gradient(to right, #059669, #10b981)'
                                : 'linear-gradient(to right, #44403c, #1c1917)',
                              borderRadius:5, transition:'width 0.8s ease',
                              boxShadow: isGoalStage ? '0 0 12px rgba(5,150,105,0.30)' : 'none',
                            }}/>
                          </div>
                          <span className="num" style={{flex:'0 0 64px', color:'#1c1917', fontSize:'0.82rem', fontWeight:600, textAlign:'right'}}>
                            {now} <span style={{color:'#a8a29e', fontWeight:400}}>· {nowPct}%</span>
                          </span>
                        </div>
                      </div>

                      {/* Delta */}
                      <div style={{flex:'0 0 96px', textAlign:'right'}}>
                        {delta > 0 ? (
                          <span className="num" style={{
                            display:'inline-flex', alignItems:'center', gap:4,
                            padding:'4px 10px', borderRadius:999,
                            background:'rgba(5,150,105,0.10)', color:'#047857',

                        ) : (
                          <span style={{color:'#d6d3d1', fontSize:'0.95rem'}}>—</span>

                    </div>

                <span className="num" style={{color:'#1c1917', fontWeight:600}}>

            </div>
          </div>
        );
      };

      // ─────────────────────────────────────────────────────────────
      // SECTION 3: Completion Rate ตามประเภทภารกิจ
      // ─────────────────────────────────────────────────────────────
      const renderCompletionRate = () => (
        <div className="hr-card">
          <div className="hr-eyebrow" style={{marginBottom:4}}>Visible Evidence</div>
          <div style={{display:'flex', alignItems:'center', gap:10, marginBottom:4}}>
            <CheckCircle2 size={18} style={{color:'#059669'}}/>
            <h3 style={{margin:0, fontFamily:'Poppins,sans-serif', fontWeight:600, fontSize:'1.05rem', color:'#1c1917', letterSpacing:'-0.015em'}}>

            </h3>
          </div>
          <div style={{color:'#78716c', fontSize:'0.78rem', marginBottom:18}}>

          </div>
          {CHDATA.map(({type, Icon, pct, done, total, color}) => (
            <div key={type} style={{marginBottom:14}}>
              <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:6}}>

      // ─────────────────────────────────────────────────────────────

                      <div style={{color:'#a8a29e',fontSize:'0.78rem',fontWeight:700,letterSpacing:'0.04em',marginBottom:12}}>
                        สัญญาณที่สังเกตได้
                      </div>

                      <div className="ts-signal-grid" style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
                        {(selected.signals || [...selected.behavior, ...selected.proficiency]).map(item => (
                          <div key={item.title} style={{
                            background:'rgba(0,0,0,0.28)',
                            border:`1px solid ${selected.color}33`,
                            borderRadius:12,padding:'13px 15px',position:'relative',
                          }}>
                            <div style={{display:'flex',alignItems:'flex-start',gap:9}}>
                              <span style={{
                                width:7,height:7,borderRadius:'50%',background:selected.color,
                                boxShadow:`0 0 8px ${selected.color}`,flexShrink:0,marginTop:6,
                              }}/>
                              <div style={{minWidth:0}}>
                                <div style={{color:'#fff',fontSize:'0.86rem',fontWeight:700,letterSpacing:'-0.01em',marginBottom:3,lineHeight:1.3}}>{item.title}</div>
                                <div style={{color:'#a8a29e',fontSize:'0.76rem',lineHeight:1.5}}>{item.desc}</div>
                              </div>
                            </div>

                  {/* Prev/Next navigation */}
                  <div style={{
                    marginTop:14,paddingTop:12,
                    borderTop:'1px solid rgba(255,255,255,0.06)',
                    display:'flex',alignItems:'center',justifyContent:'space-between',gap:8,
                  }}>
                    <button onClick={() => setSelectedNum(Math.max(0, selectedNum - 1))}
                      disabled={selectedNum === 0}
                      style={{
                        display:'inline-flex',alignItems:'center',gap:6,
                        background: selectedNum === 0 ? 'rgba(255,255,255,0.03)' : 'rgba(255,255,255,0.06)',
                        border:'1px solid rgba(255,255,255,0.10)',
                        borderRadius:9,padding:'8px 14px',
                        color: selectedNum === 0 ? '#52525b' : '#d4d4d8',
                        fontSize:'0.8rem',fontWeight:600,
                        cursor: selectedNum === 0 ? 'not-allowed' : 'pointer',
                        opacity: selectedNum === 0 ? 0.5 : 1,
                        transition:'all 0.18s',
                      }}>
                      <span>←</span>
                      {selectedNum > 0 ? (
                        <span>Stage {selectedNum - 1} · {stages[selectedNum - 1].name}</span>
                      ) : 'ก่อนหน้า'}
                    </button>
                    <div style={{
                      display:'flex',alignItems:'center',gap:8,
                      color:'#71717a',fontSize:'0.72rem',fontWeight:600,
                    }}>
                      <span style={{color:selected.color,fontWeight:800}}>{selectedNum + 1}</span>
                      <span>/</span>
                      <span>6</span>
                    </div>
                    <button onClick={() => setSelectedNum(Math.min(5, selectedNum + 1))}
                      disabled={selectedNum === 5}
                      style={{
                        display:'inline-flex',alignItems:'center',gap:6,
                        background: selectedNum === 5 ? 'rgba(255,255,255,0.03)' : `${selected.color}26`,
                        border: selectedNum === 5 ? '1px solid rgba(255,255,255,0.10)' : `1px solid ${selected.color}66`,
                        borderRadius:9,padding:'8px 14px',
                        color: selectedNum === 5 ? '#52525b' : selected.color,
                        fontSize:'0.8rem',fontWeight:700,
                        cursor: selectedNum === 5 ? 'not-allowed' : 'pointer',
                        opacity: selectedNum === 5 ? 0.5 : 1,
                        transition:'all 0.18s',
                        boxShadow: selectedNum === 5 ? 'none' : `0 0 12px ${selected.color}33`,
                      }}>
                      {selectedNum < 5 ? (
                        <span>Stage {selectedNum + 1} · {stages[selectedNum + 1].name}</span>
                      ) : 'จบ Journey'}
                      <span>→</span>
                    </button>
                  </div>
              </main>
            </section>


          </div>

          {/* Footer */}
          <footer style={{
            position:'relative',zIndex:1,
            padding:'14px max(24px,calc((100vw - 1280px)/2))',
            borderTop:'1px solid rgba(255,255,255,0.05)',
            display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:8,
          }}>
            <span style={{color:'#3f3f46',fontSize:'0.74rem'}}>Joinstick · Transformation Stage Framework</span>
            <span style={{color:'#3f3f46',fontSize:'0.74rem'}}>คลิก stage ที่ sidebar หรือกด ← → · 0–5 เพื่อสำรวจ</span>
          </footer>
        </div>
      );
    }

    /* ── Transformation Journey · Timeline + How Joinstick Maps ── */
    function TransformationJourney({ onBack, onNav }) {
      const stages = [
        { num:0, name:'Unaware',        role:'Ignorance',    timeStage:'Before journey',     color:'#71717a',
          phase:'Pre Class',  phaseColor:'#F59E0B',
          dayStart:-1, dayEnd:0,
          tagline:'ยังไม่รู้ตัวว่าตัวเองขาด',
          features:['Pre-Assessment']},
        { num:1, name:'Awareness',      role:'Questioner',   timeStage:'Day 1',              color:'#ef4444',
          phase:'In Class',   phaseColor:'#ED4724',
          dayStart:1,  dayEnd:1,
          tagline:'เริ่มเห็นช่องว่างของตัวเอง',
          features:['Speaker Live','Awareness Activities']},
        { num:2, name:'Acknowledgment', role:'Goal Setter',  timeStage:'Day 2–4',             color:'#f97316',
          phase:'In Class',   phaseColor:'#ED4724',
          dayStart:2,  dayEnd:4, markerDay:3,
          tagline:'รู้ว่าขาดอะไร · วางแผน · พร้อมเริ่ม',
          features:['Goal Setting','Live Quiz','Mission Planning']},
        { num:3, name:'Activation',     role:'Apprentice',   timeStage:'Day 4–14 · 11 วัน',   color:'#fbbf24',
          phase:'Out of Class', phaseColor:'#6366f1',
          dayStart:4,  dayEnd:14, markerDay:14,
          tagline:'เริ่มฝึก · ยังต้อง Quick Win',
          features:['Mission','Flash Card','Recall Quiz','Leaderboard']},
        { num:4, name:'Adoption',       role:'Practitioner', timeStage:'Day 15–45 · 31 วัน',  color:'#22c55e',
          phase:'Out of Class', phaseColor:'#6366f1',
          dayStart:15, dayEnd:45, markerDay:45,
          tagline:'ทำสม่ำเสมอ · สร้าง Routine',
          features:['Mission ต่อเนื่อง','Manager Review','Routine Tracking']},
        { num:5, name:'Automate',       role:'Graduates',    timeStage:'Day 46–90 · 45 วัน',  color:'#3b82f6',
          phase:'Out of Class', phaseColor:'#6366f1',
          dayStart:46, dayEnd:90, markerDay:90,
          tagline:'เป็นนิสัย · เป็นตัวตน',
          features:['Self-driven','HR Dashboard','Transformation Rank']},
      ];

      const phases = [
        { name:'Pre Class',    sub:'ก่อนเริ่ม',  color:'#F59E0B', soft:'rgba(245,158,11,0.12)',  bd:'rgba(245,158,11,0.40)',  fg:'#fcd34d', dayStart:-1, dayEnd:1 },
        { name:'In Class',     sub:'Day 1–3',  color:'#ED4724', soft:'rgba(237,71,36,0.12)',  bd:'rgba(237,71,36,0.40)',  fg:'#fda4a4', dayStart:1,  dayEnd:3 },
        { name:'Out of Class', sub:'Day 4–90', color:'#6366f1', soft:'rgba(99,102,241,0.12)', bd:'rgba(99,102,241,0.40)', fg:'#a5b4fc', dayStart:3,  dayEnd:110 },
      ];
      const phaseInfoColorMap = (name) => phases.find(p => p.name === name) || phases[2];

      const GOLD = '#fbbf24';
      const GOLD_SOFT = 'rgba(251,191,36,0.12)';
      const GOLD_BORDER = 'rgba(251,191,36,0.30)';

      // Map day → x position percentage using a log scale.
      // dayMin = -1 reserves a slim Pre Class strip; dayMax = 110 gives right margin for Day 90.
      const dayMin = -1, dayMax = 110;
      const shift = 5;
      const logMin = Math.log(dayMin + shift);
      const logMax = Math.log(dayMax + shift);
      const dayToX = (day) => {
        const v = Math.log(Math.max(dayMin, Math.min(dayMax, day)) + shift);
        return ((v - logMin) / (logMax - logMin)) * 100;
      };
      // Curve y position — exponential growth curve (flat at start, steep at end)
      const stageToY = (num) => {
        // Lower n keeps near baseline (~90), higher n rises sharply to peak (~10)
        // Using y = 92 - 82 * (n/5)^2.2 for a hockey-stick growth shape
        const t = num / 5;
        return 92 - 82 * Math.pow(t, 2.2);
      };

      const [selectedNum, setSelectedNum] = useState(3);
      const [hoverNum, setHoverNum] = useState(null);
      const selected = stages.find(s => s.num === selectedNum) || stages[0];

      useEffect(() => {
        const onKey = (e) => {
          if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
          if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
            e.preventDefault(); setSelectedNum(n => Math.max(0, n - 1));
          } else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
            e.preventDefault(); setSelectedNum(n => Math.min(5, n + 1));
          } else if (e.key >= '0' && e.key <= '5') {
            e.preventDefault(); setSelectedNum(parseInt(e.key, 10));
          }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      // Compute x position for a stage marker (prefer explicit markerDay, fall back to midpoint)
      const stageX = (s) => dayToX(s.markerDay !== undefined ? s.markerDay : (s.dayStart + s.dayEnd) / 2);

      // Build a smooth growth curve path through the 6 stages
      const curvePoints = stages.map(s => ({
        x: stageX(s),
        y: stageToY(s.num),
      }));
      // Catmull-Rom-ish bezier through the points
      const buildPath = (pts) => {
        if (!pts.length) return '';
        let d = `M ${pts[0].x},${pts[0].y}`;
        for (let i = 0; i < pts.length - 1; i++) {
          const p0 = pts[Math.max(0, i - 1)];
          const p1 = pts[i];
          const p2 = pts[i + 1];
          const p3 = pts[Math.min(pts.length - 1, i + 2)];
          const cp1x = p1.x + (p2.x - p0.x) / 6;
          const cp1y = p1.y + (p2.y - p0.y) / 6;
          const cp2x = p2.x - (p3.x - p1.x) / 6;
          const cp2y = p2.y - (p3.y - p1.y) / 6;
          d += ` C ${cp1x},${cp1y} ${cp2x},${cp2y} ${p2.x},${p2.y}`;
        }
        return d;
      };
      const curvePath = buildPath(curvePoints);
      const fillPath = curvePath + ` L ${curvePoints[curvePoints.length-1].x},100 L ${curvePoints[0].x},100 Z`;

      // Day axis markers — natural log-scale positions
      const dayAxisItems = [
        { day: 1,  x: dayToX(1)  },
        { day: 3,  x: dayToX(3)  },
        { day: 7,  x: dayToX(7)  },
        { day: 14, x: dayToX(14) },
        { day: 30, x: dayToX(30) },
        { day: 45, x: dayToX(45) },
        { day: 60, x: dayToX(60) },
        { day: 90, x: dayToX(90) },
      ];

      return (
        <div style={{
          minHeight:'100vh', background:'#161412', color:'#fff',
          fontFamily:"'Poppins', system-ui, -apple-system, BlinkMacSystemFont, sans-serif",
        }}>
          {/* Ambient blobs */}
          <div style={{position:'fixed',inset:0,pointerEvents:'none',zIndex:0}}>
            <div style={{position:'absolute',top:'-15%',left:'10%',width:'45vw',height:'45vw',
              background:`radial-gradient(circle, rgba(237,71,36,0.10) 0%, transparent 65%)`,borderRadius:'50%'}}/>
            <div style={{position:'absolute',bottom:'-20%',right:'5%',width:'45vw',height:'45vw',
              background:'radial-gradient(circle, rgba(59,130,246,0.07) 0%, transparent 65%)',borderRadius:'50%'}}/>
          </div>

          {/* Navbar */}
          <nav style={{
            position:'sticky',top:0,zIndex:100,
            display:'flex',alignItems:'center',justifyContent:'space-between',
            padding:'0 max(24px,calc((100vw - 1200px)/2))',
            height:64,
            background:'rgba(22,20,18,0.85)',
            backdropFilter:'blur(12px)',
            borderBottom:'1px solid rgba(255,255,255,0.06)',
          }}>
            <div style={{display:'flex',alignItems:'center',gap:10}}>
              <JoinstickLogo size={38} variant="white" />
              <span className="bp-heading" style={{fontWeight:700,fontSize:'1.05rem',letterSpacing:'0.1em'}}>JOINSTICK</span>
            </div>
            <GlobalPills activeLabel="Transformation Journey" onNav={onNav} />
            <button onClick={onBack} style={{
              display:'flex',alignItems:'center',gap:6,
              background:'rgba(255,255,255,0.05)',
              border:'1px solid rgba(255,255,255,0.08)',
              borderRadius:10,padding:'8px 16px',
              color:'#a8a29e',fontSize:'0.875rem',cursor:'pointer',
              transition:'color 0.15s,background 0.15s',
            }}
              onMouseEnter={e=>{e.currentTarget.style.color='#fff';e.currentTarget.style.background='rgba(255,255,255,0.08)'}}
              onMouseLeave={e=>{e.currentTarget.style.color='#a8a29e';e.currentTarget.style.background='rgba(255,255,255,0.05)'}}>
              ← กลับหน้าหลัก
            </button>
          </nav>

          {/* Content */}
          <div className="mr-section" style={{
            position:'relative',zIndex:1,
            padding:'20px 20px 24px',
            maxWidth:1280,margin:'0 auto',
          }}>

            {/* COMPACT HERO */}
            <section className="fade-in" style={{marginBottom:18}}>
              <div style={{display:'flex',alignItems:'baseline',gap:14,flexWrap:'wrap'}}>
                <div style={{
                  display:'inline-flex',alignItems:'center',gap:8,
                  background:'rgba(237,71,36,0.10)',border:'1px solid rgba(237,71,36,0.28)',
                  borderRadius:999,padding:'4px 12px',alignSelf:'center',
                }}>
                  <span className="anim-pulse" style={{width:6,height:6,borderRadius:'50%',background:'#ED4724',display:'inline-block',boxShadow:'0 0 8px rgba(237,71,36,0.7)'}}/>
                  <span className="bp-slogan" style={{color:'#ED4724',fontSize:'0.66rem',fontWeight:600,letterSpacing:'0.08em'}}>JOURNEY · 90 DAYS</span>
                </div>
                <h1 className="bp-heading" style={{
                  fontSize:'clamp(1.4rem, 2.4vw, 1.75rem)',fontWeight:800,
                  letterSpacing:'-0.01em',margin:0,lineHeight:1.1,
                }}>
                  Transformation Journey
                </h1>
                <p style={{
                  color:'#a8a29e',fontSize:'0.78rem',lineHeight:1.5,
                  margin:0,flex:'1 1 240px',
                }}>
                  เส้นทาง 90 วัน · Pre Class → In Class → Out of Class · 6 Stages
                </p>
              </div>
            </section>

            {/* PROPORTIONAL TIMELINE */}
            <section className="fade-in" style={{animationDelay:'0.08s',opacity:0,marginBottom:18}}>
              <div style={{
                background:'rgba(255,255,255,0.025)',
                border:'1px solid rgba(255,255,255,0.07)',
                borderRadius:14,
                padding:'18px 20px 12px',
                position:'relative',
                overflow:'hidden',
              }}>
                {/* Phase band strip */}
                <div style={{
                  position:'relative',display:'flex',height:24,marginBottom:10,
                  borderRadius:8,overflow:'hidden',
                  border:'1px solid rgba(255,255,255,0.06)',
                }}>
                  {phases.map((p, pi) => {
                    const left = dayToX(p.dayStart);
                    const right = dayToX(p.dayEnd);
                    const width = right - left;
                    return (
                      <div key={p.name} style={{
                        position:'absolute',left:`${left}%`,width:`${width}%`,top:0,bottom:0,
                        background: p.soft,
                        borderRight: '1px solid rgba(255,255,255,0.08)',
                        display:'flex',alignItems:'center',justifyContent:'flex-start',
                        paddingLeft:8,gap:6,
                        overflow:'hidden',
                      }}>
                        {/* Shimmer sweep (staggered per band) */}
                        <span aria-hidden="true" className="tj-shimmer" style={{animationDelay: `${1.6 + pi * 0.8}s`}}/>
                        <span style={{width:5,height:5,borderRadius:'50%',background:p.color,boxShadow:`0 0 8px ${p.color}`}}/>
                        <span style={{color:p.fg,fontSize:'0.62rem',fontWeight:800,letterSpacing:'0.04em',whiteSpace:'nowrap',position:'relative'}}>{p.name.toUpperCase()}</span>
                      </div>
                    );
                  })}
                </div>

                {/* Curve + stage markers */}
                <div style={{
                  position:'relative', height:200,
                }}>
                  {/* Growth curve SVG */}
                  <svg
                    viewBox="0 0 100 100"
                    preserveAspectRatio="none"
                    aria-hidden="true"
                    style={{
                      position:'absolute',inset:0,width:'100%',height:'100%',
                      pointerEvents:'none',
                    }}
                  >
                    <defs>
                      <linearGradient id="tj-curve-stroke" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%"   stopColor="#71717a"/>
                        <stop offset="20%"  stopColor="#ef4444"/>
                        <stop offset="35%"  stopColor="#f97316"/>
                        <stop offset="55%"  stopColor="#fbbf24"/>
                        <stop offset="78%"  stopColor="#22c55e"/>
                        <stop offset="100%" stopColor="#3b82f6"/>
                      </linearGradient>
                      <linearGradient id="tj-curve-fill" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%"   stopColor="#fbbf24" stopOpacity="0.22"/>
                        <stop offset="60%"  stopColor="#fbbf24" stopOpacity="0.06"/>
                        <stop offset="100%" stopColor="#fbbf24" stopOpacity="0"/>
                      </linearGradient>
                      {/* Reveal clip — animated rectangle widens left → right */}
                      <clipPath id="tj-reveal-clip" clipPathUnits="userSpaceOnUse">
                        <rect x="0" y="0" height="100" width="0">
                          <animate attributeName="width" from="0" to="100"
                            dur="1.8s" begin="0.1s" fill="freeze"
                            calcMode="spline" keyTimes="0;1" keySplines="0.65 0 0.35 1"/>
                        </rect>
                      </clipPath>
                    </defs>
                    {/* Fill (clipped by reveal) */}
                    <path d={fillPath} fill="url(#tj-curve-fill)" clipPath="url(#tj-reveal-clip)"/>
                    {/* Line — continuous, revealed by clip animation */}
                    <path id="tj-curve-path" d={curvePath} fill="none"
                      stroke="url(#tj-curve-stroke)" strokeWidth="2.2"
                      strokeLinecap="round" strokeLinejoin="round"
                      vectorEffect="non-scaling-stroke"
                      clipPath="url(#tj-reveal-clip)"/>
                    {/* Traveling spark — small dot that moves along the curve in a loop */}
                    <circle r="0.9" fill="#fff"
                      style={{filter:'drop-shadow(0 0 2px #fff) drop-shadow(0 0 4px #fbbf24)'}}>
                      <animateMotion dur="6s" repeatCount="indefinite" begin="1.6s"
                        rotate="auto">
                        <mpath xlinkHref="#tj-curve-path"/>
                      </animateMotion>
                      <animate attributeName="r" values="0.6;1.2;0.6" dur="2s" repeatCount="indefinite"/>
                      <animate attributeName="opacity" values="0;1;1;1;0" dur="6s" repeatCount="indefinite" begin="1.6s"/>
                    </circle>
                  </svg>

                  {/* Vertical guides + Stage markers */}
                  {stages.map(s => {
                    const xMid = stageX(s);
                    const yPct = stageToY(s.num);
                    const isSel = s.num === selectedNum;
                    const isHov = s.num === hoverNum;
                    const size = isSel ? 42 : (isHov ? 36 : 30);
                    return (
                      <React.Fragment key={s.num}>
                        {/* Dashed vertical line from curve point down to baseline */}
                        <div style={{
                          position:'absolute',left:`${xMid}%`,top:`${yPct}%`,bottom:0,
                          width:0,
                          borderLeft:`1px dashed ${s.color}55`,
                          opacity: isSel ? 0.9 : 0.35,
                          pointerEvents:'none',
                          transition:'opacity 0.2s',
                        }}/>
                        {/* Day range chip — shown below the curve point at top */}
                        <button
                          onClick={() => setSelectedNum(s.num)}
                          onMouseEnter={() => setHoverNum(s.num)}
                          onMouseLeave={() => setHoverNum(null)}
                          title={`${s.name} · ${s.role}`}
                          style={{
                            position:'absolute',
                            left:`${xMid}%`, top:`${yPct}%`,
                            transform:`translate(-50%, -50%)`,
                            width:size, height:size, borderRadius:'50%',
                            background: isSel ? s.color : `${s.color}33`,
                            border:`2px solid ${isSel ? s.color : `${s.color}99`}`,
                            color: isSel ? '#fff' : s.color,
                            fontWeight:800, fontSize: isSel ? '1.05rem' : '0.82rem',
                            display:'flex',alignItems:'center',justifyContent:'center',
                            cursor:'pointer',
                            boxShadow: isSel
                              ? `0 0 28px ${s.color}, 0 0 12px ${s.color}, 0 0 0 4px ${s.color}33`
                              : (isHov ? `0 0 16px ${s.color}99` : `0 0 8px ${s.color}55`),
                            transition:'all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1)',
                            zIndex: isSel ? 4 : 3,
                            padding:0,
                            opacity:0,
                            animation:`tjMarkerPop 0.55s ${0.45 + s.num * 0.15}s cubic-bezier(0.34, 1.56, 0.64, 1) forwards${isSel ? ', tjSelectedPulse 2.6s '+(0.45+s.num*0.15+0.55)+'s ease-in-out infinite' : ''}`,
                          }}>{s.num}</button>
                      </React.Fragment>
                    );
                  })}
                </div>

                {/* Stage name labels under each marker */}
                <div style={{position:'relative',height:36,marginTop:4}}>
                  {stages.map(s => {
                    const xMid = stageX(s);
                    const isSel = s.num === selectedNum;
                    const isHov = s.num === hoverNum;
                    return (
                      <button key={s.num}
                        onClick={() => setSelectedNum(s.num)}
                        onMouseEnter={() => setHoverNum(s.num)}
                        onMouseLeave={() => setHoverNum(null)}
                        style={{
                          position:'absolute',left:`${xMid}%`, top:0,
                          transform:'translateX(-50%)',
                          display:'flex',flexDirection:'column',alignItems:'center',gap:1,
                          background:'transparent',border:'none',cursor:'pointer',
                          padding:'2px 4px',
                          minWidth: 64, maxWidth: 110,
                          opacity:0,
                          animation:`tjLabelRise 0.5s ${0.7 + s.num * 0.15}s ease forwards`,
                        }}>
                        <span style={{
                          color: isSel ? s.color : (isHov ? '#fff' : '#d4d4d8'),
                          fontSize:'0.72rem',fontWeight: isSel ? 800 : 700,
                          letterSpacing:'-0.01em',whiteSpace:'nowrap',
                          transition:'color 0.18s',
                        }}>{s.name}</span>
                        <span style={{
                          color: isSel ? '#a1a1aa' : '#71717a',
                          fontSize:'0.6rem',fontWeight:600,whiteSpace:'nowrap',
                        }}>{s.role}</span>
                      </button>
                    );
                  })}
                </div>

                {/* Day axis */}
                <div style={{
                  position:'relative',marginTop:8,paddingTop:8,
                  borderTop:'1px dashed rgba(255,255,255,0.08)',
                  height:24,
                }}>
                  {dayAxisItems.map(({day, x}) => (
                    <div key={day} style={{
                      position:'absolute',left:`${x}%`,top:0,
                      transform:'translateX(-50%)',
                      display:'flex',flexDirection:'column',alignItems:'center',gap:1,
                    }}>
                      <span style={{
                        width:1,height:5,background:'rgba(255,255,255,0.20)',
                      }}/>

      const freeTrialRef = useRef(null);
      const ctaRef = useRef(null);
      const [packagesInView, setPackagesInView] = useState(false);
      const [featuresInView, setFeaturesInView] = useState(false);
      const [freeTrialInView, setFreeTrialInView] = useState(false);
      const [ctaInView, setCtaInView] = useState(false);
      const [animatedPrices, setAnimatedPrices] = useState([0, 0]);

      useEffect(() => {
        // Trigger animations on scroll position; also a mount-based fallback
        // so initial above-the-fold sections animate in immediately.
        const check = () => {
          const inViewport = (ref) => {
            if (!ref.current) return false;
            const r = ref.current.getBoundingClientRect();
            return r.top < window.innerHeight * 0.9 && r.bottom > 0;
          };
          if (inViewport(packagesRef))  setPackagesInView(true);
          if (inViewport(featuresRef))  setFeaturesInView(true);
          if (inViewport(freeTrialRef)) setFreeTrialInView(true);
          if (inViewport(ctaRef))       setCtaInView(true);
        };
        // Fire shortly after mount so above-the-fold sections animate
        const t1 = setTimeout(check, 80);
        // Also listen to scroll so below-the-fold sections trigger on scroll
        window.addEventListener('scroll', check, { passive: true });
        window.addEventListener('resize', check);
        return () => {
          clearTimeout(t1);
          window.removeEventListener('scroll', check);
          window.removeEventListener('resize', check);
        };
      }, []);

        const tick = (now) => {
          const t = Math.min(1, (now - start) / dur);
          const eased = 1 - Math.pow(1 - t, 3);
          setAnimatedPrices([
            Math.round(targets[0] * eased),
            Math.round(targets[1] * eased),
          ]);
          if (t < 1) raf = requestAnimationFrame(tick);
        };
        raf = requestAnimationFrame(tick);
        return () => cancelAnimationFrame(raf);

    /* ── JourneyNav ─ fixed overlay outside phone ── */
    function JourneyNav({ onJourney, onNext, nextLabel, nextColor }) {
      const font = "'Poppins', system-ui, sans-serif";
      return (
        <>
          {/* ← Back to Journey Timeline */}
          <button
            onClick={onJourney}
            className="journey-nav-btn left"
            style={{
              position:'fixed', top:28, left:28, zIndex:9999,
              display:'flex', alignItems:'center', gap:8,
              background:'rgba(24,24,27,0.85)', backdropFilter:'blur(14px)',
              border:'1px solid rgba(255,255,255,0.12)',
              borderRadius:12, padding:'10px 18px',
              color:'#a1a1aa', fontSize:'0.82rem', fontWeight:600,
              cursor:'pointer', fontFamily:font,
              transition:'color 0.15s, background 0.15s, border-color 0.15s',
              boxShadow:'0 4px 20px rgba(0,0,0,0.4)',
            }}
            onMouseEnter={e=>{e.currentTarget.style.color='#fff';e.currentTarget.style.background='rgba(40,40,45,0.95)';e.currentTarget.style.borderColor='rgba(255,255,255,0.22)';}}
            onMouseLeave={e=>{e.currentTarget.style.color='#a1a1aa';e.currentTarget.style.background='rgba(24,24,27,0.85)';e.currentTarget.style.borderColor='rgba(255,255,255,0.12)';}}>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
              <polyline points="15 18 9 12 15 6"/>
            </svg>
            Journey Timeline
          </button>

          {/* Next Phase → */}
          {onNext && (
            <button
              onClick={onNext}
              className="journey-nav-btn right"
              style={{
                position:'fixed', top:28, right:28, zIndex:9999,
                display:'flex', alignItems:'center', gap:8,
                background:`rgba(24,24,27,0.85)`, backdropFilter:'blur(14px)',
                border:`1px solid ${nextColor}55`,
                borderRadius:12, padding:'10px 18px',
                color:nextColor, fontSize:'0.82rem', fontWeight:600,
                cursor:'pointer', fontFamily:font,
                transition:'color 0.15s, background 0.15s, border-color 0.15s',
                boxShadow:`0 4px 20px rgba(0,0,0,0.4), 0 0 0 1px ${nextColor}11`,
              }}
              onMouseEnter={e=>{e.currentTarget.style.background=`${nextColor}18`;e.currentTarget.style.borderColor=`${nextColor}99`;}}
              onMouseLeave={e=>{e.currentTarget.style.background='rgba(24,24,27,0.85)';e.currentTarget.style.borderColor=`${nextColor}55`;}}>
              {nextLabel}
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="9 18 15 12 9 6"/>
              </svg>
            </button>
          )}
        </>
      );
    }

    /* ── App shell ────────────────────────────────── */
    function App() {
      const [scene, setScene] = useState('landing'); // 'landing'|'phases'|'preclass'|'inclass'|'learner'|'hr'|'manager'|'transform'|'journey'

      const goTo = (s) => setScene(s);

      const NEXT = {
        preclass: { scene:'inclass',  label:'In-Class',      color:'#ED4724' },
        inclass:  { scene:'learner',  label:'Out of Class',  color:'#6366f1' },
        learner:  { scene:'hr',       label:'HR Dashboard',  color:'#818cf8' },
      };

      const isPhase = ['preclass','inclass','learner'].includes(scene);

      return (
        <>
          {isPhase && (
            <JourneyNav
              onJourney={() => goTo('phases')}
              onNext={NEXT[scene] ? () => goTo(NEXT[scene].scene) : null}
              nextLabel={NEXT[scene]?.label}
              nextColor={NEXT[scene]?.color}
            />
          )}

          {scene === 'landing' && (
            <LandingPage
              onEnter={() => goTo('phases')}
              onShiftStage={() => goTo('transform')}
              onJourney={() => goTo('journey')}
              onNav={goTo}
            />
          )}
          {scene === 'phases'  && (
            <PhaseSelect
              onSelect={(phase) =>
                goTo(phase === 'preclass'  ? 'preclass'  :
                     phase === 'inclass'   ? 'inclass'   :
                     phase === 'hr'        ? 'hr'        :
                     phase === 'manager'   ? 'manager'   :
                     phase === 'transform' ? 'transform' :
                     phase === 'journey'   ? 'journey'   : 'learner')
              }
              onBack={() => goTo('landing')}
              onNav={goTo}
            />
          )}
          {scene === 'preclass'  && <PreClassApp   onBack={() => goTo('phases')} onNext={() => goTo('inclass')} />}
          {scene === 'inclass'   && <InClassApp    onBack={() => goTo('phases')} onNext={() => goTo('learner')} />}
          {scene === 'hr'        && <HRDashboard   onBack={() => goTo('manager')} />}
          {scene === 'manager'   && <ManagerReview onBack={() => goTo('phases')} onNav={goTo} />}
          {scene === 'transform' && <TransformStage onBack={() => goTo('landing')} onNav={goTo} />}
          {scene === 'journey'   && <TransformationJourney onBack={() => goTo('landing')} onNav={goTo} />}
          {scene === 'available' && <AvailableCoursePage onBack={() => goTo('landing')} onNav={goTo} />}
          {scene === 'learner'   && <LearnerApp />}
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
